<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control Tower · protótipo</title>
<!--
  PROTOTIPO DESCARTAVEL - Control Tower (F12), arquivo unico, sem build. Outro sistema, com login e permissoes proprios (D12, D14).
  Tokens e componentes sao copiados do index.html (mesma identidade). Dados de exemplo em localStorage "flow.ct"
  ("Restaurar dados de exemplo" no rodape do menu). Valores de preco, limites [L] e textos sao de exemplo, nao decisao.

  Hash (combinavel com &):
    #screen=login[&ip=bloqueado]                  entrada (restricao por IP, S12/A10.1)
    #screen=visao                                  visao geral / cockpit (F12.1, F12.14)
    #screen=orgs[&q=&st=teste|ativa|atraso|suspensa|bloqueada|encerrada&plano=p1&page=1&size=10]
    #screen=org&id=o1&tab=resumo|assin|unid|usu|func|hist      ficha da organizacao
    #screen=cobranca   #screen=planos   #screen=flags   #screen=comunicados
    #screen=operacao   #screen=auditoria[&tipo=&q=&adm=&page=]   #screen=admins[&tab=pessoas|perfis]
    #screen=config&tab=assin|plat|acesso|hist     #screen=impersonacao (so com sessao ativa)
    &profile=S|U|F|O|L     entra como Super admin | Suporte | Financeiro | Operacoes | Somente leitura
    &theme=dark|light
  Teclas: [ recolhe o menu / Ctrl+K busca organizacao / Esc fecha.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

<style id="tokens">
:root,[data-scope=light]{
  /* superficie e texto */
  --bg:#F8F8F9; --card:#FFFFFF; --line:#E5E7EB; --line-strong:#D1D5DB;
  --ink:#0F172A; --muted:#5B6678; --faint:#8A93A3;
  /* marca */
  --brand:#3367D6; --brand-ink:#FFFFFF; --brand-soft:#EAF1FE;
  /* status: marcador + texto legivel + tom suave. Rosa-carmim, verde-azulado e ambar fosco: frios/calmos como o azul da marca; textos >= 4,5:1 */
  --open:#2B7A62; --wait:#C48A1D; --alert:#BE3F55; --paid:#94A3B8;
  --wait-ink:#85570F; --paid-ink:#5B6678;
  --open-soft:#E8F4EF; --wait-soft:#FAF1DD; --alert-soft:#FBEFF1;
  --closed:var(--paid); --closed-ink:var(--paid-ink);
  /* superficies auxiliares */
  --hl:#E6EDFC; --hover:#F1F2F4; --sidebar:#F8F8F9; --scrim:rgba(15,23,42,.45);
  color-scheme:light;
}
/* [data-scope=light|dark] permite mostrar os dois temas lado a lado na mesma pagina (catalogo de componentes) */
:root{
  /* forma (ajustaveis pela bolinha de configuracao) */
  --radius:14px; --radius-card:16px; --radius-sm:12px; --radius-sheet:20px;
  --border-w:1px;        /* espessura das bordas */
  --density:1;           /* escala de espacamentos e alturas de linha */
  --text-scale:1;        /* escala do texto (1 = 100%) */
  --r:var(--radius); --r-card:var(--radius-card);
  /* tipografia: uma familia sans para tudo */
  --font-title:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:var(--font-title);
  --sans:var(--font-ui);
}
:root[data-theme=dark],[data-scope=dark]{
  --bg:#0F1115; --card:#171A1F; --line:#272B33; --line-strong:#383E48;
  --ink:#F3F4F6; --muted:#A3AAB8; --faint:#7D8594;
  --brand:#6AA8FF; --brand-ink:#0A1226; --brand-soft:#15233F;
  --open:#5BC29A; --wait:#E0AC48; --alert:#F27C8E; --paid:#9AA1AE;
  --wait-ink:#E0AC48; --paid-ink:#A3AAB8;
  --open-soft:#12261F; --wait-soft:#2A2312; --alert-soft:#2C1820;
  --hl:#1A2A4A; --hover:#1F232A; --sidebar:#0F1115; --scrim:rgba(0,0,0,.6);
  --closed:var(--paid); --closed-ink:var(--paid-ink);
  color-scheme:dark;
}
</style>

<style id="components">
:root,[data-scope]{
  --fl-btn-h:34px;--fl-btn-hmin:0px;--fl-btn-px:14px;--fl-btn-fs:14px;--fl-btn-fw:500;--fl-btn-gap:6px;--fl-btn-jc:normal;
  --fl-btn-bd:var(--line-strong);--fl-btn-hover:var(--hover);--fl-pri-hover:brightness(.93);--fl-press:translateY(1px);--fl-dis:.5;--fl-danger-bd:var(--line-strong);
  --fl-sm-h:30px;--fl-sm-px:10px;--fl-sm-fs:13px;--fl-sm-fw:500;--fl-sm-minw:0px;--fl-icon-w:34px;
  --fl-chip-h:30px;--fl-chip-px:10px;--fl-chip-fs:14px;--fl-chip-gap:6px;--fl-chip-bg:transparent;--fl-chip-fg:var(--muted);--fl-chip-on-bg:var(--card);--fl-chip-on-fg:var(--ink);--fl-chip-on-bd:var(--line-strong);
  --fl-badge-gap:7px;--fl-badge-fw:500;--fl-badge-open-fg:inherit;
  --fl-field-h:34px;--fl-field-px:10px;--fl-field-gap:8px;--fl-search-pl:10px;--fl-field-bd:var(--line);--fl-field-bg:var(--card);
  --fl-search-ip:1px 2px;--fl-seg-h:28px;--fl-tab-h:46px;--fl-sk-r:var(--radius-sm);--fl-sk-op:1;--fl-sk-lo:.45;--fl-focus-w:2px;--fl-hit:34px
}
:root[data-flavor=mobile],:root[data-flavor=mobile] [data-scope],.flv-m{
  --fl-btn-h:52px;--fl-btn-hmin:48px;--fl-btn-px:20px;--fl-btn-fs:17px;--fl-btn-fw:600;--fl-btn-gap:8px;--fl-btn-jc:center;
  --fl-btn-bd:var(--line);--fl-btn-hover:var(--card);--fl-pri-hover:none;--fl-press:scale(.98);--fl-dis:.45;--fl-danger-bd:color-mix(in srgb,var(--alert) 55%,var(--line));
  --fl-sm-h:44px;--fl-sm-px:12px;--fl-sm-fs:14px;--fl-sm-fw:500;--fl-sm-minw:44px;--fl-icon-w:44px;
  --fl-chip-h:44px;--fl-chip-px:14px;--fl-chip-fs:15px;--fl-chip-gap:8px;--fl-chip-bg:var(--card);--fl-chip-fg:var(--ink);--fl-chip-on-bg:var(--brand);--fl-chip-on-fg:var(--brand-ink);--fl-chip-on-bd:var(--brand);
  --fl-badge-gap:5px;--fl-badge-fw:600;--fl-badge-open-fg:var(--open);
  --fl-field-h:48px;--fl-field-px:14px;--fl-field-gap:calc(9px + var(--border-w));--fl-search-pl:calc(13px - var(--border-w));--fl-field-bd:var(--line);--fl-field-bg:var(--card);
  --fl-search-ip:0px;--fl-seg-h:44px;--fl-tab-h:46px;--fl-sk-r:var(--radius-card);--fl-sk-op:.55;--fl-sk-lo:.25;--fl-focus-w:3px;--fl-hit:44px
}

svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shrink{from{width:100%}to{width:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes skeleton-pulse{50%{opacity:var(--fl-sk-lo)}}

/* Button */
.btn{display:inline-flex;align-items:center;justify-content:var(--fl-btn-jc);gap:var(--fl-btn-gap);min-height:max(var(--fl-btn-hmin),calc(var(--fl-btn-h)*var(--density)));padding:0 var(--fl-btn-px);border-radius:var(--r);border:var(--border-w) solid var(--fl-btn-bd);background:var(--card);color:inherit;font-family:inherit;font-size:calc(var(--fl-btn-fs)*var(--text-scale));font-weight:var(--fl-btn-fw);white-space:nowrap;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--fl-btn-hover)}
.btn:active:not(:disabled){transform:var(--fl-press)}
.btn--primary,.btn--primary:hover{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);--spin:var(--brand-ink)}
.btn--primary:hover{filter:var(--fl-pri-hover)}
.btn--ghost,.btn--ghost:hover{border-color:transparent;background:transparent;color:var(--muted)}
.btn--ghost:hover{background:var(--hover);color:var(--ink)}
.btn--danger{color:var(--alert);border-color:var(--fl-danger-bd)}
.btn--sm{min-height:var(--fl-sm-h);min-width:var(--fl-sm-minw);padding:0 var(--fl-sm-px);font-size:calc(var(--fl-sm-fs)*var(--text-scale));font-weight:var(--fl-sm-fw)}
.btn--icon{width:var(--fl-icon-w);padding:0;justify-content:center}
.btn--pill{border-radius:999px}
.btn--block{flex:1}
.btn:disabled{opacity:var(--fl-dis);cursor:not-allowed}
.btn.is-loading{position:relative;color:transparent!important;pointer-events:none}
.btn.is-loading::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--spin,var(--ink));border-right-color:transparent;animation:spin .7s linear infinite}

/* Chip / filtro */
.chip{display:inline-flex;align-items:center;gap:var(--fl-chip-gap);min-height:var(--fl-chip-h);padding:0 var(--fl-chip-px);border:var(--border-w) solid var(--line);border-radius:var(--r);background:var(--fl-chip-bg);color:var(--fl-chip-fg);font-family:inherit;font-size:calc(var(--fl-chip-fs)*var(--text-scale));font-weight:500;cursor:pointer}
.chip[aria-pressed=true]{background:var(--fl-chip-on-bg);color:var(--fl-chip-on-fg);border-color:var(--fl-chip-on-bd)}
.chip__count{color:var(--muted);font-size:calc(13px*var(--text-scale))}
.chip[aria-pressed=true] .chip__count{color:inherit;opacity:.8}

/* Segmented control */
.seg{display:inline-flex;border:var(--border-w) solid var(--line-strong);border-radius:var(--r);padding:2px;background:var(--card)}
.seg button{border:0;background:none;min-height:var(--fl-seg-h);padding:0 12px;border-radius:var(--radius-sm);color:var(--muted);font-weight:500;font-family:inherit;font-size:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink)}

/* Tabs */
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:2px 8px 0;border-bottom:var(--border-w) solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:var(--fl-tab-h);padding:0 12px;font-family:inherit;font-weight:600;font-size:calc(15px*var(--text-scale));color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brand)}

/* Field */
.field{display:block;height:var(--fl-field-h);padding:0 var(--fl-field-px);border:var(--border-w) solid var(--fl-field-bd);border-radius:var(--r);background:var(--fl-field-bg);color:var(--ink);font:inherit}
.field:disabled{opacity:.6;cursor:not-allowed}
.field--error{border-color:var(--alert)}
.field--area{height:auto;min-height:88px;padding:10px var(--fl-field-px);resize:vertical;width:100%}
.field--search{display:flex;align-items:center;gap:var(--fl-field-gap);padding-left:var(--fl-search-pl)}
.field--search:focus-within{outline:var(--fl-focus-w) solid var(--brand);outline-offset:2px}
.field--search svg{flex:none;color:var(--muted)}
.field--search input{border:0;background:none;outline:0;flex:1;min-width:0;height:100%;padding:var(--fl-search-ip);font:inherit;color:inherit}
.field-label{display:block;font-size:calc(12px*var(--text-scale));font-weight:500;color:var(--muted);margin:0 0 6px}
.field-msg{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:calc(12px*var(--text-scale));color:var(--muted)}
.field-msg--error{color:var(--alert);font-weight:500}
.field-msg svg{width:14px;height:14px}
kbd{font:500 calc(11px*var(--text-scale)) var(--sans);color:var(--muted);border:var(--border-w) solid var(--line);border-radius:4px;padding:1px 5px;background:var(--bg)}

/* Stepper e quantidade */
.stepper{display:inline-flex;align-items:center}
.stepper button{width:44px;height:44px;border:var(--border-w) solid var(--line);border-radius:var(--r);background:var(--card);display:grid;place-items:center;cursor:pointer}
.stepper b{min-width:28px;text-align:center;font:600 calc(17px*var(--text-scale)) var(--serif)}
.stepper--sm button{width:32px;height:32px}
.sq{width:48px;height:48px;border:var(--border-w) solid var(--line);border-radius:var(--r);display:grid;place-items:center;background:var(--card);font-weight:600;font-size:calc(15px*var(--text-scale));cursor:pointer}
.sq--add{width:56px;border-color:var(--ink)}
.sq--add:active{background:var(--ink);color:var(--bg)}
.sq--qty{font-size:calc(14px*var(--text-scale))}

/* Escolhas: checkbox, radio, switch (novos) */
.check,.radio,.switch{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:var(--fl-hit);cursor:pointer}
.check input,.radio input{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;flex:none;border:var(--border-w) solid var(--line-strong);background:var(--card);display:grid;place-items:center;cursor:pointer}
.check input{border-radius:max(3px,calc(var(--radius-sm)/2))}
.radio input{border-radius:50%}
.check input:checked{background:var(--brand);border-color:var(--brand)}
.check input:checked::after{content:"";width:10px;height:5px;border-left:2px solid var(--brand-ink);border-bottom:2px solid var(--brand-ink);transform:translateY(-1px) rotate(-45deg)}
.radio input:checked{border:6px solid var(--brand)}
.check input:disabled,.radio input:disabled{opacity:.5;cursor:not-allowed}
.switch input{position:absolute;left:0;top:50%;width:44px;height:28px;margin:-14px 0 0;opacity:0;cursor:pointer}
.switch__track{position:relative;flex:none;width:44px;height:26px;border-radius:999px;background:var(--line-strong);transition:background-color .15s}
.switch__track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:transform .15s}
.switch input:checked+.switch__track{background:var(--brand)}
.switch input:checked+.switch__track::after{transform:translateX(18px)}
.switch input:focus-visible+.switch__track{outline:2px solid var(--brand);outline-offset:2px}
.switch input:disabled+.switch__track{opacity:.5}

/* Badge de status: marcador + palavra, nunca so cor */
.badge{display:inline-flex;align-items:center;gap:var(--fl-badge-gap);font-size:calc(13px*var(--text-scale));font-weight:var(--fl-badge-fw);white-space:nowrap}
.badge i{width:8px;height:8px;flex:none;background:var(--c);border-radius:50%}
.badge svg{width:15px;height:15px}
.badge--open{--c:var(--open);color:var(--fl-badge-open-fg)}
.badge--wait{--c:var(--wait);color:var(--wait-ink)}
.badge--alert{--c:var(--alert);color:var(--alert)}
.badge--closed{--c:var(--paid);color:var(--paid-ink)}
.badge--alert i{border-radius:1px;transform:rotate(45deg)}
.badge--wait i{border-radius:1px}
.badge--closed i{background:none;border:1.5px solid var(--c)}

/* Card, avatar, empty, skeleton */
.card{background:var(--card);border:var(--border-w) solid var(--line);border-radius:var(--r-card)}
.card--alert{border-color:color-mix(in srgb,var(--alert) 55%,var(--line))}
.card--selected{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.avatar{flex:none;width:28px;height:28px;border-radius:50%;border:var(--border-w) solid var(--line-strong);display:grid;place-items:center;font:600 calc(12px*var(--text-scale)) var(--sans);background:var(--card)}
.avatar--lg{width:40px;height:40px;font-size:calc(14px*var(--text-scale))}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r-card);padding:56px 24px;text-align:center;background:var(--card)}
.empty--plain{border:0;border-radius:0;background:none;padding:0}
.skeleton{background:var(--line);border-radius:var(--fl-sk-r);opacity:var(--fl-sk-op);animation:skeleton-pulse 1.4s ease-in-out infinite}

/* Banner */
.banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border:var(--border-w) solid var(--line);border-radius:var(--r)}
.banner--error{border-color:color-mix(in srgb,var(--alert) 55%,var(--line));background:var(--alert-soft)}
.banner--warning{border-color:var(--wait);background:var(--card);color:var(--wait-ink)}
.banner--info{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));background:var(--brand-soft)}
.banner--queue{margin:0 16px 10px;padding:10px 12px;gap:10px;font-size:calc(14px*var(--text-scale));font-weight:600;text-align:left;width:calc(100% - 32px);min-height:48px}
.banner span.l{flex:1;min-width:0}
.banner small{display:block;font-weight:400;color:var(--muted)}

/* Toast: aparencia aqui; posicao em cada app */
.toast{background:var(--ink);color:var(--bg);border-radius:var(--r)}
.toast--action{position:relative;display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 4px 4px 14px}
.toast--action span{flex:1;font-size:calc(15px*var(--text-scale))}
.toast--action button{min-height:44px;padding:0 14px;font-weight:700;color:var(--bg);text-decoration:underline;text-underline-offset:3px;background:none;border:0;font-family:inherit;font-size:inherit;cursor:pointer}
.toast--action i{position:absolute;left:0;bottom:0;height:3px;background:var(--bg);opacity:.5;animation:shrink var(--dur,8s) linear forwards;border-radius:0 0 0 var(--r)}

/* Sheet (folha inferior) */
.backdrop{position:absolute;inset:0;background:var(--scrim);z-index:var(--z-backdrop);animation:fade .2s var(--ease,cubic-bezier(.22,1,.36,1))}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:var(--z-sheet);background:var(--card);border-top:var(--border-w) solid var(--line);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;padding:6px 16px calc(16px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;animation:up .28s var(--ease,cubic-bezier(.22,1,.36,1))}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h2{font:600 calc(20px*var(--text-scale))/1.25 var(--serif);letter-spacing:-.02em;margin:0 0 4px}
.sheet .lead{color:var(--muted);font-size:calc(15px*var(--text-scale));margin:0 0 14px}
.qty-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qty-grid button{min-height:56px;border:var(--border-w) solid var(--line);border-radius:var(--r);background:var(--bg);color:inherit;font:600 calc(20px*var(--text-scale)) var(--serif);cursor:pointer}
.qty-grid button:active{background:var(--ink);color:var(--bg)}
.opt{min-height:52px;padding:0 14px;border:var(--border-w) solid var(--line);border-radius:var(--r);background:var(--bg);color:inherit;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:500;font-family:inherit;font-size:inherit;cursor:pointer}
.opt[aria-pressed=true],.opt[aria-checked=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card);font-weight:600}

/* Dialog de confirmacao (novo) */
.dialog{width:min(420px,100%);background:var(--card);border:var(--border-w) solid var(--line-strong);border-radius:var(--radius-card);padding:20px;box-shadow:0 8px 24px rgb(15 23 42/.14)}
.dialog h2{margin:0 0 6px;font:600 calc(18px*var(--text-scale))/1.25 var(--serif);letter-spacing:-.015em}
.dialog p{margin:0;color:var(--muted)}
.dialog__actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* Dados (novos): chave-valor, dinheiro, tempo aberto, linha de lista, paginacao */
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:500;font-variant-numeric:tabular-nums lining-nums}
.money{font-variant-numeric:tabular-nums lining-nums;font-weight:600;white-space:nowrap}
.money small{color:var(--muted);font-weight:500;margin-right:4px}
.money--lg{font:600 calc(26px*var(--text-scale))/1 var(--serif);letter-spacing:-.025em}
.money--lg small{font-size:calc(14px*var(--text-scale))}
.elapsed{font-variant-numeric:tabular-nums;color:var(--muted)}
.elapsed--alert{color:var(--alert);font-weight:600}
.list-row{display:flex;align-items:center;gap:12px;min-height:calc(52px*var(--density));padding:8px 0;border-bottom:var(--border-w) solid var(--line)}
.list-row__main{flex:1;min-width:0}
.list-row__main small{display:block;color:var(--muted)}
.pager{display:inline-flex;align-items:center;gap:4px}
.pager .btn[aria-current=page]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
</style>

<style>
:root{--z-menu:20;--z-sticky:10;--z-dialog:50;--z-toast:60;--z-imp:70;--ease:cubic-bezier(.25,1,.5,1)}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 calc(14px*var(--text-scale))/1.45 var(--sans);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:calc(12px*var(--text-scale))}
.badge--info{--c:var(--brand);color:var(--brand)}
.badge--info i{border-radius:50%}
.btn svg,.field--search svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.btn--danger svg{stroke:var(--alert)}

/* casco */
#shell{display:flex;flex-direction:column;height:100vh}
.app{--sw:248px;flex:1;min-height:0;display:grid;grid-template-columns:var(--sw) minmax(0,1fr);transition:grid-template-columns .22s var(--ease)}
body.rail .app{--sw:72px}
.side{background:var(--sidebar);border-right:var(--border-w) solid var(--line);display:flex;flex-direction:column;padding:12px;overflow-x:hidden;overflow-y:auto;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:8px 9px;border:var(--border-w) solid var(--line);border-radius:var(--r);background:var(--card);white-space:nowrap;overflow:hidden;flex:none}
.brand .mark{flex:none;width:28px;height:28px;border-radius:var(--radius-sm);background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand .mark svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.brand b{display:block;font-weight:600;font-size:calc(13px*var(--text-scale));line-height:1.2}
.brand span{display:block;font-size:calc(12px*var(--text-scale));color:var(--muted)}
.nav-label{margin:22px 8px 6px;font-size:calc(12px*var(--text-scale));color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden}
.nav a{display:flex;align-items:center;gap:6px;padding:calc(7px*var(--density)) 8px;white-space:nowrap;min-height:calc(36px*var(--density));border-radius:var(--r);color:var(--muted);text-decoration:none;position:relative;font-weight:500}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a[aria-current=page]{color:var(--ink);background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.nav .ico{width:32px;height:20px;flex:none;display:grid;place-items:center}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav .count{margin-left:auto;font-size:calc(12px*var(--text-scale));color:var(--muted)}
.nav .count[data-alert]{color:var(--alert);font-weight:700}
.nav .t,.brand .tx,.me .tx{transition:opacity .15s}
body.rail .nav .t,body.rail .brand .tx,body.rail .me .tx{opacity:0;pointer-events:none}
body.rail .nav-label{margin:14px 10px 8px;height:1px;background:var(--line);font-size:0}
body.rail .nav .count{position:absolute;top:1px;right:2px;margin:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-size:calc(11px*var(--text-scale));font-weight:600;line-height:16px;text-align:center}
body.rail .nav .count[data-alert]{background:var(--alert);color:var(--brand-ink)}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 10px 2px;border:0;border-top:var(--border-w) solid var(--line);background:none;border-radius:0;text-align:left;width:100%;white-space:nowrap;overflow:hidden;flex:none}
.me:hover{background:var(--hover)}
.me b{font-weight:600;font-size:calc(13px*var(--text-scale));display:block;line-height:1.2}
.me span{font-size:calc(12px*var(--text-scale));color:var(--muted)}
.side-foot{flex:none;font-size:calc(12px*var(--text-scale));color:var(--faint);padding:8px 10px 0}
.side-foot button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:inherit}
body.rail .side-foot{display:none}
.main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 28px;border-bottom:var(--border-w) solid var(--line);background:var(--bg)}
.topbar .sbtn{margin-left:-8px}
body.rail .sbtn svg{transform:scaleX(-1)}
.topbar .sw{position:relative;flex:0 1 380px}
.topbar .field--search{width:100%}
.topbar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:var(--border-w) solid var(--line-strong);border-radius:999px;background:var(--card);font-size:calc(12.5px*var(--text-scale));font-weight:500;color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--open)}
.pill--env{color:var(--ink)}
.pill--env i{background:var(--alert);border-radius:1px;transform:rotate(45deg)}
.crumbs{padding:calc(14px*var(--density)) calc(28px*var(--density)) 0}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.crumbs li{display:flex;align-items:center;color:var(--muted);font-size:calc(13px*var(--text-scale));line-height:1.3}
.crumbs li+li::before{content:"›";content:"›" / "";margin:0 4px;color:var(--faint)}
.crumbs a{color:var(--muted);text-decoration:none;padding:2px 6px;margin:0 -2px;border-radius:var(--radius-sm)}
.crumbs li:first-child>a{margin-left:-6px}
.crumbs a:hover{color:var(--ink);background:var(--hover)}
.crumbs li[aria-current=page]{color:var(--ink);font-weight:500;padding:2px 4px}
.content{flex:1;overflow:auto;padding:calc(24px*var(--density)) calc(28px*var(--density)) calc(48px*var(--density));display:flex;flex-direction:column;gap:calc(20px*var(--density))}
.content:focus{outline:0}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font:600 calc(28px*var(--text-scale))/1.15 var(--serif);letter-spacing:-.025em;text-wrap:balance}
.head p{margin:4px 0 0;color:var(--muted)}
.head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
h2.sec{margin:0;font:600 calc(16px*var(--text-scale))/1.25 var(--serif);letter-spacing:-.01em}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.sec-h .sub{color:var(--muted);font-size:calc(13px*var(--text-scale))}
.sec-h .btn{margin-left:auto}

/* stats */
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(12px*var(--density))}
.stat{padding:calc(16px*var(--density)) calc(18px*var(--density)) calc(14px*var(--density))}
.stat .l{color:var(--muted);font-size:calc(13px*var(--text-scale))}
.stat .v{font:600 calc(30px*var(--text-scale))/1.1 var(--serif);margin-top:6px;letter-spacing:-.025em}
.stat .v small{font-size:calc(16px*var(--text-scale));color:var(--muted);font-weight:500;letter-spacing:0}
.stat .n{font-size:calc(12px*var(--text-scale));color:var(--muted);margin-top:4px}
.stat .n.al{color:var(--alert);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:calc(16px*var(--density))}
.pad{padding:calc(16px*var(--density)) calc(18px*var(--density))}

/* barra de filtros */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .field--search{flex:0 1 320px}
.bar .info{margin-left:auto;color:var(--muted);font-size:calc(13px*var(--text-scale))}
.bar select.field{padding:0 8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}

/* tabela */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:0 14px;height:calc(52px*var(--density));text-align:left;border-bottom:var(--border-w) solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
th{height:calc(38px*var(--density));font-weight:500;font-size:calc(13px*var(--text-scale));color:var(--muted);background:color-mix(in srgb,var(--bg) 50%,var(--card))}
thead th:first-child{border-top-left-radius:var(--r-card)} thead th:last-child{border-top-right-radius:var(--r-card)}
td.r,th.r{text-align:right}
tbody tr.go{cursor:pointer}
tbody tr.go:hover{background:var(--hover)}
td .two{display:flex;flex-direction:column;line-height:1.3}
td .two small{color:var(--muted);font-size:calc(12.5px*var(--text-scale))}
td .two a{font-weight:600;text-decoration:none}
td .two a:hover{text-decoration:underline;text-underline-offset:3px}
td .who{display:flex;align-items:center;gap:10px}
td.wrap{white-space:normal}
.tag{display:inline-block;padding:1px 8px;border:var(--border-w) solid var(--line-strong);border-radius:999px;font-size:calc(12px*var(--text-scale));font-weight:500;color:var(--muted)}
.tag--brand{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,var(--line));background:var(--brand-soft)}
.tag--wait{color:var(--wait-ink);border-color:var(--wait);background:var(--wait-soft)}
.tag--alert{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 55%,var(--line));background:var(--alert-soft)}
.foot{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:var(--border-w) solid var(--line);color:var(--muted);font-size:calc(13px*var(--text-scale));flex-wrap:wrap}
.foot .pager{margin-left:auto}
.foot select{height:30px;border:var(--border-w) solid var(--line-strong);border-radius:var(--r);background:var(--card);padding:0 6px}
.foot .btn{min-width:34px}

/* abas */
.tabs-w{border-bottom:var(--border-w) solid var(--line);margin:0 calc(-28px*var(--density))}
.tabs-w .tabs{border:0;padding:0 calc(22px*var(--density))}
.tab small{margin-left:6px;color:var(--muted);font-weight:500}

/* ficha */
.org-h{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.org-h .logo{flex:none;width:52px;height:52px;border-radius:var(--r-card);border:var(--border-w) solid var(--line-strong);background:var(--card);display:grid;place-items:center;font:600 18px var(--sans);letter-spacing:-.02em}
.org-h h1{margin:0;font:600 calc(26px*var(--text-scale))/1.15 var(--serif);letter-spacing:-.025em}
.org-h .sub{display:flex;gap:4px 14px;align-items:center;flex-wrap:wrap;color:var(--muted);margin-top:4px;font-size:calc(13px*var(--text-scale))}
.org-h .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.tk{padding:12px 14px;border:var(--border-w) dashed var(--line);border-radius:var(--r);color:var(--muted);display:flex;flex-direction:column;gap:2px;min-height:78px}
.tk b{color:var(--ink);font-weight:600;display:flex;align-items:center;gap:8px}
.tk small{font-size:calc(12px*var(--text-scale));line-height:1.3}
.tk--now{border:var(--border-w) solid var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card);color:var(--ink)}
.tk--next{border-style:solid;border-color:var(--line-strong);background:var(--card)}
.tk--off{opacity:.55}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px 24px;margin:0}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts dt{color:var(--muted);font-size:calc(12.5px*var(--text-scale))}
.facts dd{margin:0;font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.note{color:var(--muted);font-size:calc(13px*var(--text-scale));margin:0}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 16px 18px}
.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--line-strong)}
.tl li:last-child{padding-bottom:0}
.tl b{font-weight:600}
.tl small{display:block;color:var(--muted);font-size:calc(12.5px*var(--text-scale));margin-top:1px}
.tl .why{display:block;color:var(--ink);opacity:.85;margin-top:2px}
.rows{display:flex;flex-direction:column}
.rows>div{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:var(--border-w) solid var(--line)}
.rows>div:last-child{border-bottom:0}
.rows .grow{flex:1;min-width:0}
.rows small{display:block;color:var(--muted);font-size:calc(12.5px*var(--text-scale))}
.bar-st{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line);gap:2px}
.bar-st i{display:block;height:100%}
.legend{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:12px;font-size:calc(13px*var(--text-scale))}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.meter{height:8px;border-radius:999px;background:var(--line);overflow:hidden;min-width:90px}
.meter i{display:block;height:100%;background:var(--brand);border-radius:999px}

/* atencao */
.att{display:flex;flex-direction:column}
.att>div{display:grid;grid-template-columns:30px 1fr auto;gap:2px 12px;align-items:center;padding:11px 0;border-bottom:var(--border-w) solid var(--line)}
.att>div:last-child{border-bottom:0}
.att .m{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);grid-row:span 2}
.att .m svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.att [data-sev=atencao] .m{background:var(--wait-soft);color:var(--wait-ink)}
.att [data-sev=critico] .m{background:var(--alert-soft);color:var(--alert)}
.att b{font-weight:600}
.att small{color:var(--muted);font-size:calc(12.5px*var(--text-scale))}
.att .sev{font-size:calc(11px*var(--text-scale));font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-right:6px}
.att [data-sev=atencao] .sev{color:var(--wait-ink)}
.att [data-sev=critico] .sev{color:var(--alert)}
.att [data-sev=info] .sev{color:var(--brand)}
.att .btn{grid-row:span 2}

/* matriz de permissoes */
.mx th,.mx td{height:calc(40px*var(--density));padding:0 12px}
.mx td.c,.mx th.c{text-align:center}
.mx code{font:500 calc(12.5px*var(--text-scale)) ui-monospace,Menlo,monospace}
.mx tbody tr.g td{background:color-mix(in srgb,var(--bg) 50%,var(--card));font-weight:600;color:var(--muted);font-size:calc(12.5px*var(--text-scale))}
.dot-y{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.dot-n{color:var(--faint)}

/* configuracao */
.cf{display:flex;flex-direction:column}
.cf-r{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px;align-items:center;padding:14px 0;border-bottom:var(--border-w) solid var(--line)}
.cf-r:last-child{border-bottom:0}
.cf-r label,.cf-r .lb{font-weight:500}
.cf-r small{display:block;color:var(--muted);font-size:calc(12.5px*var(--text-scale));font-weight:400}
.cf-r .field{width:100%}
.cf-r.ch{background:var(--hl);margin:0 -18px;padding-left:18px;padding-right:18px}
.savebar{position:sticky;bottom:0;z-index:var(--z-sticky);display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border:var(--border-w) solid var(--line-strong);border-radius:var(--r-card);box-shadow:0 8px 24px rgb(15 23 42/.14)}
.savebar span{flex:1}
.savebar .btn{flex:none}

/* dialogos */
dialog{padding:0;color:var(--ink);max-height:92vh}
dialog::backdrop{background:var(--scrim)}
.dlg{width:min(480px,calc(100vw - 24px));border:var(--border-w) solid var(--line-strong);border-radius:var(--radius-card);background:var(--card);box-shadow:0 14px 40px rgb(15 23 42/.22);padding:0;overflow:hidden}
.dlg--wide{width:min(720px,calc(100vw - 24px))}
.dlg__f{display:flex;flex-direction:column;max-height:92vh}
.dlg__h{padding:20px 22px 6px}
.dlg__h h2{margin:0 0 6px;font:600 calc(19px*var(--text-scale))/1.25 var(--serif);letter-spacing:-.015em}
.dlg__h p{margin:0;color:var(--muted)}
.dlg__b{padding:12px 22px 6px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.dlg .dialog__actions{padding:12px 22px 20px;margin:0}
.dlg__err{padding:0 22px 4px;margin:0}
.dlg .field{width:100%}
.fg{display:flex;flex-direction:column}
.fg--2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts{display:flex;flex-direction:column;gap:2px}
.opts .radio,.opts .check{align-items:flex-start;padding:4px 0}
.opts .radio input,.opts .check input{margin-top:2px}
.opts small{display:block;color:var(--muted);font-size:calc(12.5px*var(--text-scale))}
.hint{color:var(--muted);font-size:calc(12.5px*var(--text-scale));margin:6px 0 0}
.box{border:var(--border-w) solid var(--line);border-radius:var(--r);padding:10px 14px;background:var(--bg)}
.box ul{margin:6px 0 0;padding-left:18px}
.box li{margin:2px 0}
.sc-list{max-height:200px;overflow:auto;border:var(--border-w) solid var(--line);border-radius:var(--r);padding:4px 12px}
.menu{position:absolute;z-index:var(--z-menu);left:0;right:0;top:calc(100% + 6px);background:var(--card);border:var(--border-w) solid var(--line-strong);border-radius:var(--r);padding:4px;box-shadow:0 8px 24px rgb(15 23 42/.12)}
.menu.fixed{position:fixed;left:auto;right:auto;min-width:230px}
.menu button,.menu a{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--radius-sm);text-decoration:none;color:var(--ink)}
.menu button:hover,.menu a:hover,.menu button:focus-visible{background:var(--hover)}
.menu small{color:var(--muted);font-size:calc(12px*var(--text-scale))}
.menu hr{border:0;border-top:var(--border-w) solid var(--line);margin:4px 0}
.menu .mh{padding:6px 10px 2px;font-size:calc(12px*var(--text-scale));color:var(--muted);font-weight:500}
.menu button[aria-current=true]{background:var(--brand-soft)}

/* toasts */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:var(--z-toast);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100vw - 24px))}
.toast{pointer-events:auto;padding:12px 16px;box-shadow:0 8px 24px rgb(15 23 42/.2);animation:up .25s var(--ease);font-size:calc(14px*var(--text-scale))}
.toast small{display:block;opacity:.75;font-size:calc(12.5px*var(--text-scale))}

/* impersonacao */
.impbar{flex:none;display:flex;align-items:center;gap:14px;padding:9px 20px;background:var(--alert);color:var(--brand-ink);font-weight:500;z-index:var(--z-imp);flex-wrap:wrap}
.impbar b{font-weight:700}
.impbar .sp{flex:1}
.impbar .btn{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--brand-ink) 70%,transparent);min-height:30px}
.impbar .btn:hover{background:color-mix(in srgb,var(--brand-ink) 18%,transparent)}
.impbar .t{font-variant-numeric:tabular-nums;font-weight:700}
.imp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.ok-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ok-l li{display:flex;gap:10px;align-items:flex-start}
.ok-l svg{width:16px;height:16px;flex:none;margin-top:3px;stroke:var(--open);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* login */
.login{height:100vh;display:grid;place-items:center;padding:24px;overflow:auto}
.login__c{width:min(420px,100%);display:flex;flex-direction:column;gap:18px}
.login__logo{display:flex;align-items:center;gap:12px}
.login__logo .mark{width:40px;height:40px;border-radius:var(--radius-sm);background:var(--ink);color:var(--bg);display:grid;place-items:center}
.login__logo .mark svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.login__logo h1{margin:0;font:600 22px/1.1 var(--serif);letter-spacing:-.02em}
.login__logo span{color:var(--muted);font-size:13px}
.login__f{padding:22px;display:flex;flex-direction:column;gap:14px}
.login .field{width:100%}
.demo{border:var(--border-w) dashed var(--line-strong);border-radius:var(--r-card);padding:14px 16px}
.demo p{margin:0 0 8px;font-size:calc(12.5px*var(--text-scale));color:var(--muted)}
.demo .chips{gap:6px}

function audit(tipo, x, org, why) {
  const prev = S.audit[0], a = meAdmin() || {n: 'Sistema', ip: ''};
  const e = {id: ++S.seq, t: now(), by: a.n, tipo, x, org: org ? org.nome : '', orgId: org ? org.id : '', why: why || '', ip: a.ip || '203.0.113.24'};
  e.h = h53((prev ? prev.h : 'genesis') + e.id + e.t + e.by + e.tipo + e.x + e.org + e.why);
  S.audit.unshift(e);
  return e;
}
function verifyChain() {
  const L = [...S.audit].reverse(); let prev = 'genesis';
  for (let i = 0; i < L.length; i++) {
    const e = L[i];
    if (h53(prev + e.id + e.t + e.by + e.tipo + e.x + e.org + e.why) !== e.h) return {ok: false, at: e, n: L.length};
    prev = e.h;
  }
  return {ok: true, n: L.length};
}

function stInfo(o) {
  const s = o.sub;
  if (o.estado === 'em_teste') { const n = Math.ceil((s.trialEnd - now()) / D); return {t: n < 0 ? `teste venceu há ${-n} d` : n === 0 ? 'teste acaba hoje' : `teste acaba em ${n} d`, tone: n <= 3 ? 'wait' : ''}; }
  if (o.estado === 'ativa') {
    if (s.cancelaEm) return {t: `cancela em ${fmtDM(s.cancelaEm)}`, tone: 'wait'};
    if (s.excecaoAte && s.excecaoAte > now()) return {t: `exceção até ${fmtDM(s.excecaoAte)}`, tone: 'wait'};
    if (s.venc < now()) { const a = Math.floor((now() - s.venc) / D); return {t: `venceu há ${a} d · tolerância ${s.tol} d`, tone: 'wait', late: true}; }
    return {t: `próxima cobrança em ${Math.ceil((s.venc - now()) / D)} d`, tone: ''};
  }
  if (o.estado === 'suspensa') return {t: s.susMode === 'total' ? 'bloqueio total do acesso' : 'só leitura e exportação', tone: 'wait'};
  if (o.estado === 'bloqueada') return {t: 'só o super admin libera', tone: 'alert'};
  return {t: `desde ${fmtD(s.encerradaEm)}`, tone: ''};
}

function modal(o) {

  document.body.appendChild(d);
  d.addEventListener('close', () => d.remove());
  $('[data-close]', d).onclick = () => d.close();
  $('form', d).addEventListener('submit', e => {
    e.preventDefault();
    const r = o.onOk && o.onOk(new FormData(e.target), d);
    if (r) { const er = $('.dlg__err', d); er.textContent = r; er.hidden = false; return; }

}

function pager(total, R, o = {}) {
  const pk = o.pk || 'page', sk = o.sk || 'size', sizes = o.sizes || [10, 25, 50];
  const size = Math.min(100, +R[sk] || o.def || sizes[0]);
  const pages = Math.max(1, Math.ceil(total / size)); const page = Math.min(pages, Math.max(1, +R[pk] || 1));
  const a = total ? (page - 1) * size + 1 : 0, b = Math.min(total, page * size);
  const nums = []; for (let i = 1; i <= pages; i++) if (i === 1 || i === pages || Math.abs(i - page) <= 1) nums.push(i); else if (nums[nums.length - 1] !== '…') nums.push('…');
  return {page, size, from: (page - 1) * size, html: `<div class="foot"><span>Mostrando ${a} a ${b} de ${total}</span><label>Por página <select data-ch="size" data-sk="${sk}" data-pk="${pk}" aria-label="Por página">${sizes.map(s => `<option ${s === size ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
    <div class="pager" role="navigation" aria-label="Paginação"><button class="btn btn--sm" data-act="pg" data-pk="${pk}" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''}>Anterior</button>${nums.map(n => n === '…' ? '<span class="muted">…</span>' : `<button class="btn btn--sm" data-act="pg" data-pk="${pk}" data-p="${n}" ${n === page ? 'aria-current="page"' : ''}>${n}</button>`).join('')}<button class="btn btn--sm" data-act="pg" data-pk="${pk}" data-p="${page + 1}" ${page >= pages ? 'disabled' : ''}>Próxima</button></div></div>`};
}
const head = (h, sub, actions) => `<div class="head"><div><h1>${h}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`;
const stat = (l, v, n, al) => `<div class="card stat"><div class="l">${l}</div><div class="v num">${v}</div><div class="n ${al ? 'al' : ''}">${n || '&nbsp;'}</div></div>`;

function bars(data) {
  const W = 560, Hh = 170, pl = 34, pb = 22, max = Math.max(...data) * 1.1, bw = (W - pl) / data.length;
  const lab = i => { const d = new Date(now() - (data.length - 1 - i) * D); return fmtDM(d); };
  const grid = [0, .5, 1].map(f => { const y = Hh - pb - (Hh - pb - 8) * f; return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pl - 6}" y="${y + 4}" text-anchor="end" fill="var(--muted)" font-size="11">${nf(Math.round(max * f / 10) * 10)}</text>`; }).join('');
  const rects = data.map((v, i) => { const h = (Hh - pb - 8) * v / max, x = pl + i * bw + 4; return `<rect x="${x}" y="${Hh - pb - h}" width="${bw - 8}" height="${h}" rx="3" fill="${i === data.length - 1 ? 'var(--brand)' : 'color-mix(in srgb,var(--brand) 55%,var(--card))'}"><title>${lab(i)}: ${nf(v)} comandas</title></rect>${i % 2 === 1 || i === data.length - 1 ? `<text x="${x + (bw - 8) / 2}" y="${Hh - 6}" text-anchor="middle" fill="var(--muted)" font-size="11">${lab(i)}</text>` : ''}`; }).join('');
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Comandas por dia nos últimos 14 dias, hoje ${nf(data[data.length - 1])}" style="width:100%;height:auto;display:block">${grid}${rects}</svg>`;
}

const ACTS = [
  {id: 'prorrogar', t: 'Prorrogar teste', perm: 'assinatura:prorrogar_teste', from: ['em_teste'],
    form: o => ({title: 'Prorrogar o teste', lead: `Hoje o teste acaba em ${fmtD(o.sub.trialEnd)}.`, body: inp('dias', 'Prorrogar por quantos dias?', {type: 'number', value: 7, min: 1, msg: limMsg('assinatura:prorrogar_teste', 'dias por prorrogação')}) + why()}),
    run: (o, fd) => { const n = +fd.get('dias'); if (!(n >= 1) || n !== Math.floor(n)) return 'Informe um número inteiro de dias.'; if (n > lim('assinatura:prorrogar_teste')) return `Acima do seu limite de ${lim('assinatura:prorrogar_teste')} dias. Peça a um perfil com limite maior.`; const w = checkWhy(fd); if (w) return w; o.sub.trialEnd += n * D; commit(o, `Prorrogou o teste em ${n} dias (até ${fmtD(o.sub.trialEnd)})`, fd.get('why')); }},
  {id: 'converter', t: 'Converter em ativa', perm: 'assinatura:converter', from: ['em_teste'], primary: true,
    form: o => ({title: 'Converter em assinatura ativa', lead: 'O cliente passa a ser cobrado. A primeira cobrança vence em 30 dias.', body: sel('plano', 'Plano', S.plans.map(p => [p.id, `${p.n} · ${brl(p.preco)}/mês`]), o.plano) + why()}),
    run: (o, fd) => { const w = checkWhy(fd); if (w) return w; o.plano = fd.get('plano'); setState(o, 'ativa'); o.sub.venc = now() + 30 * D; o.sub.tol = S.cfg.tolerancia; o.sub.desde = now(); commit(o, `Converteu o teste em ativa (plano ${PLAN(o.plano).n})`, fd.get('why')); }},
  {id: 'pagamento', t: 'Registrar pagamento', perm: 'assinatura:registrar_pagamento', from: ['ativa', 'suspensa'], primary: o => o.estado === 'ativa' && stInfo(o).late,
    form: o => ({title: 'Registrar pagamento', lead: 'Soma 30 dias ao vencimento.', body: `<div class="fg--2 fg">${inp('valor', 'Valor (R$)', {type: 'number', value: monthly(o), min: 0})}${sel('forma', 'Forma', [['Boleto', 'Boleto'], ['Pix', 'Pix'], ['Cartão', 'Cartão'], ['Transferência', 'Transferência']], 'Boleto')}</div>` + (o.estado === 'suspensa' ? `<label class="check"><input type="checkbox" name="reativar" checked><span>Reativar a assinatura agora</span></label>` : '') + why('Observação')}),
    run: (o, fd) => { const v = +fd.get('valor'); if (!(v > 0)) return 'Informe o valor pago.'; const w = checkWhy(fd); if (w) return w; o.sub.venc = Math.max(o.sub.venc || 0, now()) + 30 * D; let x = `Registrou pagamento de ${brl2(v)} (${fd.get('forma')})`; if (o.estado === 'suspensa' && fd.get('reativar')) { setState(o, 'ativa'); x += ' e reativou'; } commit(o, x, fd.get('why')); }},
  {id: 'cortesia', t: 'Conceder cortesia', perm: 'assinatura:conceder_cortesia', from: ['ativa'],
    form: o => ({title: 'Conceder período gratuito', lead: 'Empurra o próximo vencimento sem cobrar.', body: inp('dias', 'Quantos dias?', {type: 'number', value: 15, min: 1, msg: limMsg('assinatura:conceder_cortesia', 'dias')}) + why()}),
    run: (o, fd) => { const n = +fd.get('dias'); if (!(n >= 1)) return 'Informe os dias.'; if (n > lim('assinatura:conceder_cortesia')) return `Acima do seu limite de ${lim('assinatura:conceder_cortesia')} dias.`; const w = checkWhy(fd); if (w) return w; o.sub.venc += n * D; commit(o, `Concedeu cortesia de ${n} dias (vencimento em ${fmtD(o.sub.venc)})`, fd.get('why')); }},
  {id: 'excecao', t: 'Exceção manual', perm: 'assinatura:excecao_manual', from: ['ativa', 'suspensa'],
    form: o => ({title: 'Manter liberado apesar do vencimento', lead: 'A organização não será suspensa até a data escolhida.', body: inp('dias', 'Por quantos dias?', {type: 'number', value: 7, min: 1, msg: limMsg('assinatura:excecao_manual', 'dias')}) + why()}),
    run: (o, fd) => { const n = +fd.get('dias'); if (!(n >= 1)) return 'Informe os dias.'; if (n > lim('assinatura:excecao_manual')) return `Acima do seu limite de ${lim('assinatura:excecao_manual')} dias.`; const w = checkWhy(fd); if (w) return w; o.sub.excecaoAte = now() + n * D; commit(o, `Abriu exceção manual até ${fmtD(o.sub.excecaoAte)}`, fd.get('why')); }},
  {id: 'agendar', t: 'Agendar mudança', perm: 'assinatura:agendar_mudanca', from: ['em_teste', 'ativa', 'suspensa'], when: o => !o.sub.agenda,
    form: o => ({title: 'Agendar mudança de estado', lead: 'Só mudanças válidas aparecem. O dono é avisado agora e de novo no dia.', body: `<div class="fg--2 fg">${sel('para', 'Mudar para', TRANS[o.estado].filter(e => e !== 'encerrada' || true).map(e => [e, ST[e][0]]), TRANS[o.estado][0])}${inp('data', 'Em', {type: 'date', value: dateIn(7), min: dateIn(1)})}</div>` + why()}),
    run: (o, fd) => { if (!fd.get('data') || fd.get('data') < dateIn(1)) return 'Escolha uma data futura.'; const w = checkWhy(fd); if (w) return w; const to = fd.get('para'); if (!TRANS[o.estado].includes(to)) return 'Transição inválida.'; const when = new Date(fd.get('data') + 'T08:00:00').getTime(); o.sub.agenda = {when, to, why: fd.get('why'), by: meName()}; commit(o, `Agendou ${ST[to][0].toLowerCase()} para ${fmtD(when)}`, fd.get('why')); }},
  {id: 'desagendar', t: 'Cancelar agendamento', perm: 'assinatura:agendar_mudanca', from: ['em_teste', 'ativa', 'suspensa'], when: o => !!o.sub.agenda,
    form: o => ({title: 'Cancelar a mudança agendada', lead: `Hoje: ${ST[o.sub.agenda.to][0].toLowerCase()} em ${fmtD(o.sub.agenda.when)}.`, body: why()}),
    run: (o, fd) => { const w = checkWhy(fd); if (w) return w; o.sub.agenda = null; commit(o, 'Cancelou a mudança agendada', fd.get('why')); }},
  {id: 'suspender', t: 'Suspender', perm: 'assinatura:suspender', from: ['em_teste', 'ativa'],
    form: o => ({title: 'Suspender a assinatura', lead: 'Pausa reversível. Escolha o que a organização consegue fazer.', body: radios('modo', [['leitura', 'Só leitura e exportação', 'Consulta e baixa os próprios dados, sem lançar nada.'], ['total', 'Bloqueio total', 'Ninguém entra; vê só a tela informativa com o motivo.']], 'leitura') + why()}),
    run: (o, fd) => { const w = checkWhy(fd); if (w) return w; setState(o, 'suspensa'); o.sub.susMode = fd.get('modo'); o.sub.agenda = null; commit(o, `Suspendeu (${o.sub.susMode === 'total' ? 'bloqueio total' : 'somente leitura e exportação'})`, fd.get('why')); }},
  {id: 'bloquear', t: 'Bloquear', perm: 'assinatura:bloquear', from: ['ativa', 'suspensa'], danger: true,
    form: o => ({title: 'Bloquear por segurança', lead: 'Nenhum acesso, nem do dono. Depois só o super admin libera. Use para abuso, fraude ou questão legal.', body: why('Motivo do bloqueio')}),
    run: (o, fd) => { const w = checkWhy(fd); if (w) return w; setState(o, 'bloqueada'); o.sub.agenda = null; commit(o, 'Bloqueou', fd.get('why')); }},
  {id: 'reativar', t: 'Reativar', perm: 'assinatura:reativar', from: ['suspensa', 'bloqueada'], when: o => o.estado !== 'bloqueada' || ME === 'S', primary: o => o.estado === 'suspensa',
    form: o => ({title: o.estado === 'bloqueada' ? 'Liberar o bloqueio' : 'Reativar a assinatura', lead: o.estado === 'bloqueada' ? 'Só o super admin libera. Escolha como a organização volta.' : 'O acesso volta por completo.', body: (o.estado === 'bloqueada' ? radios('dest', [['ativa', 'Voltar a Ativa'], ['suspensa', 'Voltar a Suspensa', 'Mantém só leitura até regularizar.']], 'ativa') : '') + why()}),
    run: (o, fd) => { const w = checkWhy(fd); if (w) return w; const was = o.estado, to = was === 'bloqueada' ? fd.get('dest') : 'ativa'; setState(o, to); if (to === 'suspensa') o.sub.susMode = 'leitura'; commit(o, was === 'bloqueada' ? `Liberou o bloqueio (voltou a ${ST[to][0]})` : 'Reativou', fd.get('why')); }},
  {id: 'cancelar', t: 'Cancelar assinatura', perm: 'assinatura:cancelar', from: ['ativa'], when: o => !o.sub.cancelaEm, danger: true,
    form: o => ({title: 'Cancelar a assinatura', lead: `Não encerra agora: o acesso segue até o fim do período pago (${fmtD(o.sub.venc)}).`, body: why()}),
    run: (o, fd) => { const w = checkWhy(fd); if (w) return w; o.sub.cancelaEm = o.sub.venc; commit(o, `Agendou o encerramento para ${fmtD(o.sub.venc)} (cancelamento)`, fd.get('why')); }},
  {id: 'desfazer', t: 'Desfazer cancelamento', perm: 'assinatura:cancelar', from: ['ativa'], when: o => !!o.sub.cancelaEm,
    form: o => ({title: 'Desfazer o cancelamento', lead: 'A assinatura continua normalmente.', body: why()}),
    run: (o, fd) => { const w = checkWhy(fd); if (w) return w; o.sub.cancelaEm = null; commit(o, 'Desfez o cancelamento', fd.get('why')); }},
  {id: 'encerrar', t: 'Encerrar agora', perm: 'assinatura:cancelar', from: ['em_teste', 'suspensa', 'bloqueada', 'ativa'], danger: true, when: o => o.estado !== 'ativa' || !!o.sub.cancelaEm,
    form: o => ({title: 'Encerrar a assinatura agora', lead: `Fim de vida: não volta. Os dados ficam retidos por ${S.cfg.retencao} meses (exemplo) e o dono só lê e exporta por ${S.cfg.janelaLeitura} dias.`, body: inp('conf', `Digite o nome da organização para confirmar`, {ph: o.nome}) + why()}),
    run: (o, fd) => { if (strip(fd.get('conf')).trim() !== strip(o.nome)) return 'O nome digitado não confere.'; const w = checkWhy(fd); if (w) return w; setState(o, 'encerrada'); commit(o, 'Encerrou a assinatura', fd.get('why')); }}
];
const actsFor = o => ACTS.filter(a => a.from.includes(o.estado) && can(a.perm) && (!a.when || a.when(o)));

function orgAssin(o) {
  const s = o.sub, cur = o.estado, next = TRANS[cur], acts = actsFor(o);
  const i = stInfo(o);
  const banners = [];
  if (s.agenda) banners.push(`<div class="banner banner--warning">${ico('clock', 'i')}<span class="l"><b>Agendado:</b> ${ST[s.agenda.to][0].toLowerCase()} em ${fmtD(s.agenda.when)}<small>${esc(s.agenda.why)} · por ${esc(s.agenda.by)}</small></span></div>`);
  if (s.cancelaEm) banners.push(`<div class="banner banner--warning">${ico('clock', 'i')}<span class="l"><b>Cancelamento pedido:</b> encerra em ${fmtD(s.cancelaEm)}, ao fim do período pago.</span></div>`);
  if (s.excecaoAte && s.excecaoAte > now()) banners.push(`<div class="banner banner--info">${ico('info', 'i')}<span class="l"><b>Exceção manual:</b> liberada até ${fmtD(s.excecaoAte)} apesar do vencimento.</span></div>`);
  const facts = [['Plano', `${PLAN(o.plano).n} · ${brl(monthly(o))}/mês`]];
  if (cur === 'em_teste') facts.push(['Teste termina em', `${fmtD(s.trialEnd)} <span class="muted">(${i.t.replace('teste ', '')})</span>`], ['Ao fim do teste', S.cfg.fimTeste === 'suspensa' ? 'Vira Suspensa (padrão da plataforma)' : 'Vira Ativa com tolerância']);
  if (cur === 'ativa') facts.push(['Próximo vencimento', `${fmtD(s.venc)}`], ['Tolerância de atraso', `${s.tol} dias`], ['Cliente ativo desde', fmtD(s.desde)]);
  if (cur === 'suspensa') facts.push(['Acesso', s.susMode === 'total' ? 'Bloqueio total' : 'Só leitura e exportação'], ['Último vencimento', s.venc ? fmtD(s.venc) : '—']);
  if (cur === 'bloqueada') facts.push(['Acesso', 'Nenhum, nem do dono'], ['Quem libera', 'Só o super admin']);
  if (cur === 'encerrada') facts.push(['Encerrada em', fmtD(s.encerradaEm)], ['Janela de leitura', `${S.cfg.janelaLeitura} dias, depois nenhum acesso`], ['Retenção dos dados', `${S.cfg.retencao} meses`]);
  return banners.join('') + `<section class="card pad"><div class="sec-h"><h2 class="sec">Ciclo da assinatura</h2><span class="sub">O estado é decidido no servidor em toda requisição</span></div>
  <div class="track">${Object.keys(ST).map(k => `<div class="tk ${k === cur ? 'tk--now' : next.includes(k) ? 'tk--next' : 'tk--off'}"${k === cur ? ' aria-current="true"' : ''}><b>${stBadge(k)}${k === cur ? '<span class="tag">agora</span>' : ''}</b><small>${ST[k][2]}</small></div>`).join('')}</div>
  <p class="note" style="margin-top:10px">Contorno cheio = estados para onde esta organização pode ir. Transição inválida é recusada.</p></section>
  <section class="card pad"><div class="sec-h"><h2 class="sec">Situação atual</h2></div><dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl></section>
  <section class="card pad"><div class="sec-h"><h2 class="sec">Ações</h2><span class="sub">Toda ação pede motivo, avisa o dono e entra na auditoria</span></div>
  ${acts.length ? `<div class="acts">${acts.map(a => `<button class="btn ${(typeof a.primary === 'function' ? a.primary(o) : a.primary) ? 'btn--primary' : a.danger ? 'btn--danger' : ''}" data-act="sub" data-a="${a.id}" data-id="${o.id}">${a.t}</button>`).join('')}</div>` : `<p class="note">${cur === 'encerrada' ? 'Assinatura encerrada: estado final, sem ações.' : cur === 'bloqueada' && ME !== 'S' && can('assinatura:reativar') ? 'Só o super admin libera um bloqueio.' : 'Seu perfil não tem ações de assinatura para este estado.'}</p>`}
  ${cur === 'bloqueada' && ME !== 'S' && acts.length ? '<p class="note" style="margin-top:8px">Só o super admin libera um bloqueio.</p>' : ''}</section>
  <section class="card pad"><div class="sec-h"><h2 class="sec">Últimos registros</h2><a class="btn btn--sm" href="${href({screen: 'org', id: o.id, tab: 'hist'})}">Ver tudo</a></div>${tl(o.hist.slice(0, 3))}</section>`;
}
const tl = L => L.length ? `<ul class="tl">${L.map(h => `<li><b>${esc(h.x)}</b><small>${esc(h.by)} · ${fmtDT(h.t)}</small>${h.why ? `<span class="why">Motivo: ${esc(h.why)}</span>` : ''}</li>`).join('')}</ul>` : '<p class="note">Sem registros.</p>';
const orgHist = o => `<section class="card pad"><div class="sec-h"><h2 class="sec">Histórico da organização</h2><span class="sub">Cada linha tem autor, horário e motivo</span>${can('auditoria_plataforma:ver') ? `<a class="btn btn--sm" href="${href({screen: 'auditoria', q: o.nome})}">Abrir na auditoria</a>` : ''}</div>${tl(o.hist)}</section>`;

function orgUnid(o) {
  const L = unitsLimit(o), n = unitsOn(o), fonte = o.limUn != null ? 'limite próprio' : `limite do plano ${PLAN(o.plano).n}`;
  return `<section class="card pad"><div class="sec-h"><h2 class="sec">Unidades</h2><span class="sub">${n} de ${L} (${fonte})</span>
    <span style="margin-left:auto;display:flex;gap:8px">${can('unidade_organizacao:definir_limite') ? `<button class="btn btn--sm" data-act="unit-limit" data-id="${o.id}">Alterar limite</button>` : ''}${can('unidade_organizacao:criar') && o.estado !== 'encerrada' ? `<button class="btn btn--sm btn--primary" data-act="unit-new" data-id="${o.id}" ${n >= L ? 'disabled title="Limite atingido: aumente o limite primeiro"' : ''}>${ico('plus')} Criar unidade</button>` : ''}</span></div>
    <div class="meter" style="margin-bottom:8px" role="img" aria-label="${n} de ${L} unidades"><i style="width:${Math.min(100, n / L * 100)}%"></i></div>
    <div class="rows">${o.units.map(u => `<div><span class="grow"><b>${esc(u.n)}</b><small>${esc(u.end)}</small></span><span class="badge ${u.on ? 'badge--open' : 'badge--closed'}"><i></i>${u.on ? 'Ativa' : 'Desativada'}</span></div>`).join('')}</div>
    <p class="note" style="margin-top:12px">A plataforma define quantas unidades a organização pode ter e pode criar a primeira em nome dela; o dono cria as demais até o limite (F12.17).</p></section>`;
}
function orgUsu(o) {
  return `<section class="card"><div class="pad" style="padding-bottom:0"><div class="sec-h"><h2 class="sec">Usuários</h2><span class="sub">mostrando ${o.users.length} de ${o.usersN} · limite do plano ${usersLimit(o)}</span></div></div>
  <div class="tw"><table><thead><tr><th>Pessoa</th><th>Perfil</th><th>Conta</th><th>Último acesso</th><th>Situação</th><th></th></tr></thead><tbody>${o.users.map(u => `<tr><td><span class="who"><span class="avatar">${esc(inits(u.n))}</span>${esc(u.n)}</span></td><td>${esc(u.p)}</td><td><span class="tag">${u.c === 'email' ? 'Com e-mail' : 'Operacional'}</span></td><td class="muted">${rel(u.ult)}</td><td><span class="badge ${u.on ? 'badge--open' : 'badge--closed'}"><i></i>${u.on ? 'Ativo' : 'Desativado'}</span></td><td class="r">${can('usuario_organizacao:gerenciar') && u.on && o.estado !== 'encerrada' ? `<button class="btn btn--sm" data-act="user-reset" data-id="${o.id}" data-u="${u.id}">Redefinir acesso</button>` : ''}</td></tr>`).join('')}</tbody></table></div></section>
  <p class="note">A plataforma redefine o acesso e consulta; segredos (senhas, PIN, chaves) nunca aparecem aqui, nem para o super admin.</p>`;
}
const flagEff = (o, f) => o.flags[f.id] === 'on' ? [1, 'Exceção: ligada'] : o.flags[f.id] === 'off' ? [0, 'Exceção: desligada'] : [f.pl[S.plans.findIndex(p => p.id === o.plano)] ? 1 : 0, 'Pelo plano'];
function orgFunc(o) {
  return `<section class="card"><div class="pad" style="padding-bottom:0"><div class="sec-h"><h2 class="sec">Funcionalidades</h2><span class="sub">O plano liga o padrão; a exceção vale só para esta organização</span></div></div><div class="tw"><table><thead><tr><th>Funcionalidade</th><th>Pelo plano ${PLAN(o.plano).n}</th><th>Nesta organização</th><th>Resultado</th></tr></thead><tbody>${S.flags.map(f => {
    const pi = S.plans.findIndex(p => p.id === o.plano), [eff, src] = flagEff(o, f), ov = o.flags[f.id] || '';
    return `<tr><td><span class="two"><b>${esc(f.n)}</b><small>${esc(f.d)}</small></span></td><td>${f.pl[pi] ? 'Ligada' : 'Desligada'} ${f.tipo === 'Beta' ? '<span class="tag tag--brand">Beta</span>' : ''}</td><td>${can('feature_flag:gerenciar') ? `<select class="field" style="height:32px;width:170px" data-ch="orgflag" data-id="${o.id}" data-f="${f.id}" aria-label="${esc(f.n)}"><option value="" ${!ov ? 'selected' : ''}>Seguir o plano</option><option value="on" ${ov === 'on' ? 'selected' : ''}>Ligar (exceção)</option><option value="off" ${ov === 'off' ? 'selected' : ''}>Desligar (exceção)</option></select>` : src}</td><td><span class="badge ${eff ? 'badge--open' : 'badge--closed'}"><i></i>${eff ? 'Ligada' : 'Desligada'}</span></td></tr>`;
  }).join('')}</tbody></table></div></section>`;
}

/* ===== COBRANCA ===== */
function cobrancaHtml(R) {
  const ativas = S.orgs.filter(o => o.estado === 'ativa'), late = S.orgs.filter(o => stInfo(o).late);
  const prox = ativas.filter(o => !stInfo(o).late && o.sub.venc - now() < 15 * D).sort((a, b) => a.sub.venc - b.sub.venc);
  const mrr = ativas.reduce((s, o) => s + monthly(o), 0), rec = prox.reduce((s, o) => s + monthly(o), 0), lv = late.reduce((s, o) => s + monthly(o), 0);
  const susp = S.orgs.filter(o => o.estado === 'suspensa');
  const tb = (L, late_) => `<div class="tw"><table><thead><tr><th>Organização</th><th>Plano</th><th class="r">Valor</th><th>Vencimento</th><th>${late_ ? 'Tolerância' : 'Faltam'}</th><th></th></tr></thead><tbody>${L.map(o => { const dd = Math.floor((now() - o.sub.venc) / D); return `<tr class="go" data-href="${href({screen: 'org', id: o.id, tab: 'assin'})}"><td><span class="two"><a href="${href({screen: 'org', id: o.id, tab: 'assin'})}">${esc(o.nome)}</a><small>${o.sub.agenda ? 'Suspensão agendada para ' + fmtDM(o.sub.agenda.when) : esc(o.dono.email)}</small></span></td><td>${PLAN(o.plano).n}</td><td class="r num">${brl2(monthly(o))}</td><td>${fmtD(o.sub.venc)}</td><td>${late_ ? `<span class="tag tag--wait">venceu há ${dd} d · restam ${Math.max(0, o.sub.tol - dd)} d</span>` : `${Math.ceil((o.sub.venc - now()) / D)} d`}</td><td class="r">${can('assinatura:registrar_pagamento') ? `<button class="btn btn--sm ${late_ ? 'btn--primary' : ''}" data-act="sub" data-a="pagamento" data-id="${o.id}">Registrar pagamento</button>` : ''}</td></tr>`; }).join('') || `<tr><td colspan="6" class="wrap" style="height:auto;padding:28px;text-align:center" class="muted">Nada aqui.</td></tr>`}</tbody></table></div>`;
  return head('Cobrança', 'Receita recorrente, atrasos e vencimentos. Valores de exemplo.') + `<div class="sum">${stat('Receita mensal (MRR)', brl(mrr), `${ativas.length} assinaturas ativas`)}${stat('A receber em 15 dias', brl(rec), `${prox.length} ${plural(prox.length, 'vencimento', 'vencimentos')}`)}${stat('Em atraso', brl(lv), `${late.length} ${plural(late.length, 'organização', 'organizações')} na tolerância`, late.length)}${stat('Suspensas', susp.length, `${brl(susp.reduce((s, o) => s + monthly(o), 0))}/mês parado`)}</div>
  <section class="card"><div class="pad" style="padding-bottom:0"><div class="sec-h"><h2 class="sec">Em atraso</h2><span class="sub">Passando da tolerância a assinatura vira Suspensa sozinha</span></div></div>${tb(late, true)}</section>
  <section class="card"><div class="pad" style="padding-bottom:0"><div class="sec-h"><h2 class="sec">Próximos vencimentos</h2><span class="sub">15 dias</span></div></div>${tb(prox, false)}</section>`;
}

/* ===== PLANOS ===== */
function planosHtml() {
  const edit = can('plano:gerenciar');
