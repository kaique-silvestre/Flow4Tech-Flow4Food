        const n = fd.get('n').trim(), em = fd.get('email').trim(), esc_ = fd.get('esc'), orgs = fd.getAll('orgs');
        if (n.length < 2) return 'Informe o nome.'; if (!/^\S+@\S+\.\S+$/.test(em)) return 'Informe um e-mail válido.'; if (S.admins.some(a => a.email === em)) return 'Já existe administrador com este e-mail.'; if (esc_ === 'sel' && !orgs.length) return 'Escolha pelo menos uma organização.'; if (!(fd.get('senha') || '').length) return 'Confirme a sua senha.'; const w = checkWhy(fd); if (w) return w;
        const p = fd.get('p'), a = {id: 'a' + (S.admins.length + 1) + Math.floor(Math.random() * 90), n, email: em, p, on: true, pend: true, ult: null, ip: '', escopo: esc_ === 'all' ? 'all' : orgs, pol: p === 'U' ? {modo: 'leitura', max: 30, motivo: true, orgs: esc_ === 'all' ? 'all' : orgs} : null};
        S.admins.push(a); audit('admin', `Criou o administrador ${n} (${PROFILES[p][0]})`, null, fd.get('why')); save(); render(); toast('Administrador criado', `Convite enviado a ${em}.`);
      }});
  },
  'adm-open'(el) {
    const a = ADM(el.dataset.id), self = a.p === ME, locked = !!a.prot, pol = a.pol, canPol = can('suporte:impersonar_politica_configurar') && a.p === 'U';
    const escAll = a.escopo === 'all', polAll = !pol || pol.orgs === 'all';
    modal({title: esc(a.n), lead: `${esc(a.email)} · ${a.ult ? 'último login ' + rel(a.ult) + ' de ' + esc(a.ip) : 'convite pendente'}`, wide: true,
      body: (locked ? `<div class="banner banner--info">${ico('lock', 'i')}<span class="l"><b>Conta protegida.</b> Não pode ser removida nem rebaixada por outros; recuperação só por procedimento controlado.</span></div>` : '') +
      sel('p', 'Perfil', Object.entries(PROFILES).map(([k, v]) => [k, v[0], k === 'S' && a.p !== 'S']), a.p, locked ? 'Perfil travado.' : '').replace('<select', locked ? '<select disabled' : '<select') +
      fld('Onde pode atuar', radios('esc', [['all', 'Todas as organizações', '', locked], ['sel', 'Só as escolhidas', '', locked]], escAll ? 'all' : 'sel') + orgChecks('orgs', escAll ? [] : a.escopo)) +
      (canPol ? `<div class="box"><b>Política de impersonação</b><p class="hint" style="margin-top:2px">Aplicada no servidor. O limite real é o menor entre a política e as permissões do perfil.</p><div class="fg--2 fg" style="margin-top:10px">${sel('modo', 'Modo', [['leitura', 'Somente leitura'], ['escrita', 'Leitura e escrita', !can('suporte:impersonar_escrita') || !(PERM_MAP['suporte:impersonar_escrita'] || '').includes(a.p)]], pol ? pol.modo : 'leitura', (PERM_MAP['suporte:impersonar_escrita'] || '').includes(a.p) ? '' : 'O perfil Suporte não tem escrita.')}${sel('max', 'Tempo máximo', [[15, '15 minutos'], [30, '30 minutos'], [60, '1 hora'], [120, '2 horas'], [0, 'Sem limite']], pol ? (pol.max || 0) : 30)}</div><label class="check"><input type="checkbox" name="motivo" ${!pol || pol.motivo ? 'checked' : ''}><span>Motivo ou ticket obrigatório</span></label>${radios('pall', [['all', 'Em todas as organizações'], ['sel', 'Só nas escolhidas abaixo']], polAll ? 'all' : 'sel')}${orgChecks('porgs', polAll ? [] : pol.orgs)}</div>` : a.p === 'S' ? `<p class="note">Super admin impersona sem restrição, sem motivo e sem limite de tempo (D15). Sempre com aviso à organização e atribuição ao administrador real.</p>` : `<p class="note">Este perfil não impersona. Impersonação: ${polText(a)}</p>`) +
      (locked || self ? '' : `<label class="check"><input type="checkbox" name="off" ${a.on ? '' : 'checked'}><span>Conta desativada (encerra as sessões na hora)</span></label>`) +
      inp('senha', 'Sua senha, para confirmar', {type: 'password', msg: 'Protótipo: qualquer valor serve.'}) + why(), ok: 'Salvar alterações',
      onOk: fd => {
        const esc_ = fd.get('esc') || 'all', orgs = fd.getAll('orgs'); if (esc_ === 'sel' && !orgs.length && !locked) return 'Escolha pelo menos uma organização.';
        if (!(fd.get('senha') || '').length) return 'Confirme a sua senha.'; const w = checkWhy(fd); if (w) return w;
        const ch = [], np = locked ? a.p : fd.get('p');
        if (np !== a.p) { ch.push(`perfil ${PROFILES[a.p][0]} → ${PROFILES[np][0]}`); a.p = np; if (np !== 'U') a.pol = null; else if (!a.pol) a.pol = {modo: 'leitura', max: 30, motivo: true, orgs: 'all'}; }
        if (!locked) { const ne = esc_ === 'all' ? 'all' : orgs; if (JSON.stringify(ne) !== JSON.stringify(a.escopo)) { ch.push('escopo de organizações'); a.escopo = ne; } }
        if (canPol && fd.get('modo')) { const pm = fd.get('pall') === 'all' ? 'all' : fd.getAll('porgs'); if (fd.get('pall') === 'sel' && !pm.length) return 'Escolha as organizações da política.'; const np_ = {modo: fd.get('modo'), max: +fd.get('max') || 0, motivo: !!fd.get('motivo'), orgs: pm}; if (JSON.stringify(np_) !== JSON.stringify(a.pol)) { a.pol = np_; ch.push(`política de impersonação (${np_.modo === 'escrita' ? 'escrita' : 'leitura'}, ${np_.max ? np_.max + ' min' : 'sem limite'}, motivo ${np_.motivo ? 'obrigatório' : 'opcional'})`); } }
        if (!locked && !self) { const off = !!fd.get('off'); if (off === a.on) { a.on = !off; ch.push(off ? 'desativou a conta' : 'reativou a conta'); } }
        if (!ch.length) return 'Nada mudou.';
        audit('admin', `Alterou ${a.n}: ${ch.join('; ')}`, null, fd.get('why')); save(); render(); toast('Administrador atualizado');
      }});
  },
  'ip-add'() {
    modal({title: 'Adicionar endereço permitido', lead: 'A API passa a aceitar a Control Tower deste IP.', body: inp('ip', 'Endereço IPv4', {ph: '203.0.113.50'}) + inp('n', 'Descrição') + why(), ok: 'Adicionar',
      onOk: fd => { const ip = fd.get('ip').trim(); if (!/^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/.test(ip)) return 'Informe um IPv4 válido.'; if (S.ips.some(p => p.ip === ip)) return 'Este IP já está na lista.'; if (!fd.get('n').trim()) return 'Descreva de onde é este IP.'; const w = checkWhy(fd); if (w) return w; S.ips.push({ip, n: fd.get('n').trim(), by: meName(), t: now()}); const x = `Lista de IPs: adicionou ${ip} (${fd.get('n').trim()})`; pushCfgHist([x], fd.get('why')); audit('config', x, null, fd.get('why')); save(); render(); toast('IP adicionado'); }});
  },
  'ip-del'(el) {
    const ip = el.dataset.ip, mine = meAdmin().ip === ip;
    modal({title: `Remover ${ip}`, lead: mine ? 'Este é o seu IP de agora. Remover pode deixar você sem acesso na próxima requisição.' : 'Quem usa este endereço deixa de acessar a Control Tower.', body: why(), ok: 'Remover', danger: true,
      onOk: fd => { if (S.ips.length <= 1) return 'A lista não pode ficar vazia.'; if (mine) return 'Remova o seu próprio IP só de outro endereço permitido.'; const w = checkWhy(fd); if (w) return w; S.ips = S.ips.filter(p => p.ip !== ip); const x = `Lista de IPs: removeu ${ip}`; pushCfgHist([x], fd.get('why')); audit('config', x, null, fd.get('why')); save(); render(); toast('IP removido'); }});
  },
  'cfg-discard'() { UI.cfgDraft = null; render(); },
  'cfg-save'() {
    const df = cfgDiffs(); if (!df.length) return;
    const bad = []; Object.values(CFG_F).flat().forEach(f => { const v = cfgDraft()[f[0]]; if (v === undefined) return; if (f[2] === 'num' && (v === '' || isNaN(+v) || +v < f[6].min || +v > f[6].max)) bad.push(`${f[1]}: entre ${f[6].min} e ${f[6].max}`); if (f[2] === 'txt' && !String(v).trim()) bad.push(`${f[1]}: não pode ficar vazio`); });
    if (bad.length) return toast('Há valores inválidos', bad.join(' · '));
    const show = v => v === 'suspensa' ? 'Vira Suspensa' : v === 'ativa_tol' ? 'Vira Ativa com tolerância' : v;
    modal({title: 'Salvar configurações', lead: `${df.length} ${plural(df.length, 'alteração', 'alterações')}. Cria uma nova versão, com autor e motivo.`, body: `<div class="box"><ul>${df.map(([k, v]) => `<li><b>${CFG_LABEL[k]}</b>: ${esc(show(S.cfg[k]))} → ${esc(show(v))}</li>`).join('')}</ul></div>` + why(), ok: 'Salvar',
      onOk: fd => { const w = checkWhy(fd); if (w) return w; const ch = df.map(([k, v]) => `${CFG_LABEL[k]}: ${show(S.cfg[k])} → ${show(v)}`); df.forEach(([k, v]) => { S.cfg[k] = typeof S.cfg[k] === 'number' ? +v : v; }); pushCfgHist(ch, fd.get('why')); audit('config', ch.join('; '), null, fd.get('why')); UI.cfgDraft = null; save(); render(); toast('Configuração salva', 'Nova versão registrada e auditada.'); }});
  },
  /* ---- impersonacao ---- */
  'imp-start'(el) { impStart(el.dataset.id); },
  'imp-end'() { impEnd(); }
};

function impStart(id) {
  const o = ORG(id), pol = polFor(o); if (!pol.ok) return toast('Impersonação indisponível', pol.why);
  if (UI.imp) return toast('Já existe uma sessão de impersonação ativa', 'Encerre a atual antes de iniciar outra.');
  const us = o.users.filter(u => u.on); if (!us.length) return toast('Esta organização não tem usuário ativo');
  const writeOk = can('suporte:impersonar_escrita') && pol.modo === 'escrita';
  const durs = ME === 'S' ? [[15, '15 minutos'], [30, '30 minutos'], [60, '1 hora'], [120, '2 horas'], [0, 'Sem limite']] : [15, 30, 60, 120].filter(m => !pol.max || m <= pol.max).map(m => [m, m < 60 ? m + ' minutos' : (m / 60) + ' h']);
  modal({title: `Impersonar em ${esc(o.nome)}`, lead: 'Você opera como a pessoa escolhida. A organização é informada, todo ato fica atribuído a você e segredos nunca aparecem.',
    body: sel('u', 'Entrar como', us.map(u => [u.id, `${u.n} · ${u.p}`]), us[0].id) + fld('Modo', radios('modo', [['leitura', 'Somente leitura'], ['escrita', 'Leitura e escrita', writeOk ? '' : (can('suporte:impersonar_escrita') ? 'Sua política não libera escrita.' : 'Seu perfil não tem escrita.'), !writeOk]], 'leitura')) + sel('min', 'Duração', durs, durs[Math.min(1, durs.length - 1)][0], pol.max ? `Sua política limita a ${pol.max} minutos.` : '') + fld(pol.motivo ? 'Motivo ou ticket' : 'Motivo ou ticket (opcional para você)', '<textarea class="field field--area" name="why" placeholder="Ex.: ticket #482, dúvida no fechamento de caixa"></textarea>'), ok: 'Iniciar sessão',
    onOk: fd => {
      const why_ = (fd.get('why') || '').trim(); if (pol.motivo && why_.length < 5) return 'Sua política exige motivo ou ticket (mínimo de 5 caracteres).';
      const u = us.find(x => x.id === fd.get('u')), modo = fd.get('modo') === 'escrita' && writeOk ? 'escrita' : 'leitura', min = +fd.get('min');
      UI.imp = {org: o.id, userName: u.n, userPerfil: u.p, perfilKey: PERFIL_KEY[u.p] || 'dono', modo, start: now(), min, ends: min ? now() + min * MIN : null, why: why_};
      const mt = modo === 'escrita' ? 'leitura e escrita' : 'somente leitura';
      o.hist.unshift({t: now(), by: 'Plataforma', x: `Administrador da plataforma acessou como ${u.n} (${mt})`, why: ''});
      audit('impersonacao', `Iniciou impersonação (${mt}, ${min ? min + ' min' : 'sem limite'}) como ${u.n} (${u.p})`, o, why_);
      save(); startTimer(); nav({screen: 'impersonacao'}); toast('Sessão de impersonação iniciada', 'A organização foi informada.');
    }});
}
let timer = null;
function startTimer() { clearInterval(timer); timer = setInterval(() => { const i = UI.imp; if (!i) return clearInterval(timer); const t = impLeft(); $$('#impT,#impT2').forEach(e => e.textContent = t); if (i.ends && now() >= i.ends) impEnd(true); }, 1000); }
function impEnd(auto) {
  const i = UI.imp; if (!i) return; const o = ORG(i.org), m = Math.max(1, Math.round((now() - i.start) / MIN));
  UI.imp = null; clearInterval(timer);
  o.hist.unshift({t: now(), by: 'Plataforma', x: `Acesso da plataforma encerrado após ${m} min`, why: ''});
  audit('impersonacao', `Encerrou a impersonação após ${m} min${auto ? ' (limite de tempo)' : ''}`, o, '');
  save(); nav({screen: 'org', id: o.id}); render(); toast(auto ? 'Sessão encerrada por limite de tempo' : 'Sessão de impersonação encerrada');
}
function closeMenus() { const m = $('#memenu'); if (m) m.remove(); }

/* ===== eventos ===== */
document.addEventListener('click', e => {
  if (!e.target.closest('.me,#memenu')) closeMenus();
  if (!e.target.closest('.sw')) { const m = $('#gqm'); if (m) m.hidden = true; }
  const el = e.target.closest('[data-act]');
  if (el) { const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); } return; }
  const tr = e.target.closest('tr.go[data-href]'); if (tr && !e.target.closest('a,button')) location.hash = tr.dataset.href.slice(1);
});
document.addEventListener('change', e => {
  const t = e.target, k = t.dataset.ch; if (!k) return;
  if (k === 'size') navm({[t.dataset.sk]: t.value, [t.dataset.pk]: ''});
  else if (k === 'plano') navm({plano: t.value, page: ''});
  else if (k === 'adm') navm({adm: t.value, page: ''});
  else if (k === 'orgflag') {
    const o = ORG(t.dataset.id), f = S.flags.find(x => x.id === t.dataset.f), v = t.value;
    const d = modal({title: `${esc(f.n)} em ${esc(o.nome)}`, lead: v ? `Abre uma exceção: ${v === 'on' ? 'ligada' : 'desligada'} só para esta organização.` : 'Volta a seguir o que o plano define.', body: why(), ok: 'Aplicar',
      onOk: fd => { const w = checkWhy(fd); if (w) return w; if (v) o.flags[f.id] = v; else delete o.flags[f.id]; const x = v ? `${v === 'on' ? 'Ligou' : 'Desligou'} "${f.n}" para esta organização (exceção)` : `Voltou "${f.n}" a seguir o plano`; o.hist.unshift({t: now(), by: meName(), x, why: fd.get('why')}); audit('flag', x, o, fd.get('why')); save(); toast('Funcionalidade atualizada'); }});
    d.addEventListener('close', render);
  } else if (k === 'flagplan') {
    const f = S.flags.find(x => x.id === t.dataset.f), i = +t.dataset.i, on = t.checked, p = S.plans[i];
    const n = S.orgs.filter(o => o.plano === p.id && o.estado !== 'encerrada' && !o.flags[f.id]).length;
    const d = modal({title: `${on ? 'Ligar' : 'Desligar'} "${esc(f.n)}" no plano ${esc(p.n)}`, lead: `Muda para ${n} ${plural(n, 'organização', 'organizações')} sem exceção. ${on ? '' : 'Quem já usa perde o acesso na hora.'}`, body: why(), ok: on ? 'Ligar' : 'Desligar', danger: !on,
      onOk: fd => { const w = checkWhy(fd); if (w) return w; f.pl[i] = on ? 1 : 0; audit('flag', `${on ? 'Ligou' : 'Desligou'} "${f.n}" para o plano ${p.n}`, null, fd.get('why')); save(); toast('Funcionalidade atualizada', `${n} ${plural(n, 'organização afetada', 'organizações afetadas')}.`); }});
    d.addEventListener('close', render);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in === 'q') { const R = route(); R.q = t.value; delete R.page; location.hash = href(R); }
  else if (t.dataset.in === 'gq') globalSearch(t);
  else if (t.dataset.ci) { cfgDraft()[t.dataset.ci] = t.type === 'number' ? t.value : t.value; render(); }
});
function globalSearch(inp_) {
  const m = $('#gqm'), q = strip(inp_.value.trim()); if (!q) { m.hidden = true; return; }
  const L = S.orgs.filter(o => strip(o.nome + ' ' + o.cnpj + ' ' + o.dono.n + ' ' + o.dono.email).includes(q)).slice(0, 6);
  m.innerHTML = L.length ? L.map(o => `<a href="${href({screen: 'org', id: o.id})}"><span>${esc(o.nome)}</span><small>${esc(o.cidade)} · ${ST[o.estado][0]}</small></a>`).join('') : '<div class="mh" style="padding:10px">Nenhuma organização encontrada</div>'; m.hidden = false;
}
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(), typing = ['input', 'textarea', 'select'].includes(tag);
  if (e.key === 'Escape') { closeMenus(); const m = $('#gqm'); if (m) m.hidden = true; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { const g = $('#gq'); if (g) { e.preventDefault(); g.focus(); } }
  if (e.key === '[' && !typing && !e.target.closest('dialog')) ACT.rail();
  if (e.key === 'Enter' && e.target.id === 'gq') { const a = $('#gqm a'); if (a) { location.hash = a.getAttribute('href').slice(1); } }
  if (e.key === 'Enter' && e.target.id === 'lf') e.preventDefault();
});
document.addEventListener('submit', e => { if (e.target.id === 'lf') { e.preventDefault(); ME = 'S'; try { localStorage.setItem('ct.profile', ME); } catch (_) {} nav({screen: 'visao'}); } });

/* ===== inicio ===== */
try { const th = localStorage.getItem('ct.theme') || localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; else if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch (_) {}
window.addEventListener('hashchange', render);
if (!location.hash && !ME) location.hash = '#screen=login';
render();

</script>
