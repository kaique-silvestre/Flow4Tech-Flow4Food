/* ---------- acoes ---------- */
function buzz(){try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}}
const lastRd=c=>Math.max(0,...c.items.filter(i=>(i.s==="sent"||i.s==="queued")).map(i=>i.rd||1));
const lastRound=c=>{const r=lastRd(c);return r?c.items.filter(i=>(i.s==="sent"||i.s==="queued")&&(i.rd||1)===r):[]};
function ovl(on){try{parent.postMessage({flow:"overlay",on:!!on},"*")}catch(e){}}
function obsKeep(){clearTimeout(S.obsT);S.obsT=setTimeout(()=>{S.obs=null;S.obsOther=false;renderObs()},9000)}
function renderObs(){
  const el=$("#obs");if(!el)return;const c=byId(S.cur),it=S.obs&&c&&c.items.find(i=>i.k===S.obs&&i.s==="pend");
  if(!it){el.innerHTML="";return}
  const p=PM[it.p],on=it.obs||[],opts=obsFor(p),extra=on.filter(o=>!opts.includes(o));
  el.innerHTML=`<div class="obs" role="group" aria-label="Observações para ${it.q}× ${esc(p.n)}"><span class="obs__l">Obs. <b>${esc(p.n)}</b></span>`+
   (S.obsOther?`<form data-form="obsother"><input id="obsin" class="field" maxlength="28" placeholder="Ex.: sem canudo" aria-label="Observação personalizada"><button class="btn btn--sm btn--primary" type="submit">OK</button></form>`:
   [...opts,...extra].map(o=>`<button class="chip" data-act="obsc" data-o="${esc(o)}" aria-pressed="${on.includes(o)}">${esc(o)}</button>`).join("")+`<button class="chip" data-act="obsother">Outra…</button>`)+
   `<button class="chip" data-act="obsx" aria-label="Fechar observações">${ic("check")} Pronto</button></div>`;
  obsKeep();
}
function addItem(pid,n){
  const c=byId(S.cur);let it=c.items.find(i=>i.s==="pend"&&i.p===pid);
  if(it)it.q+=n;else{it={k:"n"+(KEY++),p:pid,q:n,s:"pend"};c.items.push(it)}
  c.act=0;buzz();S.obs=it.k;S.obsOther=false;refreshC();
  const p=PM[pid];say(`${n} ${p.n} na rodada`);
}
function sendRound(){
  const c=byId(S.cur),pd=pend(c);if(!pd.length)return;
  const rd=1+Math.max(1,...c.items.map(i=>i.rd||1)),ids=pd.map(i=>i.k);
  pd.forEach(i=>{i.rd=rd;i.sentAt=0;i.s=S.offline?"queued":"sent"});c.act=0;
  if(S.offline){S.queue.push({t:"send",c:c.id,ids,label:`Rodada ${rd} · ${c.nome} (${pd.reduce((a,i)=>a+i.q,0)} itens)`});toast("Sem conexão: rodada na fila, envio automático.")}
  else{showUndo(`Rodada ${rd} enviada · ${ids.length} ${ids.length>1?"produtos":"produto"}`,()=>{pd.forEach(i=>i.s="pend");refreshC();say("Envio desfeito")})}
  closeSheet();refreshC();
}
function showUndo(msg,fn){clearTimeout(S.toast);S.undo=fn;S.toast=setTimeout(()=>{S.undo=null;drawToast(null)},8000);drawToast(msg,true)}
function toast(msg){clearTimeout(S.toast);S.undo=null;S.toast=setTimeout(()=>drawToast(null),4500);drawToast(msg,false)}
function drawToast(msg,undo){
  const t=$("#toast");if(t)t.remove();if(!msg)return;
  const d=document.createElement("div");d.id="toast";d.className="toast toast--action";d.setAttribute("role","status");
  d.style.setProperty("--dur",undo?"8s":"4.5s");
  d.innerHTML=`<span>${esc(msg)}</span>${undo?'<button data-act="undo">Desfazer</button>':""}<i></i>`;
  $("#phone").appendChild(d);say(msg);
}
function flush(){
  if(S.offline||!S.queue.length)return;
  S.queue.forEach(q=>{
    const c=byId(q.c);if(!c)return;
    if(q.t==="send")c.items.forEach(i=>{if(q.ids.includes(i.k))i.s="sent"});
    if(q.t==="cancel"){const i=c.items.find(x=>x.k===q.k);if(i){i.s="cancelled";i.cq=false}}
    if(q.t==="close"){c.st=q.st}
  });
  const n=S.queue.length;S.queue=[];toast(n+(n>1?" ações reenviadas":" ação reenviada")+" com sucesso");
  S.view==="comanda"?refreshC():renderList();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,c=S.cur?byId(S.cur):null;
  switch(a){
   case"dsback":S.ds=false;renderList();break;
   case"theme":{const d=document.documentElement;d.dataset.theme=d.dataset.theme==="dark"?"light":"dark";break}
   case"filter":S.filter=b.dataset.k;renderList();break;
   case"clearf":S.filter="all";S.q="";renderList();break;
   case"retry":S.err=false;S.loading=true;renderList();setTimeout(()=>{S.loading=false;renderList()},700);break;
   case"open":openComanda(b.dataset.id);break;
   case"new":S.kp="";openSheet("keypad");break;
   case"kd":if(S.kp.length<3){S.kp+=b.dataset.d;if(S.kp==="0")S.kp="";redraw()}break;
   case"kbs":S.kp=S.kp.slice(0,-1);redraw();break;
   case"kfree":startMesa(b.dataset.n);break;
   case"kok":if(S.kp)startMesa(S.kp);break;
   case"kname":S.sheet="name";drawSheet();break;
   case"kback":S.sheet="keypad";drawSheet();break;
   case"back":S.view="list";S.cur=null;renderList();break;
   case"tab":S.tab=b.dataset.k;S.pq="";$("#pq").value="";renderTabs();renderProducts();$("#pl").scrollTop=0;break;
   case"add":addItem(+b.dataset.p,1);break;
   case"qty":S.qtyP=+b.dataset.p;openSheet("qty");break;
   case"qadd":{const n=+b.dataset.n,p=S.qtyP;closeSheet();addItem(p,n);break}
   case"inc":{c.items.find(i=>i.k===b.dataset.k).q++;refreshC();break}
   case"dec":{const i=c.items.find(i=>i.k===b.dataset.k);i.q--;if(i.q<=0)c.items=c.items.filter(x=>x!==i);refreshC();break}
   case"send":if(FLOW_CONFIG.mobile.CONFIRM_SEND)openSheet("send");else sendRound();break;
   case"repeat":{const lr=lastRound(c);lr.forEach(i=>{const ex=c.items.find(x=>x.s==="pend"&&x.p===i.p);if(ex)ex.q+=i.q;else c.items.push({k:"n"+(KEY++),p:i.p,q:i.q,s:"pend",obs:(i.obs||[]).slice()})});c.act=0;buzz();refreshC();say("Rodada "+lastRd(c)+" repetida: "+lr.reduce((a,i)=>a+i.q,0)+" itens na nova rodada");break}
   case"histadd":{hist(c).forEach(([p,q])=>{const ex=c.items.find(x=>x.s==="pend"&&x.p===p);if(ex)ex.q+=q;else c.items.push({k:"n"+(KEY++),p,q,s:"pend"})});c.act=0;buzz();refreshC();say("Itens da última vez adicionados");break}
   case"hora":{const i=BK.indexOf(bucket());S.hora=BK[(i+1)%BK.length].h[0];refreshC();break}
   case"obs":S.obs=b.dataset.k;S.obsOther=false;renderObs();break;
   case"obsc":{const it=c.items.find(i=>i.k===S.obs);if(it){const o=b.dataset.o;it.obs=it.obs||[];const x=it.obs.indexOf(o);if(x>=0)it.obs.splice(x,1);else it.obs.push(o);renderItems();renderObs()}break}
   case"obsother":S.obsOther=true;renderObs();setTimeout(()=>$("#obsin")&&$("#obsin").focus(),0);break;
   case"obsx":S.obs=null;S.obsOther=false;clearTimeout(S.obsT);renderObs();break;
   case"sendok":sendRound();break;
   case"undo":if(S.undo){S.undo();S.undo=null;clearTimeout(S.toast);drawToast(null)}break;
   case"cancel":S.cancelItem=b.dataset.k;S.reason=null;openSheet("cancel");break;
   case"reason":S.reason=b.dataset.r;redraw();break;
   case"cancelok":{const i=c.items.find(x=>x.k===S.cancelItem);
     if(S.offline){i.cq=true;S.queue.push({t:"cancel",c:c.id,k:i.k,label:`Cancelar ${i.q}× ${PM[i.p].n} (${S.reason})`});}
     else{i.s="cancelled"}
     i.reason=S.reason;closeSheet();refreshC();toast(S.offline?"Cancelamento na fila.":"Item cancelado: "+S.reason);break}
   case"close":openSheet("close");break;
   case"svc":c.svc=c.svc===false;c.amt=null;redraw();break;
   case"splitn":c.split=+b.dataset.n;c.parts=0;c.amt=null;redraw();break;
   case"unpay":{const p=c.pays.splice(+b.dataset.i,1)[0];if(c.split>1&&c.parts>0)c.parts--;redraw();break}
   case"pay":{const bl=billOf(c);if(!bl.restC||pend(c).length)break;const m=b.dataset.r;c.pays=c.pays||[];c.pays.push({m,v:bl.dueC/100});if(bl.n>1&&!bl.custom)c.parts=(c.parts||0)+1;c.amt=null;
     const left=bl.restC-bl.dueC;
     if(left<=0){if(S.offline){S.queue.push({t:"close",c:c.id,st:"closed",label:"Fechar conta "+c.nome+" ("+m+")"});toast("Na fila: será enviado ao voltar a conexão.")}else{c.st="closed";toast(c.nome+" fechada · "+brl(bl.totC/100))}
       closeSheet();S.view="list";S.cur=null;renderList()}
     else{say(m+" "+brl(bl.dueC/100)+" recebido. Falta "+brl(left/100));redraw()}break}
   case"await":{if(S.offline){S.queue.push({t:"close",c:c.id,st:"await",label:"Pedir pagamento "+c.nome});toast("Na fila: será enviado ao voltar a conexão.")}
     else{c.st="await";toast("Pagamento solicitado · "+c.nome)}
     closeSheet();S.view="list";S.cur=null;renderList();break}
   case"queue":openSheet("queue");break;
   case"online":setOnline(true);closeSheet();break;
   case"sheetx":closeSheet();break;
  }

  if(e.target.dataset.form==="qother"){e.preventDefault();const n=parseInt($("#qo").value,10);if(n>0&&n<200){const p=S.qtyP;closeSheet();addItem(p,n)}else $("#qo").focus()}
});
document.addEventListener("keydown",e=>{
  if(S.sheet==="keypad"&&/^[0-9]$/.test(e.key)){S.kp.length<3&&(S.kp+=e.key);if(S.kp==="0")S.kp="";redraw();return}
  if(S.sheet==="keypad"&&e.key==="Backspace"){S.kp=S.kp.slice(0,-1);redraw();return}
  if(S.sheet==="keypad"&&e.key==="Enter"&&S.kp){e.preventDefault();startMesa(S.kp);return}
  if(e.key==="Escape"&&S.sheet)closeSheet();
  if(e.key==="Tab"&&S.sheet){const f=[...$("#sh").querySelectorAll("button:not(:disabled),input")];if(!f.length)return;
    const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus()}}
});

const toRgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const toHex = a => '#'+a.map(v=>Math.round(clampN(v,0,255)).toString(16).padStart(2,'0')).join('').toUpperCase();
const mix = (a,b,t) => { const x=toRgb(a), y=toRgb(b); return toHex(x.map((v,i)=>v*(1-t)+y[i]*t)); }; // t = quanto vai para b
const lum = h => { const [r,g,b]=toRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return .2126*r+.7152*g+.0722*b; };

  v['--brand-ink'] = ratio('#FFFFFF',e.brand) >= ratio('#1A0E09',e.brand) ? '#FFFFFF' : '#1A0E09';

const P$ = s => panel.querySelector(s), P$$ = s => [...panel.querySelectorAll(s)];
let statusT, undoState = null;
function say(msg, undo){
  const s = P$('#cfg-status'); clearTimeout(statusT); s.textContent = msg;
  if(undo){ const b = document.createElement('button'); b.type='button'; b.textContent='Desfazer'; b.onclick = () => { st = undoState; undoState=null; save(); applyTheme(resolveTheme(st.themeMode)); applyAll(); s.textContent='Restauração desfeita.'; }; s.appendChild(b); }
  statusT = setTimeout(()=>{ s.textContent=''; }, undo ? 9000 : 4500);
}
function presetOf(){ // qual preset esta ativo
  const cur = JSON.stringify(cleanColors(st.colors));
  for(const [id,,v] of PRESETS) if(JSON.stringify(cleanColors(v||{light:{},dark:{}}))===cur) return id;
  return null;
}
const PAIRS = [['ink','bg','Texto sobre a página'],['ink','card','Texto sobre os cartões'],['muted','bg','Texto secundário sobre a página'],['muted','card','Texto secundário sobre os cartões'],['brand','bg','Cor da marca sobre a página'],['open','card','Status Aberta sobre os cartões'],['alert','card','Status Alerta sobre os cartões']];
function syncPanel(){
  renderProfPanel();
  const th = theme, e = eff(th), o = st.colors[th];
  P$('#cfg-editing').textContent = 'Editando as cores do tema ' + (th==='dark' ? 'escuro' : 'claro') + '. Troque o tema para editar o outro.';
  P$$('.cfg-seg button').forEach(b=>{
    const k=b.dataset.k; let cur = BOOLK.includes(k) ? (st[k]?'on':'off') : k==='mode' ? mode : String(st[k]);
    b.setAttribute('aria-pressed', String(cur===b.dataset.v));
  });
  P$$('[data-preset]').forEach(b=>b.setAttribute('aria-pressed', String(presetOf()===b.dataset.preset)));
  P$$('.cfg-c').forEach(r=>{
    const k=r.dataset.ck, v=e[k];
    const cc=r.querySelector('.cc'), ch=r.querySelector('.ch'), dot=r.querySelector('.cr');
    if(cc.value.toUpperCase()!==v) cc.value=v.toLowerCase();
    if(document.activeElement!==ch) ch.value=v;
    const on = has(o,k); dot.dataset.on = String(on); dot.disabled = !on;
  });
  const set = (id,v)=>{ const el=P$(id); if(el && document.activeElement!==el) el.value=v; };
  set('#f-title',st.fontTitle); set('#f-ui',st.fontUi); set('#f-ts',st.textScale); set('#f-rad',st.radius); set('#f-sw',st.staleWeb); set('#f-sm',st.staleMobile); set('#f-svc',st.servicePct);
  P$('#f-ts').nextElementSibling.textContent = st.textScale+'%'; P$('#f-rad').nextElementSibling.textContent = st.radius+' px';
  const bad = [];
  for(const t of ['light','dark']){ const c = eff(t); PAIRS.forEach(([a,b,n])=>{ const r = ratio(c[a],c[b]); if(r<4.5) bad.push(`${n} (${t==='dark'?'escuro':'claro'}): ${r.toFixed(1).replace('.',',')}:1`); }); }
  const w = P$('#cfg-warn');
  w.hidden = !bad.length;
  w.innerHTML = bad.length ? '<b>Contraste baixo</b>. O mínimo para ler com conforto é 4,5:1.<ul>'+bad.map(x=>'<li>'+x+'</li>').join('')+'</ul>' : '';
}
function setVal(k,v){
  if(k==='themeMode'){ st.themeMode=v; save(); applyTheme(resolveTheme(v)); return; }
  if(k==='mode'){ setMode(v,true); return; }
  if(BOOLK.includes(k)) st[k] = v==='on';
  else if(k==='servicePct'){ const n=Math.round(Number(v)); if(!(n>=0&&n<=30)) return; st[k]=n; }
  else if(k==='borderW') st.borderW = Number(v);
  else if(k==='textScale'||k==='radius') st[k] = Number(v);
  else if(k==='staleWeb'||k==='staleMobile'){ const n=Math.round(Number(v)); if(!(n>=5&&n<=480)) return; st[k]=n; }
  else st[k] = v;
  save(); applyAll();
}
function setColor(k,raw){
  const hx = normHex(raw); if(!hx) return false;
  if(hx===DEFC[theme][k]) delete st.colors[theme][k]; else st.colors[theme][k]=hx;
  save(); applyAll(); return true;
}
panel.addEventListener('click', e => {
  const t = e.target; let el;
  if(t.closest('[data-trocar]')){ openEntry(); return; }
  if(t.closest('[data-permreset]')){ ensureSes(); SES.over = {}; saveSes(); renderProfPanel(true); applyAll(); say('Permissões voltaram ao padrão do perfil.'); return; }
  if((el=t.closest('[data-ds]'))){ const m=el.dataset.ds; H.p=new URLSearchParams('screen=design-system'); history.replaceState(null,'','#m='+m+'&screen=design-system'); setMode(m,false); mount(m,H.p); return; }
  if((el=t.closest('.cfg-seg button'))){ setVal(el.dataset.k, el.dataset.v); return; }
  if((el=t.closest('[data-preset]'))){ const p=PRESETS.find(x=>x[0]===el.dataset.preset)[2]; st.colors = cleanColors(p||{light:{},dark:{}}); save(); applyAll(); return; }
  if((el=t.closest('.cr'))){ delete st.colors[theme][el.closest('.cfg-c').dataset.ck]; save(); applyAll(); return; }
  if(t.closest('#cfg-close')){ closePanel(true); return; }
  if(t.closest('#cfg-copy')) return copyCfg();
  if(t.closest('#cfg-paste')) return showIo('paste');
  if(t.closest('#cfg-io-x')){ P$('#cfg-io').hidden = true; return; }
  if(t.closest('#cfg-apply')) return importCfg();
  if(t.closest('#cfg-reset')){ undoState = JSON.parse(JSON.stringify(st)); st = defaults(); save(); applyTheme(resolveTheme(st.themeMode)); applyAll(); say('Tudo restaurado ao padrão.', true); }
});
panel.addEventListener('input', e => {
  const t = e.target, row = t.closest('.cfg-c');
  if(row){ const k=row.dataset.ck; if(t.classList.contains('cc')) setColor(k,t.value); else if(t.classList.contains('ch')){ const v=t.value.trim(); if(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) setColor(k,v); } return; }
  if(t.matches('input[type=range],input[type=number]')) setVal(t.dataset.k, t.value);
});
panel.addEventListener('change', e => {
  const t = e.target;
  if(t.matches('[data-perm]')){
    ensureSes(); const k = t.dataset.perm, p = curProf(), def = PERMS[k][1].includes(p.letter);
    SES.over = SES.over||{}; if(t.checked===def) delete SES.over[k]; else SES.over[k] = t.checked; saveSes();
    const row = t.closest('label'); row.querySelector('em')?.remove(); if(t.checked!==def) row.insertAdjacentHTML('beforeend','<em>alterada</em>');
    const rb = panel.querySelector('[data-permreset]'); if(rb){ const n = Object.keys(SES.over).length; rb.disabled = !n; rb.textContent = n ? `Voltar ao padrão do perfil (${n} alteradas)` : 'Voltar ao padrão do perfil'; }
    applyAll(); return;
  }
  if(t.matches('select')) setVal(t.dataset.k, t.value);
  else if(t.classList.contains('ch')) { if(!setColor(t.closest('.cfg-c').dataset.ck, t.value)) syncPanel(); else syncPanel(); }
  else if(t.matches('input[type=number]')){ const mn=t.min!==''?+t.min:5, mx=t.max!==''?+t.max:480; const n=clampN(Math.round(Number(t.value)||0),mn,mx); t.value=n; setVal(t.dataset.k,n); }
});
function exportJson(){ return JSON.stringify(Object.assign({versao:1}, JSON.parse(JSON.stringify(st)), {mode:mode}), null, 2); }
function showIo(kind, text){
  const io=P$('#cfg-io'), ta=P$('#cfg-ta'); io.hidden=false;
  P$('#cfg-io-l').textContent = kind==='paste' ? 'Cole aqui a configuração (JSON) e aplique' : 'Seu navegador bloqueou a cópia automática. Copie o texto abaixo (Ctrl+C ou Cmd+C)';
  P$('#cfg-apply').hidden = kind!=='paste';
  ta.value = text||''; ta.focus(); if(kind!=='paste') ta.select();
}
function copyCfg(){
  const txt = exportJson();
  const fb = () => { showIo('copy', txt); say('Selecione e copie o texto.'); };
  try{ navigator.clipboard.writeText(txt).then(()=>say('Configuração copiada.'), fb); }catch(_){ fb(); }
}
function importCfg(){
  let o; try{ o = JSON.parse(P$('#cfg-ta').value); }catch(_){ say('Não consegui ler: o texto não é um JSON válido.'); return; }
  if(!o || typeof o!=='object'){ say('Não consegui ler: formato inesperado.'); return; }
  st = norm(o); save(); applyTheme(resolveTheme(st.themeMode)); applyAll();
  if(o.mode==='web'||o.mode==='mobile') setMode(o.mode,true);
  P$('#cfg-io').hidden = true; say('Configuração aplicada.');
}

let isOpen = false, keepUntil = 0; // keepUntil: o app recem-montado toma o foco sozinho (ex.: open=3); nao fecha o painel por isso
function openPanel(){
  if(isOpen) return; isOpen = true; panel.hidden = false; bubble.setAttribute('aria-expanded','true'); bubble.setAttribute('aria-label','Fechar configurações do protótipo');
  syncPanel(); panel.focus({preventScroll:true});
}
function closePanel(restoreFocus){
  if(!isOpen) return; isOpen = false; panel.hidden = true; bubble.setAttribute('aria-expanded','false'); bubble.setAttribute('aria-label','Abrir configurações do protótipo (só no protótipo, não existe no produto)');
  if(restoreFocus) bubble.focus();
}
bubble.addEventListener('click', () => isOpen ? closePanel(true) : openPanel());
document.addEventListener('keydown', e => { if(e.key==='Escape' && isOpen){ e.preventDefault(); closePanel(true); } });
document.addEventListener('pointerdown', e => { if(isOpen && !panel.contains(e.target) && !bubble.contains(e.target)) closePanel(false); });
addEventListener('blur', () => setTimeout(() => { if(isOpen && Date.now()>keepUntil && document.activeElement && document.activeElement.tagName==='IFRAME') closePanel(false); }, 0));

/* ===== BOLINHA DE CONFIGURACAO: posicao (ao lado do painel lateral na web, dentro da moldura no celular) ===== */
const stack = $('#bub-stack');
function placeBubbles(){
  const root = $('#cfg-root'), compact = isCompact();
  let bx = 16, by = 16, narrow = false;
  if(mode==='mobile'){
    const r = $('#app-mobile .phone').getBoundingClientRect();
    bx = Math.max(6, innerWidth-r.right+8); by = Math.max(0, innerHeight-r.bottom)+86; narrow = r.width>=innerWidth-2;
  } else if(compact){ bx = 8; by = 14; }
  else bx = 16;
  const s = root.style; s.setProperty('--bx',bx+'px'); s.setProperty('--by',by+'px');
  s.setProperty('--cx', (mode==='mobile'?16:bx)+'px');
  root.dataset.compact = compact?'1':'0'; root.dataset.sk = mode==='mobile'?'phone':'desk'; root.dataset.narrow = narrow?'1':'0';
}
addEventListener('resize',()=>{ clearTimeout(placeBubbles.t); placeBubbles.t = setTimeout(()=>{ if(isCompact()!==(stack.dataset.c==='1')) { stack.dataset.c = isCompact()?'1':'0'; applyAll(); } else placeBubbles(); },60); });

const curProf = () => profById(SES && SES.id) || profById('gerente');
const permOn = (p,k) => (SES && SES.id===p.id && SES.over && k in SES.over) ? !!SES.over[k] : PERMS[k][1].includes(p.letter);
function profilePayload(){
  const p = curProf(), w = (SES && SES.id===p.id && SES.who) || null, user = w ? w.user : p.user;
  return {id:p.id,name:p.name,user:user,nick:w ? w.nick : p.nick,initials:user.split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase(),perms:Object.keys(PERMS).filter(k=>permOn(p,k)),limits:p.limits,landing:p.landing};
}
const hx = x => String(x).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const menuNames = p => MENU_PERMS.filter(([n,k])=>k.split('|').some(x=>PERMS[x][1].includes(p.letter))).map(x=>x[0]);

const entryEl = $('#entry');
let enView = 'choose', enId = null, enPin = '', enUser = '', enMsg = '';
function renderEntry(){
  if(enView==='choose'){
    entryEl.innerHTML = `<div class="en__wrap"><header class="en__top"><span class="en__logo">Flow4Tech</span><span class="en__tag">demo do protótipo</span></header>
      <h1 id="en-h">Entrar como…</h1>
      <p class="en__sub">Cada perfil é um conjunto de permissões com nome. O que a pessoa vê e pode fazer muda conforme o perfil. Depois de entrar, ajuste as permissões pela bolinha de configuração.</p>
      <div class="en__grid" role="list">${ORG_PROFILES.map(p=>`<button class="en__card" role="listitem" type="button" data-pick="${p.id}"><span class="en__av" aria-hidden="true">${p.letter}</span><span class="en__n">${p.name}</span><span class="en__d">${p.desc}</span><span class="en__v"><b>Vê no menu:</b> ${menuNames(p).join(', ')}</span><span class="en__m"><span class="en__chip">${p.device==='mobile'?'Celular':'Web'}</span><span class="en__chip">${p.email?'E-mail e senha':'Usuário e PIN'}</span></span></button>`).join('')}</div>
      <p class="en__ct"><b>Control Tower</b> (administradores da plataforma: super admin, suporte, financeiro e operações) é outro sistema, com login e permissões próprios. Ainda não prototipado.</p></div>`;
    entryEl.querySelector('.en__card')?.focus();
    return;
  }
  const p = profById(enId);
  const head = `<button class="lnk en__back" type="button" data-back>← Trocar de perfil</button><div class="en__lc"><div class="en__lh"><span class="en__av" aria-hidden="true">${p.letter}</span><div><b id="en-h">Bar do Zé · Unidade Centro</b><span>Entrando como ${p.name}</span></div></div>`;
  if(p.email){
    entryEl.innerHTML = `<div class="en__wrap en__wrap--login">${head}
      <form class="en__f" data-login novalidate><label for="en-mail">E-mail</label><input id="en-mail" type="email" autocomplete="off" value="${hx(p.mail)}"><label for="en-pass">Senha</label><input id="en-pass" type="password" autocomplete="off" value="demo1234">
        <button class="btn btn--primary en__go" type="submit">Entrar</button><div class="en__or"><span>ou</span></div>
        <button class="btn en__go" type="button" data-google><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"/><path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.5-1.8.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.300A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.900 10.700a5.400 5.400 0 0 1 0-3.400V5H.9a9 9 0 0 0 0 8z"/><path fill="#EA4335" d="M9 3.600c1.300 0 2.500.5 3.400 1.300l2.600-2.600A9 9 0 0 0 .9 5l3 2.300C4.600 5.200 6.600 3.600 9 3.600z"/></svg> Entrar com o Google</button>
        <div class="en__links"><button class="lnk" type="button" data-forgot>Esqueci minha senha</button></div></form>
      <p class="en__hint" role="status">${enMsg||'Demonstração: qualquer e-mail e senha entram. No sistema real, o primeiro acesso exige trocar a senha temporária.'}</p></div></div>`;
    entryEl.querySelector('#en-pass').focus();
    return;
  }
  const users = p.users || [p.user];
  entryEl.innerHTML = `<div class="en__wrap en__wrap--login">${head}
    <span class="en__dev">Aparelho do salão registrado · Unidade Centro</span>
    ${users.length>1 ? `<p class="en__lbl">Quem está entrando?</p><div class="en__users" role="group" aria-label="Colaborador">${users.map(u=>`<button class="chip" type="button" data-user="${hx(u)}" aria-pressed="${u===enUser}">${hx(u)}</button>`).join('')}</div>` : `<p class="en__lbl">Usuário</p><div class="en__user1">${hx(enUser)}</div>`}
    <p class="en__lbl">PIN pessoal</p><div class="en__dots" role="img" aria-label="${enPin.length} dígitos digitados">${[0,1,2,3,4,5].map(i=>`<i data-on="${i<enPin.length}"></i>`).join('')}</div>
    <div class="en__pad" role="group" aria-label="Teclado numérico">${[1,2,3,4,5,6,7,8,9].map(d=>`<button type="button" data-d="${d}" aria-label="${d}">${d}</button>`).join('')}<button type="button" class="sm" data-bs>Apagar</button><button type="button" data-d="0" aria-label="0">0</button><button type="button" class="sm" data-clear>Limpar</button></div>
    <button class="btn btn--primary en__go" type="button" data-login ${enPin.length>=4?'':'disabled'}>Entrar</button>
    <p class="en__hint">Demonstração: qualquer PIN de 4 a 6 dígitos entra. O PIN é pessoal e vale só neste aparelho e nesta unidade.</p></div></div>`;
  entryEl.querySelector('[data-d="1"]')?.focus();
}
function openEntry(){
  if(typeof closePanel==='function') closePanel(false);
  enView = 'choose'; enId = null; enPin = ''; enMsg = ''; entryEl.hidden = false; renderEntry();
}
function enLogin(){
  const p = profById(enId); if(!p) return;
  SES = {id:p.id,over:{}}; if(p.users && enUser && enUser!==p.user) SES.who = {user:enUser,nick:enUser.split(' ')[0]}; saveSes();
  entryEl.hidden = true;
  H.p = new URLSearchParams(); mode = p.device; history.replaceState(null,'','#m='+p.device); setMode(p.device,false); mountAll(); syncPanel(); placeBubbles();
}
entryEl.addEventListener('click', e => {
  const t = e.target; let el;
  if((el=t.closest('[data-pick]'))){ enId = el.dataset.pick; enView = 'login'; enPin = ''; enMsg = ''; const p = profById(enId); enUser = p.user; renderEntry(); return; }
  if(t.closest('[data-back]')){ enView = 'choose'; enId = null; renderEntry(); return; }
  if(t.closest('[data-google]')){ enLogin(); return; }
  if(t.closest('[data-forgot]')){ enMsg = 'No sistema real, um link de redefinição seria enviado ao e-mail. Fora do protótipo.'; renderEntry(); return; }
  if((el=t.closest('[data-user]'))){ enUser = el.dataset.user; renderEntry(); return; }
  if((el=t.closest('[data-d]'))){ if(enPin.length<6) enPin += el.dataset.d; renderEntry(); entryEl.querySelector(`[data-d="${el.dataset.d}"]`)?.focus(); return; }
  if(t.closest('[data-bs]')){ enPin = enPin.slice(0,-1); renderEntry(); entryEl.querySelector('[data-bs]')?.focus(); return; }
  if(t.closest('[data-clear]')){ enPin = ''; renderEntry(); return; }
  if(t.closest('button[data-login]')){ if(enPin.length>=4) enLogin(); return; }
});
entryEl.addEventListener('submit', e => { e.preventDefault(); enLogin(); });
document.addEventListener('keydown', e => {
  if(entryEl.hidden || enView!=='login' || profById(enId).email) return;
  if(/^[0-9]$/.test(e.key) && !e.metaKey && !e.ctrlKey){ if(enPin.length<6) enPin += e.key; renderEntry(); e.preventDefault(); return; }
  if(e.key==='Backspace'){ enPin = enPin.slice(0,-1); renderEntry(); e.preventDefault(); return; }
  if(e.key==='Enter' && enPin.length>=4){ e.preventDefault(); enLogin(); }
});
function renderProfPanel(force){
  const box = document.getElementById('cfg-prof'); if(!box) return;
  try{
    if(!force && box.contains(document.activeElement)) return;
    const p = curProf(), pl = profilePayload(), groups = {};
    Object.entries(PERMS).forEach(([k,[l,L,g]])=>{ (groups[g] = groups[g]||[]).push([k,l,permOn(p,k),L.includes(p.letter)]); });
    const nOver = Object.keys((SES && SES.id===p.id && SES.over) || {}).length;
    box.innerHTML = `<div class="cfg-prof"><div class="cfg-prof__h"><span class="cfg-prof__av" aria-hidden="true">${p.letter}</span><div><b>${p.name}</b><span>${hx(pl.user)} · ${p.email?'e-mail e senha':'usuário e PIN'} · desconto até ${p.limits.desconto}%</span></div></div>
      <div class="cfg-prof__b"><button type="button" class="cfg-btn pri" data-trocar>Trocar de perfil</button><button type="button" class="cfg-btn" data-permreset ${nOver?'':'disabled'}>${nOver?`Voltar ao padrão do perfil (${nOver} alteradas)`:'Voltar ao padrão do perfil'}</button></div>
      <p class="cfg-help">Perfil é um conjunto de permissões. Ligue ou desligue abaixo e veja as telas mudarem na hora. Só as permissões que o protótipo já usa estão aqui.</p>
      ${Object.entries(groups).map(([g,list])=>`<p class="cfg-sub">${g}</p>${list.map(([k,l,on,def])=>`<label class="cfg-perm"><input type="checkbox" data-perm="${k}" ${on?'checked':''}><span>${l}<code>${k}</code></span>${on!==def?'<em>alterada</em>':''}</label>`).join('')}`).join('')}</div>`;
  }catch(_){}
}
if(H.profile && profById(H.profile)){ SES = {id:H.profile,over:(SES && SES.id===H.profile && SES.over) || {}}; saveSes(); }
const NEEDS_ENTRY = H.entry==='1' || (!SES && !H.m);

setMode(mode, false);
mountAll();
syncPanel();
placeBubbles(); booted = true; stack.dataset.c = isCompact()?'1':'0';
if(NEEDS_ENTRY) openEntry();
if(H.cfg==='open'){ keepUntil = Date.now()+2000; openPanel(); }
</script>
</body>
</html>
