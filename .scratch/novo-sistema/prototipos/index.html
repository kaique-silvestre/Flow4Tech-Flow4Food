<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Comandas · protótipo</title>
<!--
  PROTOTIPO DESCARTAVEL - Comandas (web + celular do garcom) num arquivo unico, sem build.
  Cada app roda dentro do proprio <iframe srcdoc> (zero colisao de CSS/JS/ids). Esta pagina
  guarda o que e compartilhado: tokens de identidade, tema claro/escuro, config, modo e hash.

  Hash (parametros combinaveis com &). O modo vai primeiro; o resto e repassado ao app do modo:
    #m=web | #m=mobile        modo (padrao: ultimo usado em localStorage "flow.mode", senao web)
    #theme=dark|light         tema (vale para os dois modos; padrao: localStorage "theme", senao do SO)
  Modo web:
    #m=web&view=table         tabela em vez de cartoes
    #m=web&open=<id>          abre o painel de detalhe da comanda (ex.: open=3)
    #m=web&empty=1            lista sem comandas
    #m=web&skel=1             esqueleto de carregamento
    #m=web&err=1              erro de carga com banner "Tentar novamente"
  Modo celular:
    #m=mobile&c=<id>          abre direto a comanda (ex.: c=12 Mesa 12, c=3 Mesa 3)
    #m=mobile&c=12&sheet=close|cancel|qty|send|queue   abre a folha (use junto de c=)
    #m=mobile&c=12&pend=1     pre-carrega 3 itens nao enviados
    #m=mobile&empty=1 | skel=1 | err=1 | offline=1     estados vazio/esqueleto/erro/sem conexao
    #m=mobile&screen=design-system   catalogo de componentes (versao celular; &only=celular mostra so as pecas do celular)
    #cfg=open                 abre o painel da bolinha de configuracao
    #m=mobile&sheet=keypad    teclado numerico de nova comanda (&hora=14 simula a faixa do dia nos Frequentes)
  Teclas (web): N nova comanda (mesa ou nome + Enter) / na janela: digitar "3 chope" + Enter adiciona, Enter com a busca vazia envia, Esc fecha / [ recolhe o menu / Ctrl+K busca.
    Comanda (web): clicar no card ou N abre uma janela grande. Aba Lancar: itens para enviar + cardapio com busca; aba Conta: pagamento.
  Persistencia (localStorage): flow.settings (tema, cores, forma, taxa).
  Catalogo de componentes (web): #m=web&screen=design-system (item "Sistema > Componentes" no menu lateral).
  Ex.: index.html#m=mobile&c=12&pend=1&sheet=send&theme=dark
  Mudar o hash recarrega o app do modo indicado. Trocar de modo (seletor "Versao" na bolinha de configuracao) preserva o estado do outro.

  Para a futura tela de configuracao: tudo ajustavel esta nos blocos "AJUSTAVEL" abaixo
  (tokens <style id="tokens">, layout, e FLOW_CONFIG no script). Ao mudar, chame mountAll().
-->

<!-- ===== AJUSTAVEL 1/4: FONTES (uma URL, usada pela pagina e injetada nos dois apps) ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- ===== AJUSTAVEL 2/4: TOKENS DE IDENTIDADE (unico conjunto; injetado nos dois apps) ===== -->
<style id="tokens">
:root,[data-scope=light]{
  /* superficie e texto */
  --bg:#F8F8F9; --card:#FFFFFF; --line:#E5E7EB; --line-strong:#D1D5DB;
  --ink:#0F172A; --muted:#5B6678; --faint:#8A93A3;
  /* marca */
  --brand:#2563EB; --brand-ink:#FFFFFF; --brand-soft:#EAF1FE;
  /* status: marcador + texto legivel + tom suave. Rosa-carmim, verde-azulado e ambar fosco: frios/calmos como o azul da marca; textos >= 4,5:1 */
  --open:#2B7A62; --wait:#C48A1D; --alert:#BE3F55; --paid:#94A3B8;
  --wait-ink:#85570F; --paid-ink:#5B6678;
  --open-soft:#E8F4EF; --wait-soft:#FAF1DD; --alert-soft:#FBEFF1;
  --closed:var(--paid); --closed-ink:var(--paid-ink);
  /* superficies auxiliares */
  --hl:#E6EDFC; --hover:#F1F2F4; --sidebar:#F2F3F5; --scrim:rgba(15,23,42,.45);
  color-scheme:light;
}
/* [data-scope=light|dark] permite mostrar os dois temas lado a lado na mesma pagina (catalogo de componentes) */
:root{
  /* forma (ajustaveis pela bolinha de configuracao) */
  --radius:14px; --radius-card:16px; --radius-sm:12px; --radius-sheet:20px;
  --border-w:1px;        /* espessura das bordas */
  --density:1;           /* escala de espacamentos e alturas de linha */
  --text-scale:1;        /* escala do texto (1 = 100%) */
  --r:var(--radius); --r-card:var(--radius-card);
  /* tipografia: uma familia sans para tudo */
  --font-title:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ui:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:var(--font-title);
  --sans:var(--font-ui);
}
:root[data-theme=dark],[data-scope=dark]{
  --bg:#0F1115; --card:#171A1F; --line:#272B33; --line-strong:#383E48;
  --ink:#F3F4F6; --muted:#A3AAB8; --faint:#7D8594;
  --brand:#6AA8FF; --brand-ink:#0A1226; --brand-soft:#15233F;
  --open:#5BC29A; --wait:#E0AC48; --alert:#F27C8E; --paid:#9AA1AE;
  --wait-ink:#E0AC48; --paid-ink:#A3AAB8;
  --open-soft:#12261F; --wait-soft:#2A2312; --alert-soft:#2C1820;
  --hl:#1A2A4A; --hover:#1F232A; --sidebar:#13161B; --scrim:rgba(0,0,0,.6);
  --closed:var(--paid); --closed-ink:var(--paid-ink);
  color-scheme:dark;
}
</style>

<!-- ===== AJUSTAVEL 3/4: LAYOUT DO CELULAR (o breakpoint de 500px esta no @media logo abaixo) ===== -->
<style id="layout">
:root{ --phone-w:390px; --phone-h:844px; }
</style>

<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 13px/1.4 var(--sans);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.stage{flex:1;min-height:0;position:relative}
.pane{position:absolute;inset:0}
body[data-mode=web] #app-mobile,body[data-mode=mobile] #app-web{display:none}
iframe{display:block;border:0;width:100%;height:100%;background:var(--bg)}
#app-mobile{display:grid;place-items:center}
#app-mobile .phone{width:var(--phone-w);height:min(var(--phone-h),calc(100% - 20px));border:1px solid var(--line-strong);overflow:hidden;background:var(--bg)}
@media (max-width:499.98px){ /* abaixo de 500px o celular ocupa a tela */
  #app-mobile{display:block}
  #app-mobile .phone{width:100%;height:100%;border:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- Componentes compartilhados (botao, chip, badge, campo, card, folha...) e catalogo: injetados nos dois apps -->
<style type="text/plain" id="css-components">
/* ===== COMPONENTES COMPARTILHADOS (injetado nos dois apps, depois dos tokens e antes do CSS de cada app) =====
   MAPA  componente  ->  classe (modificadores)                                  ->  futuro componente React
   Button            .btn (--primary --ghost --danger --sm --icon --pill --block, .is-loading) -> <Button variant size iconOnly loading>
   Chip / filtro     .chip (aria-pressed) .chip__count                           -> <Chip pressed count>
   Segmented         .seg > button[aria-pressed]                                 -> <SegmentedControl>
   Tabs              .tabs > .tab[aria-selected]                                 -> <Tabs>
   Field (campo)     .field (--search --area --error) + .field-label .field-msg  -> <TextField>, <SearchField>, <Select>, <Textarea>
   Stepper / qtd     .stepper (--sm), .sq (--qty --add)                          -> <NumberStepper>, <QuantityButton>
   Choice            .check .radio .switch                                       -> <Checkbox> <Radio> <Switch>
   Badge de status   .badge (--open --wait --alert --closed)                     -> <StatusBadge status>
   Card              .card (--alert --selected) + .cm/.row/.stat (layout)        -> <Card>, <ComandaCard>, <StatCard>
   Avatar            .avatar (--lg)                                              -> <Avatar>
   Empty state       .empty (--plain)                                            -> <EmptyState>
   Skeleton          .skeleton                                                   -> <Skeleton>
   Banner            .banner (--info --warning --error, --queue)                 -> <Banner tone>
   Toast             .toast (--action)                                           -> <Toast action>
   Sheet             .sheet + .backdrop + .grab, .opt, .qty-grid                 -> <BottomSheet>
   Dialog            .dialog                                                     -> <ConfirmDialog>
   Teclas            kbd                                                         -> <Kbd>
   Dados             .kv .money .elapsed .list-row .pager                        -> <KeyValue> <Money> <Elapsed> <ListRow> <Pagination>
   Locais de cada app (ainda nao compartilhados): sidebar .nav, breadcrumb .crumbs, tabela .tw, painel .panel,
   popover .menu, tooltip .rtip (web); .sendbar .pr-row .trail .it (celular).
   "Sabor" (web x celular): as dimensoes que mudam entre os apps (altura de toque, peso, fonte) vem de variaveis --fl-*
   definidas por sabor: padrao = web; html[data-flavor=mobile] ou .flv-m = celular. */
:root,[data-scope]{
  --fl-btn-h:34px;--fl-btn-hmin:0px;--fl-btn-px:14px;--fl-btn-fs:14px;--fl-btn-fw:500;--fl-btn-gap:6px;--fl-btn-jc:normal;
  --fl-btn-bd:var(--line-strong);--fl-btn-hover:var(--hover);--fl-pri-hover:brightness(.93);--fl-press:translateY(1px);--fl-dis:.5;--fl-danger-bd:var(--line-strong);
  --fl-sm-h:30px;--fl-sm-px:10px;--fl-sm-fs:13px;--fl-sm-fw:500;--fl-sm-minw:0px;--fl-icon-w:34px;
  --fl-chip-h:30px;--fl-chip-px:10px;--fl-chip-fs:14px;--fl-chip-gap:6px;--fl-chip-bg:transparent;--fl-chip-fg:var(--muted);--fl-chip-on-bg:var(--card);--fl-chip-on-fg:var(--ink);--fl-chip-on-bd:var(--line-strong);
  --fl-badge-gap:7px;--fl-badge-fw:500;--fl-badge-open-fg:inherit;
  --fl-field-h:34px;--fl-field-px:10px;--fl-field-gap:8px;--fl-search-pl:10px;--fl-field-bd:var(--line);--fl-field-bg:var(--card);
  --fl-search-ip:1px 2px;--fl-seg-h:28px;--fl-tab-h:46px;--fl-sk-r:var(--radius-sm);--fl-sk-op:1;--fl-sk-lo:.45;--fl-focus-w:2px;--fl-hit:34px
}
:root[data-flavor=mobile],:root[data-flavor=mobile] [data-scope],.flv-m{
  --fl-btn-h:52px;--fl-btn-hmin:48px;--fl-btn-px:20px;--fl-btn-fs:17px;--fl-btn-fw:600;--fl-btn-gap:8px;--fl-btn-jc:center;
  --fl-btn-bd:var(--line);--fl-btn-hover:var(--card);--fl-pri-hover:none;--fl-press:scale(.98);--fl-dis:.45;--fl-danger-bd:color-mix(in srgb,var(--alert) 55%,var(--line));
  --fl-sm-h:44px;--fl-sm-px:12px;--fl-sm-fs:14px;--fl-sm-fw:500;--fl-sm-minw:44px;--fl-icon-w:44px;
  --fl-chip-h:44px;--fl-chip-px:14px;--fl-chip-fs:15px;--fl-chip-gap:8px;--fl-chip-bg:var(--card);--fl-chip-fg:var(--ink);--fl-chip-on-bg:var(--ink);--fl-chip-on-fg:var(--bg);--fl-chip-on-bd:var(--ink);
  --fl-badge-gap:5px;--fl-badge-fw:600;--fl-badge-open-fg:var(--open);
  --fl-field-h:48px;--fl-field-px:14px;--fl-field-gap:calc(9px + var(--border-w));--fl-search-pl:calc(13px - var(--border-w));--fl-field-bd:var(--line);--fl-field-bg:var(--card);
  --fl-search-ip:0px;--fl-seg-h:44px;--fl-tab-h:46px;--fl-sk-r:var(--radius-card);--fl-sk-op:.55;--fl-sk-lo:.25;--fl-focus-w:3px;--fl-hit:44px
}

svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shrink{from{width:100%}to{width:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes skeleton-pulse{50%{opacity:var(--fl-sk-lo)}}

/* Button */
.btn{display:inline-flex;align-items:center;justify-content:var(--fl-btn-jc);gap:var(--fl-btn-gap);min-height:max(var(--fl-btn-hmin),calc(var(--fl-btn-h)*var(--density)));padding:0 var(--fl-btn-px);border-radius:var(--r);border:var(--border-w) solid var(--fl-btn-bd);background:var(--card);color:inherit;font-family:inherit;font-size:calc(var(--fl-btn-fs)*var(--text-scale));font-weight:var(--fl-btn-fw);white-space:nowrap;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--fl-btn-hover)}
.btn:active:not(:disabled){transform:var(--fl-press)}
.btn--primary,.btn--primary:hover{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);--spin:var(--brand-ink)}
.btn--primary:hover{filter:var(--fl-pri-hover)}
.btn--ghost,.btn--ghost:hover{border-color:transparent;background:transparent;color:var(--muted)}
.btn--ghost:hover{background:var(--hover);color:var(--ink)}
.btn--danger{color:var(--alert);border-color:var(--fl-danger-bd)}
.btn--sm{min-height:var(--fl-sm-h);min-width:var(--fl-sm-minw);padding:0 var(--fl-sm-px);font-size:calc(var(--fl-sm-fs)*var(--text-scale));font-weight:var(--fl-sm-fw)}
.btn--icon{width:var(--fl-icon-w);padding:0;justify-content:center}
.btn--pill{border-radius:999px}
.btn--block{flex:1}
.btn:disabled{opacity:var(--fl-dis);cursor:not-allowed}
.btn.is-loading{position:relative;color:transparent!important;pointer-events:none}
.btn.is-loading::after{content:"";position:absolute;inset:0;margin:auto;width:16px;height:16px;border-radius:50%;border:2px solid var(--spin,var(--ink));border-right-color:transparent;animation:spin .7s linear infinite}

/* Chip / filtro */
.chip{display:inline-flex;align-items:center;gap:var(--fl-chip-gap);min-height:var(--fl-chip-h);padding:0 var(--fl-chip-px);border:var(--border-w) solid var(--line);border-radius:var(--r);background:var(--fl-chip-bg);color:var(--fl-chip-fg);font-family:inherit;font-size:calc(var(--fl-chip-fs)*var(--text-scale));font-weight:500;cursor:pointer}
.chip[aria-pressed=true]{background:var(--fl-chip-on-bg);color:var(--fl-chip-on-fg);border-color:var(--fl-chip-on-bd)}
.chip__count{color:var(--muted);font-size:calc(13px*var(--text-scale))}
.chip[aria-pressed=true] .chip__count{color:inherit;opacity:.8}

/* Segmented control */
.seg{display:inline-flex;border:var(--border-w) solid var(--line-strong);border-radius:var(--r);padding:2px;background:var(--card)}
.seg button{border:0;background:none;min-height:var(--fl-seg-h);padding:0 12px;border-radius:var(--radius-sm);color:var(--muted);font-weight:500;font-family:inherit;font-size:inherit;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

/* Tabs */
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:2px 8px 0;border-bottom:var(--border-w) solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:var(--fl-tab-h);padding:0 12px;font-family:inherit;font-weight:600;font-size:calc(15px*var(--text-scale));color:var(--muted);background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brand)}

/* Field */
.field{display:block;height:var(--fl-field-h);padding:0 var(--fl-field-px);border:var(--border-w) solid var(--fl-field-bd);border-radius:var(--r);background:var(--fl-field-bg);color:var(--ink);font:inherit}
.field:disabled{opacity:.6;cursor:not-allowed}
.field--error{border-color:var(--alert)}
.field--area{height:auto;min-height:88px;padding:10px var(--fl-field-px);resize:vertical;width:100%}
.field--search{display:flex;align-items:center;gap:var(--fl-field-gap);padding-left:var(--fl-search-pl)}
.field--search:focus-within{outline:var(--fl-focus-w) solid var(--brand);outline-offset:2px}
.field--search svg{flex:none;color:var(--muted)}
.field--search input{border:0;background:none;outline:0;flex:1;min-width:0;height:100%;padding:var(--fl-search-ip);font:inherit;color:inherit}
.field-label{display:block;font-size:calc(12px*var(--text-scale));font-weight:500;color:var(--muted);margin:0 0 6px}
.field-msg{display:flex;align-items:center;gap:6px;margin:6px 0 0;font-size:calc(12px*var(--text-scale));color:var(--muted)}
.field-msg--error{color:var(--alert);font-weight:500}
.field-msg svg{width:14px;height:14px}
kbd{font:500 calc(11px*var(--text-scale)) var(--sans);color:var(--muted);border:var(--border-w) solid var(--line);border-radius:4px;padding:1px 5px;background:var(--bg)}

/* Stepper e quantidade */
.stepper{display:inline-flex;align-items:center}
.stepper button{width:44px;height:44px;border:var(--border-w) solid var(--line);border-radius:var(--r);background:var(--card);display:grid;place-items:center;cursor:pointer}
.stepper b{min-width:28px;text-align:center;font:600 calc(17px*var(--text-scale)) var(--serif)}
.stepper--sm button{width:32px;height:32px}
.sq{width:48px;height:48px;border:var(--border-w) solid var(--line);border-radius:var(--r);display:grid;place-items:center;background:var(--card);font-weight:600;font-size:calc(15px*var(--text-scale));cursor:pointer}
.sq--add{width:56px;border-color:var(--ink)}
.sq--add:active{background:var(--ink);color:var(--bg)}
.sq--qty{font-size:calc(14px*var(--text-scale))}

/* Escolhas: checkbox, radio, switch (novos) */
.check,.radio,.switch{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:var(--fl-hit);cursor:pointer}
.check input,.radio input{appearance:none;-webkit-appearance:none;margin:0;width:20px;height:20px;flex:none;border:var(--border-w) solid var(--line-strong);background:var(--card);display:grid;place-items:center;cursor:pointer}
.check input{border-radius:max(3px,calc(var(--radius-sm)/2))}
.radio input{border-radius:50%}
.check input:checked{background:var(--brand);border-color:var(--brand)}
.check input:checked::after{content:"";width:10px;height:5px;border-left:2px solid var(--brand-ink);border-bottom:2px solid var(--brand-ink);transform:translateY(-1px) rotate(-45deg)}
.radio input:checked{border:6px solid var(--brand)}
.check input:disabled,.radio input:disabled{opacity:.5;cursor:not-allowed}
.switch input{position:absolute;left:0;top:50%;width:44px;height:28px;margin:-14px 0 0;opacity:0;cursor:pointer}
.switch__track{position:relative;flex:none;width:44px;height:26px;border-radius:999px;background:var(--line-strong);transition:background-color .15s}
.switch__track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);transition:transform .15s}
.switch input:checked+.switch__track{background:var(--brand)}
.switch input:checked+.switch__track::after{transform:translateX(18px)}
.switch input:focus-visible+.switch__track{outline:2px solid var(--brand);outline-offset:2px}
.switch input:disabled+.switch__track{opacity:.5}

/* Badge de status: marcador + palavra, nunca so cor */
.badge{display:inline-flex;align-items:center;gap:var(--fl-badge-gap);font-size:calc(13px*var(--text-scale));font-weight:var(--fl-badge-fw);white-space:nowrap}
.badge i{width:8px;height:8px;flex:none;background:var(--c);border-radius:50%}
.badge svg{width:15px;height:15px}
.badge--open{--c:var(--open);color:var(--fl-badge-open-fg)}
.badge--wait{--c:var(--wait);color:var(--wait-ink)}
.badge--alert{--c:var(--alert);color:var(--alert)}
.badge--closed{--c:var(--paid);color:var(--paid-ink)}
.badge--alert i{border-radius:1px;transform:rotate(45deg)}
.badge--wait i{border-radius:1px}
.badge--closed i{background:none;border:1.5px solid var(--c)}

/* Card, avatar, empty, skeleton */
.card{background:var(--card);border:var(--border-w) solid var(--line);border-radius:var(--r-card)}
.card--alert{border-color:color-mix(in srgb,var(--alert) 55%,var(--line))}
.card--selected{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.avatar{flex:none;width:28px;height:28px;border-radius:50%;border:var(--border-w) solid var(--line-strong);display:grid;place-items:center;font:600 calc(12px*var(--text-scale)) var(--sans);background:var(--card)}
.avatar--lg{width:40px;height:40px;font-size:calc(14px*var(--text-scale))}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r-card);padding:56px 24px;text-align:center;background:var(--card)}
.empty--plain{border:0;border-radius:0;background:none;padding:0}
.skeleton{background:var(--line);border-radius:var(--fl-sk-r);opacity:var(--fl-sk-op);animation:skeleton-pulse 1.4s ease-in-out infinite}

/* Banner */
.banner{display:flex;align-items:center;gap:12px;padding:10px 14px;border:var(--border-w) solid var(--line);border-radius:var(--r)}
.banner--error{border-color:color-mix(in srgb,var(--alert) 55%,var(--line));background:var(--alert-soft)}
.banner--warning{border-color:var(--wait);background:var(--card);color:var(--wait-ink)}
.banner--info{border-color:color-mix(in srgb,var(--brand) 45%,var(--line));background:var(--brand-soft)}
.banner--queue{margin:0 16px 10px;padding:10px 12px;gap:10px;font-size:calc(14px*var(--text-scale));font-weight:600;text-align:left;width:calc(100% - 32px);min-height:48px}
.banner span.l{flex:1;min-width:0}
.banner small{display:block;font-weight:400;color:var(--muted)}

/* Toast: aparencia aqui; posicao em cada app */
.toast{background:var(--ink);color:var(--bg);border-radius:var(--r)}
.toast--action{position:relative;display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 4px 4px 14px}
.toast--action span{flex:1;font-size:calc(15px*var(--text-scale))}
.toast--action button{min-height:44px;padding:0 14px;font-weight:700;color:var(--bg);text-decoration:underline;text-underline-offset:3px;background:none;border:0;font-family:inherit;font-size:inherit;cursor:pointer}
.toast--action i{position:absolute;left:0;bottom:0;height:3px;background:var(--bg);opacity:.5;animation:shrink var(--dur,8s) linear forwards;border-radius:0 0 0 var(--r)}

/* Sheet (folha inferior) */
.backdrop{position:absolute;inset:0;background:var(--scrim);z-index:var(--z-backdrop);animation:fade .2s var(--ease,cubic-bezier(.22,1,.36,1))}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:var(--z-sheet);background:var(--card);border-top:var(--border-w) solid var(--line);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;padding:6px 16px calc(16px + env(safe-area-inset-bottom));max-height:88%;overflow-y:auto;animation:up .28s var(--ease,cubic-bezier(.22,1,.36,1))}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet h2{font:600 calc(20px*var(--text-scale))/1.25 var(--serif);letter-spacing:-.02em;margin:0 0 4px}
.sheet .lead{color:var(--muted);font-size:calc(15px*var(--text-scale));margin:0 0 14px}
.qty-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qty-grid button{min-height:56px;border:var(--border-w) solid var(--line);border-radius:var(--r);background:var(--bg);color:inherit;font:600 calc(20px*var(--text-scale)) var(--serif);cursor:pointer}
.qty-grid button:active{background:var(--ink);color:var(--bg)}
.opt{min-height:52px;padding:0 14px;border:var(--border-w) solid var(--line);border-radius:var(--r);background:var(--bg);color:inherit;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:500;font-family:inherit;font-size:inherit;cursor:pointer}
.opt[aria-pressed=true],.opt[aria-checked=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--card);font-weight:600}

/* Dialog de confirmacao (novo) */
.dialog{width:min(420px,100%);background:var(--card);border:var(--border-w) solid var(--line-strong);border-radius:var(--radius-card);padding:20px;box-shadow:0 8px 24px rgb(15 23 42/.14)}
.dialog h2{margin:0 0 6px;font:600 calc(18px*var(--text-scale))/1.25 var(--serif);letter-spacing:-.015em}
.dialog p{margin:0;color:var(--muted)}
.dialog__actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}

/* Dados (novos): chave-valor, dinheiro, tempo aberto, linha de lista, paginacao */
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:500;font-variant-numeric:tabular-nums lining-nums}
.money{font-variant-numeric:tabular-nums lining-nums;font-weight:600;white-space:nowrap}
.money small{color:var(--muted);font-weight:500;margin-right:4px}
.money--lg{font:600 calc(26px*var(--text-scale))/1 var(--serif);letter-spacing:-.025em}
.money--lg small{font-size:calc(14px*var(--text-scale))}
.elapsed{font-variant-numeric:tabular-nums;color:var(--muted)}
.elapsed--alert{color:var(--alert);font-weight:600}
.list-row{display:flex;align-items:center;gap:12px;min-height:calc(52px*var(--density));padding:8px 0;border-bottom:var(--border-w) solid var(--line)}
.list-row__main{flex:1;min-width:0}
.list-row__main small{display:block;color:var(--muted)}
.pager{display:inline-flex;align-items:center;gap:4px}
.pager .btn[aria-current=page]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
</style>
<style type="text/plain" id="css-catalog">
/* ===== CATALOGO DE COMPONENTES (pagina "Componentes"; compartilhado pelos dois apps) ===== */

.ds-row{display:flex;flex-wrap:wrap;gap:16px 20px;align-items:flex-end}
.ds-col{display:flex;flex-direction:column;gap:16px}

.ds-code pre{margin:8px 0;padding:12px 14px;border:var(--border-w) solid var(--line);border-radius:var(--r);background:var(--card);overflow:auto;max-height:240px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);tab-size:2}
.ds-react{margin:8px 0 0;color:var(--muted);font-size:calc(12px*var(--text-scale))}
.ds-react b{color:var(--ink);font-weight:500}
.flv-m{font-size:calc(16px*var(--text-scale));line-height:1.4}
.flv-m .btn svg.i,.ds .btn svg.i{width:18px;height:18px;stroke:currentColor;stroke-width:2}
.flv-m .btn svg.i{width:20px;height:20px}
.ds .chip svg.i{width:16px;height:16px}
.flv-m .empty--plain h2{font:600 calc(20px*var(--text-scale))/1.25 var(--serif);letter-spacing:-.02em;margin:0 0 8px}
.flv-m .empty--plain p{margin:0 0 20px;color:var(--muted);max-width:34ch}
.flv-m .field::placeholder,.flv-m .field--search input::placeholder{color:var(--muted);opacity:1}
.ds-ph .field::placeholder{color:var(--muted);opacity:1}
.is-focus{outline:var(--fl-focus-w) solid var(--brand);outline-offset:2px}
.ds-frame{position:relative;height:300px;overflow:hidden;border:var(--border-w) solid var(--line);border-radius:var(--r-card);background:var(--bg);isolation:isolate}
.ds-frame--dialog{display:grid;place-items:center;padding:16px}
.ds-frame--dialog .dialog{position:relative;z-index:1}
.ds-frame .panel{position:absolute;transform:none;visibility:visible;width:min(340px,100%);box-shadow:none;animation:none}
.ds-frame .sheet,.ds-frame .backdrop{animation:none}
.ds .toast{position:relative;left:auto;bottom:auto;transform:none;animation:none;display:block;width:fit-content;max-width:100%;padding:9px 14px}
.ds .toast--action{display:flex;padding:4px 4px 4px 14px;width:100%;max-width:380px}
.ds .toast--action i{animation:none;width:62%}
.ds .menu{position:static;display:inline-block}
.ds .rtip{position:static;animation:none;display:inline-block}
.ds .banner--queue{margin:0;width:100%}
.ds .nav a{cursor:default}
.ds .side{width:220px;border:var(--border-w) solid var(--line);border-radius:var(--r-card);overflow:hidden}
.ds .side.is-rail{width:72px}
.ds .crumbs{padding:0}
.ds .tw{width:100%}
.ds .tw tr{cursor:default}
/* fundamentos */
.ds-sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px 12px}
.ds-grp{grid-column:1/-1;margin:10px 0 0;font-size:calc(12px*var(--text-scale));font-weight:600;color:var(--muted)}

.ds-no{color:var(--alert)!important;font-weight:600}
.ds-type{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr);gap:10px 18px;align-items:baseline}

.ds-type div{min-width:0;overflow-wrap:anywhere}
.ds-sp{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px}

.ds-sp i{display:block;background:var(--brand-soft);border:1px solid var(--brand)}
.ds-rad{width:76px;height:76px;background:var(--card);border:var(--border-w) solid var(--line-strong)}
.ds-bd{width:104px;height:56px;background:var(--card);display:grid;place-items:center;font-size:calc(12px*var(--text-scale));color:var(--muted);border-radius:var(--radius-sm)}
.ds-dens{flex:1 1 200px;min-width:0}
.ds-dens .list-row{min-height:calc(52px*var(--density))}
/* comparar claro/escuro */
.ds-cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.themebox{min-width:0;padding:16px;background:var(--bg);color:var(--ink);border:var(--border-w) solid var(--line);border-radius:var(--r-card)}
.themebox>.ds-tag{display:inline-block;margin-bottom:6px}
.themebox .ds-item:first-of-type{margin-top:6px}
.ds-cmp .ds-stage{flex-basis:200px;padding:12px}
.ds-cmp .ds-sws{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.ds-cmp .ds-type{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){.ds-cmp{grid-template-columns:1fr}}
@media (max-width:900px){
  .ds-layout{display:block}
  .ds-index{position:static;flex-direction:row;flex-wrap:wrap;margin-bottom:16px}
}
/* variante celular */
.ds--m{padding:0 0 24px;font-size:calc(15px*var(--text-scale))}
.ds--m .ds-layout{display:block}

<script type="text/plain" id="js-catalog">
/* ===== CATALOGO DE COMPONENTES: window.FlowDS.mount(container, {flavor:'web'|'mobile', scroller, only}) =====
   Monta a pagina inteira a partir dos MESMOS estilos dos apps (components.css + css de cada app).
   Cada item: n (nome), use (quando usar), props, react (nome futuro), h (HTML da amostra, string ou function(flavor)),
   only ('web'|'mobile'), nm (markup precisa de css so do celular: no web aparece apenas no quadro do celular),
   single (independe do sabor), novo (componente proposto, ainda nao usado nas telas), code (texto alternativo do bloco). */
(function(){
'use strict';
var esc=function(s){return String(s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]})};
var IC={
 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7"/>',warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 dot:'<circle cx="12" cy="12" r="5" fill="currentColor"/>',off:'<path d="M2 2l20 20M8.5 16.4a5 5 0 017 0M5 12.9a10 10 0 015-2.6M19 12.9a10 10 0 00-2.5-1.9M12 20h.01"/>',
 info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',back:'<path d="M15 5l-7 7 7 7"/>',filter:'<path d="M4 6h16M7 12h10M10 18h4"/>'
};
function svg(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
function V(l,h,full){return '<figure class="ds-v'+(full?' ds-v--full':'')+'">'+h+'<figcaption>'+l+'</figcaption></figure>'}
function R(){return '<div class="ds-row">'+[].join.call(arguments,'')+'</div>'}
function badge(m,l,f){return '<span class="badge badge--'+m+'">'+(f==='mobile'?svg({open:'dot',wait:'clock',alert:'warn',closed:'check'}[m]):'<i></i>')+l+'</span>'}
var CHECKSVG='<svg viewBox="0 0 24 24" aria-hidden="true" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>';

/* ---------- fundamentos ---------- */
var TOK=[
 ['Superfícies',[['bg','Fundo da página','surf'],['card','Cartões e campos','surf'],['sidebar','Menu lateral','surf'],['hover','Hover','surf'],['hl','Destaque de linha','surf']]],
 ['Texto',[['ink','Texto','bg'],['muted','Texto secundário','bg'],['faint','Texto de apoio (só decorativo)','bg','dec']]],
 ['Bordas',[['line','Borda','bg','ui'],['line-strong','Borda de controle','bg','ui']]],
 ['Marca',[['brand','Marca','bg','ui'],['brand-ink','Texto sobre a marca','brand'],['brand-soft','Marca suave','surf']]],
 ['Status',[['open','Aberta','card','ui'],['wait','Aguardando (marcador)','card','ui'],['wait-ink','Aguardando (texto)','card'],['alert','Alerta','card'],['paid','Fechada (marcador)','card','ui'],['paid-ink','Fechada (texto)','card'],['open-soft','Aberta suave','surf'],['wait-soft','Aguardando suave','surf'],['alert-soft','Alerta suave','surf']]]
];
function swatches(){
  return '<div class="ds-sws">'+TOK.map(function(g){
    return '<p class="ds-grp">'+g[0]+'</p>'+g[1].map(function(t){
      var k=t[2],surf=k==='surf',ui=t[3]==='ui',dec=t[3]==='dec';
      var against=surf?'ink':k;
      var st=surf?'background:var(--'+t[0]+');color:var(--ink)':'background:var(--'+against+');color:var(--'+t[0]+')'+(ui?';border-color:var(--'+t[0]+')':'');
      return '<div class="ds-sw" data-need="'+(dec?0:ui?3:4.5)+'"><div class="ds-sw-chip'+(ui?' ds-sw-chip--ui':'')+'" style="'+st+'">Aa</div>'+
        '<b>--'+t[0]+'</b><span>'+t[1]+'</span><span class="ds-hex"></span><span class="ds-ratio"></span>'+
        '<i class="ds-probe" style="display:none;color:var(--'+t[0]+')"></i></div>';
    }).join('');

function typeScale(){
  var rows=[['Exibição · 32','32','600','R$ 1.284,50',1],['Título de página · 28','28','600','Comandas',1],['Título de painel · 22','22','600','Mesa 12',1],['Título de seção · 18','18','600','Itens da comanda',1],['Título de card · 16','16','600','Balcão 3',1],['Corpo · 14','14','400','Chope Pilsen 500 ml, 8 unidades, lançado por Carlos às 21:02.'],['Apoio · 13','13','400','2h22 aberta · Carlos · 19 itens'],['Legenda · 12','12','400','Cancelado: item lançado por engano'],['Micro · 11','11','500','⌘K']];
  return '<div class="ds-type">'+rows.map(function(r){return '<span>'+r[0]+' px</span><div style="font:'+r[2]+' calc('+r[1]+'px*var(--text-scale))/1.25 var('+(r[4]?'--serif':'--sans')+');letter-spacing:'+(+r[1]>=22?'-.02em':'0')+'">'+r[3]+'</div>'}).join('')+
   '<span>Pesos</span><div style="display:flex;flex-wrap:wrap;gap:4px 18px"><span style="font-weight:400;color:var(--ink);font-size:inherit">400 Regular</span><span style="font-weight:500;color:var(--ink);font-size:inherit">500 Médio</span><span style="font-weight:600;color:var(--ink);font-size:inherit">600 Semibold</span><span style="font-weight:700;color:var(--ink);font-size:inherit">700 Bold</span></div>'+
   '<span>Números</span><div class="num" style="font-variant-numeric:tabular-nums lining-nums">0123456789 · R$ 1.284,50 · 21:14 (algarismos tabulares)</div>'+
   '<span>Família dos títulos</span><div class="ds-fam" data-v="--font-title"></div><span>Família da interface</span><div class="ds-fam" data-v="--font-ui"></div><span>Escala do texto</span><div class="ds-ro" data-v="--text-scale"></div></div>';
}
function spacing(){return '<div class="ds-sp">'+[4,8,12,16,20,24,32,40].map(function(n){return '<div><i style="width:'+n+'px;height:'+n+'px"></i>'+n+' px</div>'}).join('')+'</div>'}
function radii(){return '<div class="ds-row">'+[['--radius-sm','Pequeno','radius-sm'],['--radius','Controle (botão, campo)','radius'],['--radius-card','Cartão','radius-card'],['--radius-sheet','Folha','radius-sheet']].map(function(r){return '<div class="ds-v"><div class="ds-rad" style="border-radius:var('+r[0]+')"></div><figcaption><b style="color:var(--ink);font-weight:500">'+r[1]+'</b><br>'+r[0]+' · <span class="ds-ro" data-v="'+r[0]+'"></span></figcaption></div>'}).join('')+'<div class="ds-v"><div class="ds-rad" style="border-radius:999px"></div><figcaption><b style="color:var(--ink);font-weight:500">Pílula</b><br>999px</figcaption></div></div>'}
function borders(){return '<div class="ds-row"><div class="ds-v"><div class="ds-bd" style="border:var(--border-w) solid var(--line)">padrão</div><figcaption>--line · espessura <span class="ds-ro" data-v="--border-w"></span></figcaption></div>'+
  '<div class="ds-v"><div class="ds-bd" style="border:var(--border-w) solid var(--line-strong)">controle</div><figcaption>--line-strong</figcaption></div>'+
  '<div class="ds-v"><div class="ds-bd" style="border:var(--border-w) solid var(--ink);box-shadow:inset 0 0 0 1px var(--ink)">selecionado</div><figcaption>--ink + 1px interno</figcaption></div>'+
  '<div class="ds-v"><div class="ds-bd" style="border:var(--border-w) solid color-mix(in srgb,var(--alert) 55%,var(--line))">alerta</div><figcaption>--alert 55%</figcaption></div>'+
  '<div class="ds-v"><div class="ds-bd" style="border:1px dashed var(--line-strong)">vazio</div><figcaption>tracejada</figcaption></div></div>'}
function density(){

/* ---------- renderizacao ---------- */
function pretty(html){
  html=html.replace(/<svg[\s\S]*?<\/svg>/g,'<svg class="i" … />').replace(/\s+style="[^"]*"/g,'').replace(/\s+aria-hidden="true"/g,'');
  var toks=html.match(/<[^>]+>|[^<]+/g)||[],out=[],d=0,i=0,VOID={input:1,br:1,hr:1,img:1,path:1,circle:1};
  while(i<toks.length){
    var t=toks[i],ind=new Array(d+1).join('  ');
    if(t.charAt(0)!=='<'){ if(t.trim()) out.push(ind+t.trim()); i++; continue; }
    if(t.charAt(1)==='/'){ d=Math.max(0,d-1); out.push(new Array(d+1).join('  ')+t); i++; continue; }
    var name=(t.match(/^<([a-z0-9]+)/i)||[])[1];
    if(VOID[name]||/\/>$/.test(t)){ out.push(ind+t); i++; continue; }
    if(toks[i+1]&&toks[i+1].charAt(0)!=='<'&&toks[i+2]&&toks[i+2].charAt(1)==='/'){ out.push(ind+t+toks[i+1].trim()+toks[i+2]); i+=3; continue; }
    if(toks[i+1]&&toks[i+1].charAt(1)==='/'){ out.push(ind+t+toks[i+1]); i+=2; continue; }
    out.push(ind+t); d++; i++;
  }
  return out.join('\n');
}
function clsOf(html){var m={},r=[];(html.match(/class="[^"]*"/g)||[]).forEach(function(c){c.slice(7,-1).split(/\s+/).forEach(function(k){if(k&&k.indexOf('ds-')!==0&&k!=='num'&&k!=='is-focus'&&!m[k]){m[k]=1;r.push('.'+k)}})});return r.join(' ')}

function mount(root,opt){
  opt=opt||{}; var flavor=opt.flavor||'web', scroller=opt.scroller||null, only=opt.only||null;
  var uid=0, state={cmp:false,fm:'both'}, SEC=sections();
  if(only) SEC=SEC.filter(function(s){return s.id===only});
  var mobile=flavor==='mobile';

  function stages(it){
    var g=[];
    function H(f){return typeof it.h==='function'?it.h(f):it.h}
    if(!mobile){
      if(it.only==='mobile') return [];
      var wantW=state.fm!=='mobile', wantM=state.fm!=='web';
      var both=!it.single&&!it.only&&!it.nm&&it.m!==false;
      if(wantW) g.push(['Web','',H('web')]);
      if(wantM&&both) g.push(['Celular (mesmas classes, sabor celular)','flv-m',H('mobile')]);
      if(!g.length) g.push(['Web','',H('web')]);
    } else {
      if(it.only==='web') return [];
      g.push(['Celular','',H('mobile')]);
    }
    return g;
  }
  function itemHtml(it){
    var g=stages(it); if(!g.length) return '';
    uid++; g=g.map(function(x){return [x[0],x[1],String(x[2]).replace(/name="ds-pg"/g,'name="ds-pg'+uid+'"')]});
    var raw=typeof it.code==='string'?it.code:pretty(g[0][2]);
    var cl=it.code?'':clsOf(g[0][2]);
    return '<article class="ds-item"><h3>'+esc(it.n)+(it.novo?'<span class="ds-tag">novo, ainda não usado nas telas</span>':'')+(it.only==='web'?'<span class="ds-tag">só web</span>':it.only==='mobile'?'<span class="ds-tag">só celular</span>':'')+'</h3>'+
     '<p class="ds-use">'+it.use+'</p><p class="ds-props">Variações: '+it.props+'</p>'+
     '<div class="ds-stages">'+g.map(function(s){return '<div class="ds-stage"><p class="ds-stage-l"'+(g.length<2&&!s[1]?' hidden':'')+'>'+s[0]+'</p><div class="'+s[1]+'">'+s[2]+'</div></div>'}).join('')+'</div>'+
     '<details class="ds-code"><summary>ver classes e HTML</summary>'+(cl?'<p class="ds-react"><b>Classes:</b> '+esc(cl)+'</p>':'')+'<p class="ds-react"><b>Futuro componente React:</b> '+esc(it.react)+'</p><pre><code>'+esc(raw)+'</code></pre><button type="button" class="btn btn--sm" data-copy>Copiar HTML</button></details></article>';
  }
  function sectionHtml(s){

    if(s.id==='celular'&&!mobile){
      body='<article class="ds-item"><h3>Peças do app do garçom</h3><p class="ds-use">O quadro abaixo é o catálogo real do celular (390 px), com as peças que só existem lá. Ele reage à bolinha como o resto.</p><div class="ds-stages"><div class="ds-stage" style="flex:0 0 auto;padding:10px"><iframe class="ds-phone" title="Catálogo do celular" style="width:390px;max-width:100%;height:720px;border:var(--border-w) solid var(--line-strong);border-radius:var(--r-card);background:var(--bg)"></iframe></div></div></article>';
    }
    if(!body) return '';
    var inner=state.cmp&&!(s.id==='celular'&&!mobile)?'<div class="ds-cmp"><div class="themebox" data-scope="light"><span class="ds-tag">Claro</span>'+body+'</div><div class="themebox" data-scope="dark"><span class="ds-tag">Escuro</span>'+mk()+'</div></div>':body;
    return '<section class="ds-sec" id="ds-'+s.id+'" aria-labelledby="ds-h-'+s.id+'"><h2 id="ds-h-'+s.id+'">'+s.t+'</h2><p>'+s.lead+'</p>'+inner+'</section>';
  }
  function render(){
    var secs=SEC.map(function(s){return [s,sectionHtml(s)]}).filter(function(x){return x[1]});
    var ctl='<div class="ds-ctl"><button type="button" class="chip" data-cmp aria-pressed="'+state.cmp+'">Comparar claro/escuro</button>'+
      (mobile?'':'<span class="lbl2">Sabor</span><div class="seg" role="group" aria-label="Sabor dos componentes">'+[['both','Web e celular'],['web','Web'],['mobile','Celular']].map(function(o){return '<button type="button" data-fm="'+o[0]+'" aria-pressed="'+(state.fm===o[0])+'">'+o[1]+'</button>'}).join('')+'</div>')+'</div>';
    var head=only?'':'<div class="ds-head"><div><h1>Componentes</h1><p>Tudo o que a interface usa, em todos os estados. É feito com as mesmas classes das telas reais e reage ao vivo à bolinha de configuração.</p></div>'+ctl+'</div>';
    var index=only?'':'<nav class="ds-index" aria-label="Neste catálogo">'+secs.map(function(x){return '<a href="#ds-'+x[0].id+'" data-ds-a="ds-'+x[0].id+'">'+x[0].t+'</a>'}).join('')+'</nav>';
    root.innerHTML='<div class="ds'+(mobile?' ds--m':'')+'">'+head+'<div class="ds-layout">'+index+'<div class="ds-main">'+secs.map(function(x){return x[1]}).join('')+'</div></div></div>';
    setupPhones(); update(); observe();
  }

  /* quadro do celular dentro do catalogo web */
  var last={cfg:null};
  function setupPhones(){
    var f=root.querySelectorAll('iframe.ds-phone');
    for(var i=0;i<f.length;i++){
      try{ f[i].srcdoc=parent.buildDoc('mobile',new URLSearchParams('screen=design-system&only=celular')); }
      catch(e){ f[i].replaceWith(document.createTextNode('Abra #m=mobile&screen=design-system para ver o catálogo do celular.')); }
    }
  }
  addEventListener('message',function(e){
    var m=e.data; if(!m||!m.flow) return;
    var phones=[].slice.call(root.querySelectorAll('iframe.ds-phone'));
    if(e.source===parent){
      if(m.flow==='cfg') last.cfg=m;
      phones.forEach(function(p){ if(p.contentWindow) p.contentWindow.postMessage(m,'*'); });
    } else if(m.flow==='ready' && phones.some(function(p){return p.contentWindow===e.source}) && last.cfg){
      e.source.postMessage(last.cfg,'*');
    }
  });

  /* valores ao vivo: cores, contraste e leituras */
  function rgb(s){var m=(s||'').match(/[\d.]+/g);return m&&m.length>=3?m.slice(0,3).map(Number):null}
  function lumi(c){var a=c.map(function(v){v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]}
  function ratio(a,b){var x=lumi(a),y=lumi(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
  function hex(c){return '#'+c.map(function(v){return Math.round(v).toString(16).padStart(2,'0')}).join('').toUpperCase()}
  var pending=0;
  function update(){
    var sws=root.querySelectorAll('.ds-sw');
    for(var i=0;i<sws.length;i++){
      var sw=sws[i],chip=sw.querySelector('.ds-sw-chip'),cs=getComputedStyle(chip),fg=rgb(cs.color),bg=rgb(cs.backgroundColor),pr=rgb(getComputedStyle(sw.querySelector('.ds-probe')).color);
      if(pr) sw.querySelector('.ds-hex').textContent=hex(pr);
      var need=+sw.dataset.need,out=sw.querySelector('.ds-ratio');
      if(fg&&bg){ var r=ratio(fg,bg),t=r.toFixed(1).replace('.',',')+':1';
        out.className='ds-ratio '+(need===0?'':(r>=need?'ds-ok':'ds-no'));
        out.textContent=need===0?t+' · só decorativo':(r>=need?'AA ok · ':'abaixo de '+String(need).replace('.',',')+':1 · ')+t; }
    }
    var ros=root.querySelectorAll('.ds-ro'),cr=getComputedStyle(document.documentElement);
    for(var j=0;j<ros.length;j++) ros[j].textContent=cr.getPropertyValue(ros[j].dataset.v).trim();
    var fam=root.querySelectorAll('.ds-fam');
    for(var k=0;k<fam.length;k++){ var v=cr.getPropertyValue(fam[k].dataset.v).trim(); fam[k].textContent=v.split(',')[0].replace(/"/g,'')+' · '+v; fam[k].style.fontFamily='var('+fam[k].dataset.v+')'; }
  }
  function schedule(){ if(pending) return; pending=requestAnimationFrame(function(){pending=0;update()}); }

  new MutationObserver(schedule).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  /* indice: secao atual */

const METHODS = ['Pix','Crédito','Débito','Dinheiro','Vale-refeição','Fiado','Voucher'];

const FIADO = [['Seu Zé (mesa fixa)','limite R$ 500,00 · em aberto R$ 120,00'],['Dona Maria','limite R$ 300,00 · em aberto R$ 0,00'],['Bruno (balcão)','limite R$ 200,00 · em aberto R$ 180,00']];

const REASONS = ['Item lançado por engano','Cliente desistiu','Item indisponível na cozinha','Erro de preparo','Outro motivo'];

/* ===== DADOS ===== */

  mk(1,'Mesa 12','open',142,'Carlos',[['Chope Pilsen 500ml',8,128],['Porção de fritas',2,120],['Picanha na chapa (2 p.)',1,96],['Água sem gás',2,80],['Chope Pilsen 500ml',6,22]]),

  mk(8,'Balcão 1','pay',73,'Marcos',[['Cerveja long neck',3,66],['Torresmo crocante',1,60]]),
  mk(9,'Mesa 15','open',12,'Rafael',[['Coca-Cola lata',3,10],['Pastel de carne (4)',1,8]]),
  mk(10,'Mesa 5','open',118,'Carlos',[['Chope Pilsen 500ml',10,112],['Porção de fritas',3,100],['Torresmo crocante',2,70],['Dose de cachaça',6,24]]),
  mk(11,'Mesa 14','open',45,'Juliana',[['Gin tônica',3,40],['Água com gás',1,40]]),
  mk(12,'Balcão 5','open',29,'Marcos',[['Chope Pilsen 300ml',4,25]]),
  mk(13,'Mesa 8','pay',88,'Rafael',[['Picanha na chapa (2 p.)',1,80],['Caipirinha de limão',2,76],['Água sem gás',2,70]]),
  mk(14,'Mesa 2','open',6,'Carlos',[['Chope Pilsen 500ml',2,5]]),
  mk(15,'Grupo Aniversário Beto','open',131,'Juliana',[['Chope Pilsen 500ml',14,120],['Porção de fritas',4,110],['Bolinho de bacalhau (6)',3,95],['Torresmo crocante',2,60],['Coca-Cola lata',4,30]]),
  mk(16,'Mesa 11','open',57,'Rafael',[['Caipirinha de limão',2,50],['Pastel de carne (4)',2,44]]),
  mk(17,'Balcão 2','open',19,'Marcos',[['Cerveja long neck',2,15]])
];
data.forEach(c=>c.items.forEach((it,i)=>{ if(!it.by) it.by=c.garcom }));
data[0].items[4].by='Rafael'; data[2].items[2].by='Carlos';
let nextId = 100;

/* ===== ESTADO ===== */
const params = () => Object.fromEntries(new URLSearchParams(window.__HASH.slice(1)));
let P = params();
if (P.empty==='1') data = [];
const S = {screen:'comandas',view:'cards',filter:'all',q:'',sort:{key:'tempo',dir:-1},sel:null,hl:new Set(),cancelIdx:null,loading:P.skel==='1',err:P.err==='1',
  listScroll:0,openerSel:null,dtab:'launch',confirmClose:false,cancelBox:false,pre:false,estorno:null,discEdit:false,otherAmt:false,moreM:false,tipOpen:false,flashUntil:0,pickCat:'fav',pickQ:'',hi:0,list:[]};
const $ = s => document.querySelector(s);
const mins = c => Math.max(0, Math.floor((now()-c.openedAt)/60000));
const total = c => c.items.filter(i=>!i.void).reduce((s,i)=>s+i.q*i.price,0);
const count = c => c.items.filter(i=>!i.void).reduce((s,i)=>s+i.q,0);
const isStale = c => c.status==='open' && mins(c) >= CONFIG.STALE_MIN;
const stKey = c => c.status==='paid' ? 'paid' : isStale(c) ? 'stale' : c.status;
const stLabel = {open:'Aberta',pay:'Aguardando pagamento',stale:'Em alerta',paid:'Paga'};
const dur = m => m>=60 ? `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}` : `${m} min`;
const hhmm = t => new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const ST_MOD = {open:'open',pay:'wait',stale:'alert',paid:'closed'};
const stHtml = c => { const k=stKey(c); return `<span class="badge badge--${ST_MOD[k]}"><i></i>${stLabel[k]}</span>`; };
const esc = s => String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const strip = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const cur = () => data.find(x=>x.id===S.sel);
const byId = id => data.find(x=>x.id===id);

const IC = {
  bolt:'<path d="M9 1.5 3.5 9H8l-1 5.5L12.5 7H8z"/>', plus:'<path d="M8 3v10M3 8h10"/>', x:'<path d="M4 4l8 8M12 4l-8 8"/>'
};
const ico = n => `<svg viewBox="0 0 16 16" aria-hidden="true">${IC[n]}</svg>`;
const live = m => { const l=$('#live'); if(!l) return; l.textContent=''; setTimeout(()=>{ l.textContent=m },30); };
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $('#toastbox').appendChild(t); setTimeout(()=>t.remove(),2600); }

/* ===== ITENS: produtos e lancamento de item (usado pelo cardapio da tela cheia) ===== */
const PM = MENU.map(([n,p,code,cat])=>({n,p,code,cat,k:strip(n)}));
const USE = {}; data.forEach(c=>c.items.forEach(i=>{ USE[i.n]=(USE[i.n]||0)+i.q; }));
const codeOf = n => (PM.find(x=>x.n===n)||{}).code||'';
const favs = () => [...PM].sort((a,b)=>(USE[b.n]||0)-(USE[a.n]||0)).slice(0,8);
function launchItem(c,prod,qty,by){
  by = by||PF().nick;
  let it = c.items.find(i=>i.n===prod.n&&!i.void&&i.by===by&&hhmm(i.at)===hhmm(now()));
  if(it) it.q += qty; else { it = {n:prod.n,q:qty,price:prod.p,by,at:now()}; c.items.push(it); }
  USE[prod.n] = (USE[prod.n]||0)+qty;
  return {q:qty,n:prod.n,item:it};
}
function refreshAfter(cid){
  renderSummary(); renderList(); renderDlg();
  flash(document.querySelector(`.cm[data-id="${cid}"]`));
}

/* nova comanda: prompt pequeno ("7" vira Mesa 7; reabre a mesa se ja existir) */
function normIdent(t){
  t = t.trim().replace(/\s+/g,' '); if(!t) return '';
  if(/^\d{1,3}$/.test(t)) return 'Mesa '+t;
  const m = t.match(/^(mesa|balc[aã]o)\s*(\d{1,3})$/i);
  if(m) return (strip(m[1])==='mesa'?'Mesa':'Balcão')+' '+m[2];
  return t[0].toUpperCase()+t.slice(1);
}
function findComanda(txt){
  const t = strip(normIdent(txt)); if(!t) return null;
  const act = vis().filter(x=>x.status!=='paid');
  return act.find(x=>strip(x.ident)===t) || (()=>{ const l = act.filter(x=>strip(x.ident).includes(strip(txt.trim()))); return l.length===1?l[0]:null; })();
}
function ensureComanda(txt){
  const ident = normIdent(txt); if(!ident) return null;
  let c = findComanda(txt); if(c) return {c,created:false};
  c = {id:nextId++,ident,status:'open',openedAt:now(),garcom:PF().nick,items:[]}; data.unshift(c);
  S.sort = {key:'abertura',dir:-1}; S.filter = 'all'; S.q = ''; $('#q').value = '';
  return {c,created:true};
}
function openNp(){
  if(!can('comanda:criar')){ toast('Seu perfil não abre comandas'); return; }
  if(S.sel){ if(!tryClose()) return; }
  const f = $('#qp'); f.hidden = false; $('#qpb').setAttribute('aria-expanded','true'); const i = $('#qp-in'); i.value = ''; npHint(); i.focus();
}
function closeNp(refocus){ const f = $('#qp'); if(f.hidden) return; f.hidden = true; $('#qpb').setAttribute('aria-expanded','false'); if(refocus) $('#qpb').focus(); }
function npHint(){
  const v = $('#qp-in').value, id = normIdent(v), h = $('#qp-h');
  h.textContent = !id ? 'Digite o número da mesa ou um nome. Enter cria ou abre.' : findComanda(v) ? `${findComanda(v).ident} já está aberta. Enter abre.` : `Enter cria ${id}.`;
}
function npSubmit(){
  const v = $('#qp-in').value; if(!normIdent(v)){ $('#qp-in').focus(); return; }
  const r = ensureComanda(v); closeNp(false);
  renderAll(); select(r.c.id);
  live(r.created ? `${r.c.ident} criada` : `${r.c.ident} já estava aberta`);
}

/* ===== CONTA: resumo, desconto, servico, divisao, formas de pagamento, estorno, pre-conta ===== */
const cents = x => Math.round(x*100);
const fromC = c => c/100;
function parseMoney(s){ s = String(s).replace(/[^\d,.]/g,''); if(s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const n = parseFloat(s); return isFinite(n)?n:NaN; }
const itemC = it => cents(it.q*it.price);
function billOf(c){
  const live = c.items.filter(i=>!i.void), subC = live.reduce((s,i)=>s+itemC(i),0);
  let discC = 0; if(c.disc && c.disc.v>0) discC = c.disc.t==='pct' ? Math.round(subC*Math.min(100,c.disc.v)/100) : Math.min(subC,cents(c.disc.v));
  const baseC = subC-discC, on = c.svc!==false, svcC = on ? Math.round(baseC*(CONFIG.SERVICE_PCT||0)/100) : 0, totC = baseC+svcC;
  const paidC = (c.pays||[]).reduce((s,p)=>s+cents(p.v),0), restC = Math.max(0,totC-paidC), mode = c.mode||'none';
  let defC = restC;
  if(mode==='equal'){ const n = Math.max(2,c.split||2), left = Math.max(1,n-(c.parts||0)); defC = left<=1 ? restC : Math.round(restC/left); }
  if(mode==='pct'){ const p = parseFloat(String(c.pctIn||'').replace(',','.')); defC = p>0 ? Math.round(totC*Math.min(100,p)/100) : restC; }
  const selI = (c.sel||[]).filter(i=>c.items[i] && !c.items[i].void && !c.items[i].paidBy);
  if(mode==='item'){
    const left = c.items.map((it,i)=>i).filter(i=>!c.items[i].void && !c.items[i].paidBy);
    const selC = selI.reduce((s,i)=>s+itemC(c.items[i]),0);
    defC = !selI.length ? 0 : selI.length===left.length ? restC : Math.round(selC*(subC?totC/subC:1));
  }
  const cu = (c.amt!=null && c.amt!=='') ? cents(parseMoney(c.amt)) : NaN, custom = isFinite(cu) && cu>0;
  const dueC = !restC ? 0 : Math.min(restC, custom ? cu : defC);
  return {subC,discC,svcC,totC,paidC,restC,defC,dueC,on,custom,mode,selI,n:Math.max(2,c.split||2)};
}
const payLabel = p => `${p.m}${p.parc>1?` ${p.parc}x`:''}${p.cli?` · ${p.cli}`:''}`;
const MIC = {
  'Pix':'<path d="M8 1.8 14.2 8 8 14.2 1.8 8z"/>',
  'Crédito':'<rect x="1.8" y="3.5" width="12.4" height="9" rx="2"/><path d="M1.8 6.8h12.4"/>',
  'Débito':'<rect x="1.8" y="3.5" width="12.4" height="9" rx="2"/><path d="M4.2 10.2h3"/>',
  'Dinheiro':'<rect x="1.8" y="4.5" width="12.4" height="7" rx="1.5"/><circle cx="8" cy="8" r="1.7"/>',
  'Vale-refeição':'<path d="M3 2.5h10v11H3zM5.8 6h4.4M5.8 9h4.4"/>',
  'Fiado':'<path d="M3.8 2.5h8.4v11l-2.1-1.6L8 13.5l-2.1-1.6-2.1 1.6z"/>',
  'Voucher':'<path d="M1.8 4.5h12.4v2.3a1.7 1.7 0 0 0 0 3.4v2.3H1.8v-2.3a1.7 1.7 0 0 0 0-3.4z"/>'
};
const micon = n => `<svg viewBox="0 0 16 16" aria-hidden="true">${MIC[n]||''}</svg>`;
const MAIN_M = ['Pix','Crédito','Débito','Dinheiro'], MORE_M = ['Vale-refeição','Fiado','Voucher'];
function billLeftHtml(c){
  const b = billOf(c), closed = c.status==='paid', mode = b.mode;
  const rows = c.items.map((it,i)=>it.void?'':`<div class="cup__r ${it.paidBy?'is-paid':''}"><span class="cup__q num">${it.q}×</span><span class="cup__n">${mode==='item'&&!it.paidBy&&!closed?`<label class="check"><input type="checkbox" data-pickitem="${i}" ${(c.sel||[]).includes(i)?'checked':''}><span>${esc(it.n)}</span></label>`:esc(it.n)}${it.paidBy?` <span class="tagpaid">pago · ${esc(it.paidBy)}</span>`:''}</span><i class="cup__d" aria-hidden="true"></i><span class="cup__v num">${brl(it.q*it.price)}</span></div>`).join('') || '<p class="bhelp">Nenhum item na comanda.</p>';
  const R = (l,v,cls) => `<div class="cup__r ${cls||''}"><span class="cup__n">${l}</span><i class="cup__d" aria-hidden="true"></i><span class="cup__v num">${v}</span></div>`;
  const discRow = (closed || !can('comanda:desconto')) ? (b.discC ? R('Desconto','− '+brl(fromC(b.discC))) : '')
    : S.discEdit
      ? `<div class="cup__edit"><span class="cup__n">Desconto</span><span class="seg" role="group" aria-label="Tipo do desconto"><button type="button" data-dt="pct" aria-pressed="${(c.dT||'pct')==='pct'}">%</button><button type="button" data-dt="val" aria-pressed="${c.dT==='val'}">R$</button></span><input id="b-disc" class="field bfield" inputmode="decimal" autocomplete="off" placeholder="${(c.dT||'pct')==='pct'?'ex.: 10':'ex.: 15,00'}" value="${esc(c.dIn||'')}" aria-label="Valor do desconto"><button class="btn btn--sm btn--primary" type="button" data-disc>Aplicar</button><button class="lnk" type="button" data-disc-x>${c.disc?'Remover':'Cancelar'}</button></div><p class="bhelp">Seu limite: até ${discLimit()}% da comanda. Fica registrado.</p>${c.dWarn?`<p class="bhelp bhelp--bad" role="alert">${esc(c.dWarn)}</p>`:''}`
      : c.disc ? `<div class="cup__r"><span class="cup__n">Desconto ${c.disc.t==='pct'?c.disc.v+'%':''} <button class="lnk" type="button" data-disc-edit>alterar</button></span><i class="cup__d" aria-hidden="true"></i><span class="cup__v num">− ${brl(fromC(b.discC))}</span></div>`
      : `<div class="cup__r"><span class="cup__n">Desconto</span><i class="cup__d" aria-hidden="true"></i><button class="lnk" type="button" data-disc-edit>+ adicionar</button></div>`;
  const svcRow = closed ? R(`Serviço ${b.on?CONFIG.SERVICE_PCT+'%':'(retirado)'}`,brl(fromC(b.svcC)))
    : `<div class="cup__r"><span class="cup__n"><label class="check"><input type="checkbox" data-svc ${b.on?'checked':''} ${can('comanda:remover_taxa_servico')?'':'disabled title="Sem permissão para remover a taxa de serviço"'}><span>Serviço ${CONFIG.SERVICE_PCT}%</span></label></span><i class="cup__d" aria-hidden="true"></i><span class="cup__v num">${brl(fromC(b.svcC))}</span></div>`;
  const pays = (c.pays||[]).length ? `<div class="cup__pays"><p class="cup__h">Já recebido</p>${c.pays.map((p,i)=>`<div class="cup__p"><span class="cup__ok" aria-hidden="true">✓</span><span class="cup__n"><b>${esc(payLabel(p))}</b>${p.who?` · ${esc(p.who)}`:''}${p.tip?` · gorjeta ${brl(p.tip)}`:''}${p.troco?` · troco ${brl(p.troco)}`:''}</span><span class="cup__v num">${brl(p.v)}</span>${(closed||!can('comanda:estornar_pagamento'))?'':S.estorno===i
      ? `<span class="cup__est"><label class="sr" for="b-mot">Motivo do estorno</label><select id="b-mot" class="field"><option value="">Motivo (obrigatório)</option>${REASONS.map(r=>`<option>${r}</option>`).join('')}</select><button class="btn btn--sm btn--danger" type="button" data-est-ok="${i}">Estornar</button><button class="lnk" type="button" data-est-x>Voltar</button></span>`
      : `<button class="lnk" type="button" data-est="${i}" aria-label="Estornar ${esc(payLabel(p))} ${brl(p.v)}">estornar</button>`}</div>`).join('')}</div>` : '';
  return `${cancelBoxHtml(c)}<p class="cup__h">A conta</p><div class="cup">${rows}</div>
    <div class="cup cup--sum">${R('Consumo',brl(fromC(b.subC)))}${discRow}${svcRow}<div class="cup__r cup__t"><span class="cup__n">Total</span><i class="cup__d" aria-hidden="true"></i><span class="cup__v num">${brl(fromC(b.totC))}</span></div></div>${pays}`;
}
function billRightHtml(c){
  const b = billOf(c), closed = c.status==='paid', mode = b.mode, m = c.method||'Pix', quit = !b.restC && b.totC>0;
  const band = `<div class="bband" data-ok="${closed||quit}"><span>${closed?'Comanda paga':quit?'Conta quitada':'Falta receber'}</span><b class="num">${brl(fromC(closed?b.totC:b.restC))}</b></div>`;
  if(closed) return band+`<p class="bhelp" style="margin-top:14px">Esta comanda está fechada. Você pode imprimir o comprovante.</p>`;
  if(quit) return band+`<p class="bhelp bhelp--ok" style="margin-top:14px">Tudo recebido. Imprima o comprovante, se precisar, e feche a comanda.</p>`;
  if(!can('comanda:receber_pagamento')) return band+`<div class="bnote">${can('comanda:lancar_item')||can('comanda:fechar')?'<b>Quem recebe é o caixa.</b><span>Imprima a pré-conta e mande a conta ao caixa para o cliente pagar. Seu perfil não recebe pagamentos.</span>':'<b>Somente consulta.</b><span>Seu perfil vê a conta, mas não altera nem recebe pagamentos.</span>'}</div>`;
  const dividing = mode!=='none';
  const sub = {
    equal:`<div class="bmode"><span class="bl">Quantas pessoas?</span><span class="stepper stepper--sm" role="group" aria-label="Pessoas"><button type="button" data-n="-1" aria-label="Menos uma pessoa">−</button><b class="num" aria-live="polite">${b.n}</b><button type="button" data-n="1" aria-label="Mais uma pessoa">+</button></span></div><p class="bhelp">Parte ${Math.min(b.n,(c.parts||0)+1)} de ${b.n} · ${brl(fromC(b.defC))} cada.</p>`,
    item:`<p class="bhelp">Marque na conta, à esquerda, os itens desta pessoa.${b.selI.length?` Selecionados: <b>${b.selI.length}</b>.`:''}</p>`,
    pct:`<div class="bmode"><label class="bl" for="b-pct">% desta pessoa</label><input id="b-pct" class="field bfield" inputmode="decimal" autocomplete="off" placeholder="ex.: 30" value="${esc(c.pctIn||'')}"></div>`,
    diff:`<p class="bhelp">Digite abaixo o valor de cada pessoa. Repita até zerar.</p>`
  }[mode]||'';
  const showWho = mode==='item' || mode==='diff' || S.otherAmt;
  const extras = {
    'Crédito':`<div class="bmode"><label class="bl" for="b-parc">Parcelas</label><select id="b-parc" class="field bfield">${[1,2,3,4,5,6,10,12].map(n=>`<option value="${n}" ${(c.parc||1)==n?'selected':''}>${n}x${n>1?' · '+brl(fromC(b.dueC)/n):''}</option>`).join('')}</select></div>`,
    'Dinheiro':`<div class="bmode"><label class="bl" for="b-recv">Valor recebido</label><input id="b-recv" class="field bfield" inputmode="decimal" autocomplete="off" placeholder="${brlNum(fromC(b.dueC))}" value="${esc(c.recv||'')}"><span class="bhelp" style="margin:0">${(()=>{const r=parseMoney(c.recv||''); return isFinite(r)&&cents(r)>=b.dueC ? `Troco <b>${brl(r-fromC(b.dueC))}</b>` : 'informe o valor entregue'})()}</span></div>`,
    'Fiado':`<div class="bmode"><label class="bl" for="b-cli">Cliente</label><select id="b-cli" class="field bfield"><option value="">Escolha o cliente</option>${FIADO.map(([n])=>`<option ${c.cli===n?'selected':''}>${n}</option>`).join('')}</select></div><p class="bhelp">${c.cli?esc(FIADO.find(f=>f[0]===c.cli)[1])+'. O fiado fica na conta do cliente.':'Fiado exige identificar o cliente.'}</p>`,
    'Voucher':`<div class="bmode"><label class="bl" for="b-vch">Código</label><input id="b-vch" class="field bfield" autocomplete="off" placeholder="ex.: VCH-2041" value="${esc(c.vch||'')}"></div>`
  }[m]||'';
  const moreOpen = S.moreM || MORE_M.includes(m);
  const tile = x => `<button class="mtile" type="button" data-method="${x}" aria-pressed="${m===x}">${micon(x)}<span>${x}</span></button>`;
  return `${band}
   <section class="step"><h3><span class="step__n">1</span>Quem paga</h3>
     <div class="bchoose" role="group" aria-label="Quem paga"><button class="bbig" type="button" data-splitgo="none" aria-pressed="${!dividing}">Tudo</button>${can('comanda:dividir')?`<button class="bbig" type="button" data-splitgo="on" aria-pressed="${dividing}">Dividir</button>`:''}</div>
     ${dividing?`<div class="bmodes" role="group" aria-label="Como dividir">${SPLITS.filter(x=>x[0]!=='none').map(([k,l])=>`<button class="chip" type="button" data-mode="${k}" aria-pressed="${mode===k}">${l}</button>`).join('')}</div>${sub}`:''}
     ${showWho?`<div class="bmode"><label class="bl" for="b-who">Nome</label><input id="b-who" class="field bfield" autocomplete="off" placeholder="opcional" value="${esc(c.who||'')}"></div>`:''}
     ${S.otherAmt||mode==='diff'?`<div class="bmode"><label class="bl" for="b-amt">Valor</label><input id="b-amt" class="field bfield bfield--amt" inputmode="decimal" autocomplete="off" value="${b.custom?esc(c.amt):''}" placeholder="${brlNum(fromC(b.dueC))}"><span class="bhelp" style="margin:0">restará ${brl(fromC(Math.max(0,b.restC-b.dueC)))}</span></div>`:`<button class="lnk" type="button" data-other>Receber outro valor</button>`}
   </section>
   <section class="step"><h3><span class="step__n">2</span>Como paga</h3>
     <div class="mgrid" role="group" aria-label="Forma de pagamento">${MAIN_M.map(tile).join('')}${moreOpen?MORE_M.map(tile).join(''):`<button class="mtile mtile--more" type="button" data-more><span>Mais</span><span aria-hidden="true">▾</span></button>`}</div>
     ${extras}
     ${S.tipOpen?`<div class="bmode"><label class="bl" for="b-tip">Gorjeta</label><input id="b-tip" class="field bfield" inputmode="decimal" autocomplete="off" placeholder="R$" value="${esc(c.tip||'')}"></div>`:`<button class="lnk" type="button" data-tipopen>+ adicionar gorjeta</button>`}
   </section>
   <section class="step"><h3><span class="step__n">3</span>Receber</h3>
     <button class="btn btn--primary btn--rcv" type="button" data-receive ${b.dueC?'':'disabled'}>Receber ${brl(fromC(b.dueC))} em ${esc(m)}${c.who?` · ${esc(c.who)}`:''}</button>
     ${b.dueC&&b.restC>b.dueC?`<p class="bhelp" style="text-align:center">Depois disso faltam ${brl(fromC(b.restC-b.dueC))}.</p>`:''}
   </section>`;
}
function billFootHtml(c){
  const b = billOf(c), closed = c.status==='paid', ok = !b.restC && b.totC>0;
  return `${can('comanda:reimprimir')?`<button class="btn" type="button" data-pre>${closed?'Imprimir comprovante':'Imprimir pré-conta'}</button>`:''}${(closed||!(can('comanda:lancar_item')||can('comanda:fechar')))?'':`<button class="btn" type="button" data-tocaixa>Mandar ao caixa</button>`}<span class="dlg__foot__s"></span>${(closed||!can('comanda:fechar'))?'':`${ok?'':`<span class="bhelp" style="margin:0">Falta ${brl(fromC(b.restC))} para fechar</span>`}<button class="btn btn--primary btn--lg" type="button" data-close-comanda ${ok?'':'disabled'}>Fechar comanda</button>`}`;
}
function cancelBoxHtml(c){
  if(!S.cancelBox) return '';
  if((c.pays||[]).length) return `<div class="cwarn" role="alert"><b>Há pagamentos recebidos nesta comanda.</b><span>Estorne os pagamentos antes de cancelar a comanda inteira.</span><div><button class="btn btn--sm" type="button" data-cancelc-x>Voltar</button></div></div>`;
  return `<div class="cwarn" role="alert"><b>Cancelar a comanda inteira?</b><span>Motivo obrigatório. Fica no histórico e o gerente é avisado.</span><label class="sr" for="b-cmot">Motivo do cancelamento</label><select id="b-cmot" class="field"><option value="">Selecione um motivo</option>${REASONS.map(r=>`<option>${r}</option>`).join('')}</select><div><button class="btn btn--sm btn--danger" type="button" data-cancelc-ok>Cancelar comanda</button><button class="btn btn--sm btn--ghost" type="button" data-cancelc-x>Voltar</button></div></div>`;
}
function preHtml(c){
  const b = billOf(c), live = c.items.filter(i=>!i.void), closed = c.status==='paid', t = new Date();
  const pad = (a,z) => `<span>${a}</span><span>${z}</span>`;
  return `<div class="pre__bg" data-pre-bg><div class="pre" role="dialog" aria-label="${closed?'Comprovante':'Pré-conta'}">
    <p class="pre__h">Bar do Zé<br>Unidade Centro</p><p class="pre__c">${closed?'COMPROVANTE':'PRÉ-CONTA'} · ${esc(c.ident)}<br>${t.toLocaleDateString('pt-BR')} ${t.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · Garçom ${esc(c.garcom)}</p><hr>
    ${live.map(i=>`<div class="pre__r">${pad(`${i.q}× ${esc(i.n)}`,brl(i.q*i.price))}</div>`).join('')}<hr>
    <div class="pre__r">${pad('Consumo',brl(fromC(b.subC)))}</div>
    ${b.discC?`<div class="pre__r">${pad('Desconto','− '+brl(fromC(b.discC)))}</div>`:''}
    <div class="pre__r">${pad('Serviço '+(b.on?CONFIG.SERVICE_PCT+'%':'(retirado)'),brl(fromC(b.svcC)))}</div>
    <div class="pre__r pre__t">${pad('TOTAL',brl(fromC(b.totC)))}</div>
    ${(c.pays||[]).map(p=>`<div class="pre__r">${pad(esc(payLabel(p)),brl(p.v))}</div>`).join('')}
    ${b.paidC?`<div class="pre__r pre__t">${pad(b.restC?'FALTA':'QUITADO',brl(fromC(b.restC)))}</div>`:''}
    <p class="pre__n">Documento sem valor fiscal.</p>
    <div class="pre__a"><button class="btn btn--primary" type="button" data-pre-print>Imprimir</button><button class="btn" type="button" data-pre-x>Fechar</button></div></div></div>`;
}
function keepFocus(fn){
  const d = $('#dlg'), ae = document.activeElement, id = ae && ae.id && d.contains(ae) ? ae.id : null;
  const s0 = ae && ae.selectionStart, s1 = ae && ae.selectionEnd; fn();
  if(id){ const n = document.getElementById(id); if(n){ n.focus({preventScroll:true}); try{ if(s0!=null && n.setSelectionRange) n.setSelectionRange(s0,s1); }catch(_){} } }
}
function refreshBill(force){
  const c = cur(); if(!c) return;
  keepFocus(()=>{ const L = $('#dlg-items'), R = $('#dlg-bill'), F = $('#dlg-foot'); if(L) L.innerHTML = billLeftHtml(c); if(R) R.innerHTML = billRightHtml(c); if(F) F.innerHTML = billFootHtml(c); });
}
function receive(){
  const c = cur(); if(!c||c.status==='paid'||!can('comanda:receber_pagamento')) return;
  if(pendCount(c)){ toast('Envie ou descarte os itens para enviar antes de receber'); return; }
  const b = billOf(c); if(!b.restC) return;
  if(!b.dueC){ toast(b.mode==='item' ? 'Marque os itens que serão pagos' : 'Nada a receber'); return; }
  const m = c.method||'Pix';
  if(m==='Fiado' && !c.cli){ toast('Escolha o cliente do fiado'); $('#b-cli')?.focus(); return; }
  let troco = 0;
  if(m==='Dinheiro' && c.recv){ const r = parseMoney(c.recv); if(isFinite(r)){ if(cents(r)<b.dueC){ toast('O valor recebido é menor que o valor a receber'); $('#b-recv')?.focus(); return; } troco = r-fromC(b.dueC); } }
  const tip = parseMoney(c.tip||''), who = (c.who||'').trim();
  c.pays = c.pays||[];
  const rec = {m,v:fromC(b.dueC),who,tip:isFinite(tip)&&tip>0?tip:0,parc:m==='Crédito'?(c.parc||1):0,troco,cli:m==='Fiado'?c.cli:''};
  if(b.mode==='item'){ const nm = who || `Pessoa ${c.pays.length+1}`; b.selI.forEach(i=>{ c.items[i].paidBy = nm; }); rec.itens = b.selI.slice(); c.sel = []; }
  if(b.mode==='equal' && b.dueC >= b.defC-1){ c.parts = (c.parts||0)+1; rec.part = true; }
  c.pays.push(rec); c.amt = null; c.who = ''; c.tip = ''; c.recv = ''; c.pctIn = ''; c.vch = ''; S.otherAmt = false; S.tipOpen = false;
  const left = b.restC-b.dueC;
  toast(left ? `${m}: ${brl(fromC(b.dueC))} recebido. Falta ${brl(fromC(left))}` : 'Conta quitada. Imprima o comprovante e feche a comanda.'); live(left?'Pagamento recebido':'Conta quitada');
  refreshBill(true); renderSummary();
  if(!left) $('[data-close-comanda]')?.focus();
}
function closeBill(){
  const c = cur(); if(!c||!can('comanda:fechar')) return; const b = billOf(c);
  if(b.restC || !b.totC) return;
  c.status = 'paid'; c.paidAt = now(); c.pend = [];
  toast(`${c.ident} paga e fechada: ${brl(fromC(b.totC))}`); live(`${c.ident} fechada`); closeComanda(); renderAll();
}
function applyDisc(){
  if(!can('comanda:desconto')) return;
  const c = cur(), v = parseMoney(c.dIn||''), t = c.dT||'pct';
  if(!(v>0)){ c.disc = null; c.dWarn = ''; c.amt = null; S.discEdit = false; refreshBill(true); return; }
  const sub = total(c) || 1, pct = t==='pct' ? v : v/sub*100;
  if(pct>discLimit()){ c.dWarn = `Acima do seu limite de ${discLimit()}%. Peça aprovação de um gerente.`; }
  else { c.disc = {t,v}; c.dWarn = ''; c.amt = null; c.dIn = ''; S.discEdit = false; }
  refreshBill(true);
}

/* ===== RENDER ===== */
function navCount(id){ return id==='comandas' ? vis().filter(c=>c.status!=='paid').length : (COUNTS[id]||0); }
function renderNav(){
  const groups = SCREENS.filter(x=>x.app==='web' && x.kind==='group');
  $('#nav').innerHTML = groups.map(g=>{ const kids = SCREENS.filter(x=>x.parent===g.id && x.nav!==false && okScreen(x)); if(!kids.length) return ''; return `<div class="nav-label">${g.title}</div>`+kids.map(x=>
    `<a href="${x.path}" data-screen="${x.id}" ${x.id===S.screen?'aria-current="page"':''}><span class="ico"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="${x.icon}"/></svg></span><span class="t">${x.title}</span><span class="count num" data-count="${x.id}">${navCount(x.id)||''}</span></a>`).join(''); }).join('');
  document.querySelectorAll('#nav a').forEach(a=>{
    a.addEventListener('mouseenter',()=>tipShow(a,false));
    a.addEventListener('mouseleave',()=>{ if(tipPinned!==a) tipHide(); });
    a.addEventListener('focus',()=>tipShow(a,false));
    a.addEventListener('blur',tipHide);
  });
}
function ensureAllowed(){
  const sc = SC[S.screen]; if(sc && okScreen(sc)) return;
  const first = SCREENS.filter(x=>x.app==='web' && x.kind!=='group' && x.nav!==false && okScreen(x));
  S.screen = (SC[PF().landing] && okScreen(SC[PF().landing])) ? PF().landing : (first[0] ? first[0].id : 'comandas');
}
function applyUser(){
  const u = document.querySelector('.user'); if(!u) return;
  u.querySelector('.avatar').textContent = PF().initials; u.querySelector('.tx b').textContent = PF().user; u.querySelector('.tx span').textContent = PF().name;
}
function applyPerms(){
  const ok = can('comanda:criar');
  $('#nova').style.display = ok ? '' : 'none'; $('#qpb').style.display = ok ? '' : 'none';
  if(!ok) closeNp(false);
}
function updateCounts(){ document.querySelectorAll('#nav [data-count]').forEach(e=>{ const n=navCount(e.dataset.count); e.textContent=n||''; }); }

/* ===== NAVEGACAO: telas, migalhas, menu recolhivel ===== */
function crumbHtml(){
  const sel = S.screen==='comandas' && S.sel ? byId(S.sel) : null;
  const list = sel ? flowCrumbs('comanda-detalhe', sel.ident) : flowCrumbs(S.screen);
  $('#crumbs ol').innerHTML = list.map((c,i)=> i===list.length-1
    ? `<li aria-current="page">${esc(c.title)}</li>`
    : `<li><a href="${c.path}" data-go="${c.redirect||c.id}">${esc(c.title)}</a></li>`).join('');
}
let lastRoute='';
function renderCrumbs(){
  crumbHtml();
  const open = S.screen==='comandas' && S.sel ? S.sel : null, r = S.screen+'|'+open;
  if(r!==lastRoute){ lastRoute=r; try{ parent.postMessage({flow:'route',screen:S.screen,open:open},'*'); }catch(_){} }
}
function renderScreen(){
  const com = S.screen==='comandas', ds = S.screen==='design-system', sc = SC[S.screen];
  $('#v-com').hidden = !com; $('#v-ds').hidden = !ds; $('#v-ph').hidden = com||ds;
  if(ds && !$('#v-ds').dataset.on){ $('#v-ds').dataset.on='1'; FlowDS.mount($('#v-ds'),{flavor:'web'}); }
  if(!com&&!ds) $('#v-ph').innerHTML = `<h1>${esc(sc.title)}</h1><div class="empty"><h3>Tela de exemplo, ainda não prototipada</h3><p>Aqui ficará ${esc(sc.title)}. O protótipo cobre só Comandas por enquanto.</p><a class="btn btn--primary" href="${SC.comandas.path}" data-go="comandas">Voltar para Comandas</a></div>`;
  document.querySelectorAll('#nav a').forEach(a=>{ if(a.dataset.screen===S.screen) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  renderCrumbs();
}
function go(id){
  id = (SC[id]&&SC[id].redirect) || id; if(!SC[id] || !okScreen(SC[id])) return;
  if(S.sel){ S.sel=null; S.cancelIdx=null; }
  const same = S.screen===id; S.screen = id; renderScreen(); renderDlg(); if(same||id==='comandas') renderList();
  $('#content').scrollTop = 0;
}

/* menu lateral: expandido ou trilho de icones */
let tipPinned=null;
function isRail(){ return document.body.classList.contains('rail'); }
function setRail(on, persist){
  document.body.classList.toggle('rail', on); tipHide();
  const b=$('#sbtn'); b.setAttribute('aria-expanded', String(!on)); b.setAttribute('aria-label', on?'Expandir menu lateral':'Recolher menu lateral');
  if(persist){ try{ localStorage.setItem('flow.sidebar', on?'rail':'full'); }catch(_){} }
}
function tipShow(a,pin){
  if(!isRail()) return; const t=$('#rtip'), n=a.querySelector('.count').textContent.trim();
  if(pin) tipPinned=a;

function filtered(){

  if(q) l=l.filter(c=>(c.ident+' '+c.garcom+' '+c.items.map(i=>i.n).join(' ')).toLowerCase().includes(q));
  const k=S.sort.key,d=S.sort.dir;

function parseLine(s){
  s = String(s||'').trim(); let m;
  if((m=s.match(/^(\d{1,3})\s*[x×](?=\s|$)\s*(.*)$/i)) || (m=s.match(/^(\d{1,3})\s+(.+)$/))) return {qty:Math.max(1,+m[1]),term:m[2].trim(),hasQty:true};
  return {qty:1,term:s,hasQty:false};
}
function findProducts(term){
  const t = strip(term).trim(); if(!t) return null;
  if(/^\d+$/.test(t)) return PM.filter(p=>String(p.code).startsWith(t)).sort((a,b)=>((String(b.code)===t)-(String(a.code)===t))||(a.code-b.code));
  const ws = t.split(/\s+/);
  return PM.filter(p=>ws.every(w=>p.k.includes(w))).sort((a,b)=>(USE[b.n]||0)-(USE[a.n]||0));
}
const pendOf = c => c.pend || (c.pend = []);

const pendTotal = c => pendOf(c).reduce((s,p)=>s+p.q*p.p,0);
function pendAdd(c,p,qty){ const l = pendOf(c), x = l.find(i=>i.n===p.n); if(x) x.q += qty; else l.push({n:p.n,p:p.p,q:qty}); }
function sendPend(c){
  const l = pendOf(c); if(!l.length) return;
  const n = pendCount(c);
  c.items.forEach(i=>{ delete i.fresh; });
  l.forEach(p=>{ launchItem(c,PM.find(x=>x.n===p.n),p.q).item.fresh = true; });
  c.pend = []; S.confirmClose = false; S.flashUntil = Date.now()+1600;
  toast(`Enviado: ${n} ${n===1?'item':'itens'} para ${c.ident}`); live(`${n} ${n===1?'item enviado':'itens enviados'} para ${c.ident}`);
  refreshAfter(c.id); $('#dq')?.focus();
}

document.addEventListener('click',e=>{
  const t=e.target;
  let el;
  if(tipPinned && !t.closest('#nav a')) tipHide();
  if(!$('#qp').hidden && !t.closest('#qp,#qpb,#nova')) closeNp(false);
  if((el=t.closest('#nav a[data-screen]'))){ e.preventDefault(); go(el.dataset.screen); if(isRail()) tipShow(el,true); return; }
  if((el=t.closest('[data-go]'))){ e.preventDefault(); go(el.dataset.go); return; }
  if(t.closest('#sbtn')){ setRail(!isRail(),true); return; }
  if(!t.closest('.menu')&&!t.closest('[data-menu]')) closeMenu();
  if((el=t.closest('[data-view]'))){ S.view=el.dataset.view; document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b===el)); renderList(); return; }
  if((el=t.closest('[data-f]'))){ S.filter=el.dataset.f; renderChips(); renderList(); return; }
  if((el=t.closest('[data-sort]'))){ const k=el.dataset.sort; S.sort=S.sort.key===k?{key:k,dir:-S.sort.dir}:{key:k,dir:1}; renderList(); document.querySelector(`[data-sort="${k}"]`).focus(); return; }
  if((el=t.closest('[data-menu]'))){ e.stopPropagation(); openMenu(el); return; }
  if((el=t.closest('.menu button'))){ const a=el.dataset.m, id=+el.closest('.menu').dataset.id; closeMenu(); const c=byId(id);
    if(a==='abrir') select(id); else if(a==='fechar'){ c.status='pay'; renderAll(); toast(`${c.ident} aguardando pagamento`);} else toast('Protótipo: ação não simulada'); return; }
  if((el=t.closest('[data-closebill]'))){ select(+el.dataset.closebill, el.closest('.cm').querySelector('.cm__name'), {focus:'bill'}); return; }
  if(t.closest('[data-back]')){ tryClose(); return; }
  if(t === $('#dlg')){ tryClose(); return; }
  if((el=t.closest('[data-dtab]'))){ if(el.dataset.dtab==='bill' && pendCount(cur())){ toast('Envie ou descarte os itens para enviar antes de fechar a conta'); return; } S.dtab = el.dataset.dtab; renderDlg(); if(S.dtab==='bill') setTimeout(()=>{ document.querySelector('[data-receive]:not(:disabled)')?.focus(); },0); else $('#dq')?.focus(); return; }
  if(t.closest('[data-receive]')){ receive(); return; }

function tick(){
  if(S.loading||S.err||!data.length) return;
  $('#clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const act=data.filter(c=>c.status==='open'); if(!act.length) return;

  const m=MENU[Math.floor(Math.random()*MENU.length)];

  if(ex&&Math.random()<.6) ex.q++; else c.items.push({n:m[0],q:1,price:m[1],by:c.garcom,at:now()});
