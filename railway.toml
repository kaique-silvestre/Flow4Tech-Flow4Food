# Railway config-as-code for the API service (one service per environment: staging, production).
# Variables are set in Railway per environment; no value lives here. See docs/runbooks/deploy.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs once per deploy, before the new version receives traffic, with the OWNER credential (MIGRATION_DATABASE_URL).
# Applies backend/migrations, gives the app role its login and fails the deploy if the application credential is not restricted.
# UNVERIFIED (ticket 11 P8): whether Railway wants a string or an array here, whether it runs through a shell, and whether the
# pre-deploy container sees the private network and the service variables. Confirm on the first real deploy and adjust.
preDeployCommand = ["dotnet Flow4Tech.Migrator.dll"]
healthcheckPath = "/health/ready"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
