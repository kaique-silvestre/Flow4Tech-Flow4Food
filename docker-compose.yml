# Local dev with the SAME two-credential model as staging/production:
#   - migrate runs as the owner (flow4tech), applies backend/migrations and gives the app role its login;
#   - api runs as the restricted flow4tech_app role (no superuser, no BYPASSRLS, no DDL), so RLS is enforced locally too.
# The passwords below are throwaway local-dev values for this compose file only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flow4tech
      POSTGRES_PASSWORD: flow4tech
      POSTGRES_DB: flow4tech
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow4tech -d flow4tech"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    build: .
    entrypoint: ["dotnet", "Flow4Tech.Migrator.dll"]
    environment:
      MIGRATION_DATABASE_URL: postgres://flow4tech:flow4tech@db:5432/flow4tech
      APP_DB_PASSWORD: flow4tech_app_dev
      DATABASE_URL: postgres://flow4tech_app:flow4tech_app_dev@db:5432/flow4tech
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      DATABASE_URL: postgres://flow4tech_app:flow4tech_app_dev@db:5432/flow4tech
      PORT: "8080"
      # Signing key of the access tokens (ticket 04): throwaway local-dev value, the host refuses to start without one outside Development/Testing.
      Flow4Tech__Tokens__AppKey: local-dev-only-token-key-do-not-use-elsewhere
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
