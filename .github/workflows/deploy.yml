# Reusable deploy of the API to one Railway environment, followed by a readiness smoke test.
# Called by ci.yml (staging, automatic after green gates) and deploy-production.yml (production, manual + approval).
#
# Per GitHub environment (staging / production) - names only, values live in GitHub, never in the repo:
#   secret   RAILWAY_TOKEN        Railway PROJECT token scoped to that Railway environment
#   variable RAILWAY_SERVICE      name or id of the API service in that environment
#   variable API_BASE_URL         public base URL of the API there, e.g. https://<domain> (no trailing slash)
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment and Railway environment name (staging or production)
        type: string
        required: true
      ref:
        description: Commit SHA to deploy
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false # never abort a rollout half way
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_SHA: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Check deploy configuration is present
        run: |
          for name in RAILWAY_TOKEN RAILWAY_SERVICE API_BASE_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the GitHub environment '$TARGET_ENVIRONMENT' (see docs/runbooks/deploy.md)"; exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Railway CLI
        # TODO(P12): pin to an exact version (and actions to commit SHAs) - see ticket 11 Pending-owner.
        run: npm install --global @railway/cli@4
      # UNVERIFIED (ticket 11 P8): the commit is handed to the app as the GIT_SHA service variable so /health/ready can report it.
      # `--skip-deploys` (set the variable without redeploying) is assumed from the Railway CLI; confirm on the first real run.
      - name: Tell the app which commit is deployed
        run: railway variables --set "GIT_SHA=$DEPLOY_SHA" --skip-deploys --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT"
      # Builds the root Dockerfile on Railway; the pre-deploy command (railway.toml) migrates with the owner credential
      # and fails the deploy if the application credential is not restricted; the healthcheck is /health/ready.
      # UNVERIFIED (P8): `--ci` is assumed to stream the BUILD and exit when it is done, not to wait for the rollout. This step is not
      # trusted to prove the deployment; the smoke test below is: it only passes when the NEW commit answers on /health/ready.
      - name: Deploy to Railway
        run: railway up --ci --service "$RAILWAY_SERVICE" --environment "$TARGET_ENVIRONMENT"
      - name: Smoke test (readiness reports the deployed commit)
        run: |
          url="${API_BASE_URL%/}/health/ready"
          expected=$(printf '%s' "$DEPLOY_SHA" | tr 'A-F' 'a-f')
          for attempt in $(seq 1 60); do
            body=$(curl -s --max-time 10 -w '\n%{http_code}' "$url" || true)
            code=${body##*$'\n'}
            commit=$(printf '%s' "${body%$'\n'*}" | jq -r '.commit // empty' 2>/dev/null | tr 'A-F' 'a-f' || true)
            echo "attempt $attempt: $url -> $code commit=${commit:-none}"
            if [ "$code" = "200" ] && [ "$commit" = "$expected" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::readiness did not return 200 with commit $expected after the deploy"; exit 1
