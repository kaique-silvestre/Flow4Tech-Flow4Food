# Single pipeline. Every job is a mandatory gate; branch protection requires the
# "gates" job (aggregates all others). Runs on every pull request and on every push to dev-v2, main-v2 and main (ADR-016).
# Deploys are not done here: Railway deploys staging (dev-v2) and production (main-v2) by itself after these checks pass ("wait for CI"), see docs/runbooks/deploy.md.
name: ci

on:
  pull_request:
  push:
    branches: [main, dev-v2, main-v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  build:
    name: build + format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build (nullable + analyzers, warnings are errors)
        run: dotnet build backend/Flow4Tech.sln -c Release
      - name: Format check
        run: dotnet format backend/Flow4Tech.sln --verify-no-changes
      # The deploy builds this same Dockerfile on Railway; a broken image must fail the PR, not the deploy.
      - name: Container image builds (API + migrator + migrations)
        run: docker build -t flow4tech-api:${{ github.sha }} .

  typecheck-frontend:
    name: typecheck (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck

  lint-frontend:
    name: lint + format (biome)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on any error (format drift included); warnings are reported, not blocking (docs/agents or CLAUDE.md, "Front lint").
      - run: pnpm lint

  # Front tests (ticket 08): vitest + testing-library in every package that has tests (design system components, app shell, generated client).
  frontend-tests:
    name: front tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vitest with coverage: fails below the floors set in each package's vitest config (F4-0103).
      - run: pnpm -r --if-present test:coverage
      - name: Keep the coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-front
          path: |
            frontend/*/coverage
            frontend/packages/*/coverage
          if-no-files-found: ignore

  # Browser tests (ticket 08): Playwright at 390x844 and 360x740 against the REAL API in docker compose, with the documented seed; screenshots are kept as an artifact.
  frontend-e2e:
    name: browser tests (playwright, real API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start PostgreSQL, migrate and start the API
        run: docker compose up --build --wait --wait-timeout 300 api
      - name: Seed the local database
        run: |
          mkdir -p frontend/app/e2e-results
          docker compose --profile e2e run --rm seed
      - run: pnpm --filter @flow4tech/app exec playwright install --with-deps chromium
      - name: Playwright
        env:
          E2E_API: "1"
          API_URL: http://127.0.0.1:8080
        run: pnpm --filter @flow4tech/app e2e
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-screenshots
          path: frontend/app/e2e-results/screenshots
          if-no-files-found: ignore
      - name: Keep the accessibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-axe
          path: frontend/app/e2e-results/axe
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose --profile e2e down -v

  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # Integration classes are named *Endpoints* / *Integration*; everything else is unit.
      - run: >
          dotnet test backend/tests/Flow4Tech.Tests/Flow4Tech.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory coverage-out
          --filter "FullyQualifiedName!~Endpoints&FullyQualifiedName!~Integration"
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-back-unit-tests
          path: coverage-out/**/coverage.cobertura.xml
          if-no-files-found: ignore

  integration-tests:
    name: integration tests (real PostgreSQL)
    runs-on: ubuntu-latest # Docker preinstalled: Testcontainers starts postgres:17-alpine
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: >
          dotnet test backend/tests/Flow4Tech.Tests/Flow4Tech.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory coverage-out
          --filter "FullyQualifiedName~Endpoints|FullyQualifiedName~Integration"
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-back-integration-tests
          path: coverage-out/**/coverage.cobertura.xml
          if-no-files-found: ignore

  architecture-tests:
    name: architecture + route permission gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet test backend/tests/Architecture/Flow4Tech.Architecture.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory coverage-out
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-back-architecture-tests
          path: coverage-out/**/coverage.cobertura.xml
          if-no-files-found: ignore

  isolation-tests:
    name: tenant isolation + RLS (real PostgreSQL)
    runs-on: ubuntu-latest # Docker preinstalled: Testcontainers starts postgres:17-alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet test backend/tests/Isolation/Flow4Tech.Isolation.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory coverage-out
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-back-isolation-tests
          path: coverage-out/**/coverage.cobertura.xml
          if-no-files-found: ignore

  outbox-tests:
    name: outbox + background jobs (real PostgreSQL)
    runs-on: ubuntu-latest # Docker preinstalled: Testcontainers starts postgres:17-alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet test backend/tests/Outbox/Flow4Tech.Outbox.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory coverage-out
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-back-outbox-tests
          path: coverage-out/**/coverage.cobertura.xml
          if-no-files-found: ignore

  organizacao-tests:
    name: layered settings (real PostgreSQL)
    runs-on: ubuntu-latest # Docker preinstalled: Testcontainers starts postgres:17-alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet test backend/tests/Organizacao/Flow4Tech.Organizacao.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory coverage-out
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-back-organizacao-tests
          path: coverage-out/**/coverage.cobertura.xml
          if-no-files-found: ignore

  audit-tests:
    name: audit trail + chain verification (real PostgreSQL)
    runs-on: ubuntu-latest # Docker preinstalled: Testcontainers starts postgres:17-alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet test backend/tests/Audit/Flow4Tech.Audit.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory coverage-out
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-back-audit-tests
          path: coverage-out/**/coverage.cobertura.xml
          if-no-files-found: ignore

  identidade-tests:
    name: identity accounts, passwords, pre-authentication under RLS (real PostgreSQL)
    runs-on: ubuntu-latest # Docker preinstalled: Testcontainers starts postgres:17-alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet test backend/tests/Identidade/Flow4Tech.Identidade.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory coverage-out
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-back-identidade-tests
          path: coverage-out/**/coverage.cobertura.xml
          if-no-files-found: ignore

  authorization-tests:
    name: authorization engine + cumulative limits (real PostgreSQL)
    runs-on: ubuntu-latest # Docker preinstalled: Testcontainers starts postgres:17-alpine
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet test backend/tests/Authorization/Flow4Tech.Authorization.Tests.csproj -c Release --collect:"XPlat Code Coverage" --results-directory coverage-out
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-back-authorization-tests
          path: coverage-out/**/coverage.cobertura.xml
          if-no-files-found: ignore

  secret-scan:
    name: secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history, not just the PR tip
      - name: Install gitleaks (version + SHA-256 pinned)
        env:
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
      - name: Scan all commits
        run: gitleaks git --redact --verbose --exit-code 1 .

  dependency-audit:
    name: vulnerable dependencies (dotnet + pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - name: dotnet vulnerable packages (direct + transitive)
        run: |
          # Fail on command error (e.g. restore failing on NU1903) and on any reported vulnerability.
          dotnet list backend/Flow4Tech.sln package --vulnerable --include-transitive > vuln.txt 2>&1 || { cat vuln.txt; exit 1; }
          cat vuln.txt
          if grep -q "has the following vulnerable packages" vuln.txt; then
            echo "::error::vulnerable NuGet packages found"; exit 1
          fi
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  openapi-contract:
    name: OpenAPI contract + generated client
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # base revision of the contract is read from history
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate OpenAPI document and TypeScript client
        run: |
          dotnet build backend/src/Api/Flow4Tech.Api.csproj -c Release -p:GenerateContract=true
          pnpm --filter @flow4tech/api-client generate
      - name: Fail if committed contract or client is stale
        run: |
          git add --intent-to-add backend/src/Api/openapi.json frontend/packages/api-client/src/schema.ts
          git diff --exit-code -- backend/src/Api/openapi.json frontend/packages/api-client/src/schema.ts \
            || { echo "::error::contract/client out of date; run the generation commands in CLAUDE.md and commit"; exit 1; }
      - name: Client tests
        run: pnpm -r --if-present test
      - name: Fail on breaking contract change (oasdiff vs base revision)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::error::base SHA is empty on a pull_request; cannot check for breaking changes"; exit 1
            fi
            echo "no base SHA (push without previous revision); skipping"; exit 0
          fi
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "new branch push, no previous revision; skipping"; exit 0
          fi
          git cat-file -e "$BASE_SHA^{commit}" || { echo "::error::base commit $BASE_SHA not found in clone"; exit 1; }
          if ! git cat-file -e "$BASE_SHA:backend/src/Api/openapi.json" 2>/dev/null; then
            echo "contract absent at base revision (first introduction); skipping"; exit 0
          fi
          mkdir -p "$RUNNER_TEMP/contract"
          git show "$BASE_SHA:backend/src/Api/openapi.json" > "$RUNNER_TEMP/contract/base.json"
          cp backend/src/Api/openapi.json "$RUNNER_TEMP/contract/head.json"
          docker run --rm -v "$RUNNER_TEMP/contract:/contract:ro" \
            tufin/oasdiff@sha256:143f8444bceb39fb4e90370ac37f1166e3c12aad1ab41260e48aebd630a5e028 \
            breaking /contract/base.json /contract/head.json --fail-on ERR

  trivy:
    # Container and IaC scanning (docs/runbooks/sast.md). Package audits (dependency-audit) do not see the OS layer of the
    # image or Dockerfile/compose misconfiguration. Binary pinned like gitleaks; no third-party action.
    name: container + config scan (trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install trivy (version + SHA-256 pinned)
        env:
          TRIVY_VERSION: 0.76.0
          TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f trivy.tar.gz trivy
      - name: Misconfiguration (Dockerfile, docker-compose)
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --ignorefile .trivyignore .
      - name: Build the deployed image
        run: docker build -t flow4tech-api:ci .
      - name: SBOM (CycloneDX) of the image
        run: trivy image --format cyclonedx --output sbom.cdx.json flow4tech-api:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
      - name: Vulnerabilities in the image (OS + .NET packages, fixable only)
        run: trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile .trivyignore flow4tech-api:ci

  dast:
    # DAST (docs/runbooks/sast.md): OWASP ZAP in safe mode (passive checks only, no attack payloads) against the real API from
    # docker compose, driven by the committed OpenAPI contract. Warnings are reported, not blocking (exit 2); only a FAIL rule
    # or a scan error (exit 1, 3) fails the job. Unauthenticated: it sees the public routes and the 401/403 behaviour.
    name: dast (zap, api)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start PostgreSQL, migrate and start the API
        run: docker compose up --build --wait --wait-timeout 300 api
      - name: ZAP API scan (safe mode)
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          code=0
          docker run --rm --network host \
            -v "$PWD/backend/src/Api:/zap/wrk-in:ro" -v "$PWD/zap-out:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-api-scan.py -t /zap/wrk-in/openapi.json -f openapi -O http://127.0.0.1:8080 -S -r report.html -J report.json || code=$?
          echo "zap exit code: $code (0 clean, 2 warnings, 1 fail rule, 3 scan error)"
          [ "$code" = 0 ] || [ "$code" = 2 ]
      - name: Keep the ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-report
          path: zap-out
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  codeql:
    # SAST (docs/runbooks/sast.md). CodeQL is free only on public repositories; if this repo becomes private the job is
    # skipped by the condition below (gates accepts "skipped") and codeql-private-notice warns. Swap plan: the runbook.
    name: sast (codeql)
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: /language:${{ matrix.language }}

  codeql-private-notice:
    name: sast notice (repo is private)
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - run: echo "::warning title=SAST reduced::Repository is private, CodeQL is skipped. Enable Semgrep as described in docs/runbooks/sast.md."

  mutation-tests:
    # Informational (F4-0106): Stryker.NET plants bugs in the pure domain rules and reports how many the no-Docker tests catch.
    # Not in `gates`; no floor yet (first runs set the baseline, pendencias.md). Pinned tool: .config/dotnet-tools.json.
    name: mutation tests (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: Authorization, config: stryker-config.json, name: permissoes }
          - { dir: Identidade, config: stryker-config.json, name: identidade }
          - { dir: Organizacao, config: stryker-config.json, name: organizacao }
          - { dir: Flow4Tech.Tests, config: stryker-comandas.json, name: comandas }
          - { dir: Flow4Tech.Tests, config: stryker-pagamentos.json, name: pagamentos }
          - { dir: Flow4Tech.Tests, config: stryker-caixa.json, name: caixa }
          - { dir: Flow4Tech.Tests, config: stryker-cardapio.json, name: cardapio }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Stryker (${{ matrix.name }})
        working-directory: backend/tests/${{ matrix.dir }}
        run: dotnet tool run dotnet-stryker -f ${{ matrix.config }} | tee stryker.log
      - name: Score in the run summary
        if: always()
        run: |
          grep -E 'final mutation score' backend/tests/${{ matrix.dir }}/stryker.log | sed 's/^/${{ matrix.name }} - /' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutation-${{ matrix.name }}
          path: backend/tests/${{ matrix.dir }}/StrykerOutput/**/mutation-report.json
          if-no-files-found: ignore

  coverage-back:
    # Informational (F4-0103): merges the Cobertura files of every test job and prints the numbers in the run summary. No floor yet: the
    # integration projects need Docker and were never measured locally, so the first runs set the baseline (pendencias.md, F4-0103).
    name: coverage report (back, informational)
    needs:
      - unit-tests
      - integration-tests
      - architecture-tests
      - isolation-tests
      - outbox-tests
      - organizacao-tests
      - audit-tests
      - identidade-tests
      - authorization-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-back-*
          path: coverage-in
      - name: Merge and summarize
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
          reportgenerator -reports:"coverage-in/**/coverage.cobertura.xml" -targetdir:coverage-report \
            -reporttypes:"MarkdownSummaryGithub;TextSummary;Cobertura" -assemblyfilters:"+Flow4Tech.*;-*.Tests"
          cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          cat coverage-report/Summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-back-merged
          path: coverage-report
          if-no-files-found: ignore

  gates:
    name: gates
    if: always()
    needs:
      - build
      - typecheck-frontend
      - lint-frontend
      - frontend-tests
      - frontend-e2e
      - unit-tests
      - integration-tests
      - architecture-tests
      - isolation-tests
      - outbox-tests
      - organizacao-tests
      - audit-tests
      - identidade-tests
      - authorization-tests
      - secret-scan
      - dependency-audit
      - openapi-contract
      - codeql
      - trivy
      - dast
    runs-on: ubuntu-latest
    steps:
      - name: All mandatory gates must succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          # "skipped" is accepted only because the codeql job is conditional on repo visibility (docs/runbooks/sast.md)
          for r in $RESULTS; do [ "$r" = "success" ] || [ "$r" = "skipped" ] || exit 1; done
